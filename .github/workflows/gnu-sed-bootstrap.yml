name: GNU sed bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'grep.sh'
      - 'scripts/whp-build/seed-bin/grep'
      - 'sed.sh'
      - 'toolchains/sed'
      - 'toolchains/automake'
      - 'toolchains/autoconf'
      - 'build.sh'
      - 'scripts/ensure-sed.py'
      - 'scripts/tests/test-sed-bootstrap-order.py'
      - 'scripts/tests/test-sed-version-staging.py'
      - 'scripts/ensure-automake.py'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/whp-config/config.py'
      - '.github/workflows/gnu-sed-bootstrap.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'grep.sh'
      - 'scripts/whp-build/seed-bin/grep'
      - 'sed.sh'
      - 'toolchains/sed'
      - 'toolchains/automake'
      - 'toolchains/autoconf'
      - 'build.sh'
      - 'scripts/ensure-sed.py'
      - 'scripts/tests/test-sed-bootstrap-order.py'
      - 'scripts/tests/test-sed-version-staging.py'
      - 'scripts/ensure-automake.py'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/whp-config/config.py'
      - '.github/workflows/gnu-sed-bootstrap.yml'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify sed bootstrap ordering
        run: python3 scripts/tests/test-sed-bootstrap-order.py

      - name: Verify sed version staging policy
        run: python3 scripts/tests/test-sed-version-staging.py

      - name: Install GNU sed bootstrap prerequisites
        shell: bash
        run: |
          brew install autoconf gettext gperf m4 texinfo wget xz
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned GNU sed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix gettext)/bin:$(brew --prefix m4)/bin:$(brew --prefix texinfo)/bin:$PATH"
          grep_seed="$(./grep.sh --print-seed)"
          export WHP_GREP_SEED="$grep_seed" GREP="$grep_seed" WHP_GREP_LOCKED=1
          export PATH="$GITHUB_WORKSPACE/scripts/whp-build/seed-bin:$PATH"
          seed="$(WHP_SED_SEED=/usr/bin/sed ./sed.sh --print-seed)"
          test -x "$seed"
          test "$(printf 'alpha\n' | WHP_SED_SEED="$seed" ./sed.sh -n 's/^alpha$/beta/p')" = beta
          automake_prefix="$(WHP_AUTOMAKE_SED_SEED="$seed" \
            python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake")"
          export PATH="$automake_prefix/bin:$PATH"
          export AUTOMAKE="$automake_prefix/bin/automake"
          export ACLOCAL="$automake_prefix/bin/aclocal"
          "$AUTOMAKE" --version | grep -q 'GNU automake'
          autoconf_prefix="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf")"
          export PATH="$autoconf_prefix/bin:$PATH"
          export AUTOCONF="$autoconf_prefix/bin/autoconf"
          export AUTOM4TE="$autoconf_prefix/bin/autom4te"
          export AUTOHEADER="$autoconf_prefix/bin/autoheader"
          export AUTORECONF="$autoconf_prefix/bin/autoreconf"
          "$AUTOCONF" --version | grep -q 'GNU Autoconf'
          if "$seed" --version 2>/dev/null | grep -q 'GNU sed'; then
            echo "expected macOS seed sed to be non-GNU" >&2
            exit 1
          fi

          sed_path="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-sed.py --build-dir "$RUNNER_TEMP/whp-sed")"
          test -x "$sed_path"
          "$sed_path" --version | grep -q 'GNU sed'
          test "$(printf 'alpha\n' | "$sed_path" -n 's/^alpha$/beta/p')" = beta
          test "$(printf 'AR=/tmp/llvm-ar|LLVM\n' |             "$sed_path" -n 's#^AR=\([^|]*\)|.*$#\1#p')" = /tmp/llvm-ar

          # Cache validation must return the same managed executable.
          again="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-sed.py --build-dir "$RUNNER_TEMP/whp-sed")"
          test "$again" = "$sed_path"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify sed bootstrap ordering
        run: python3 scripts/tests/test-sed-bootstrap-order.py

      - name: Verify sed version staging policy
        run: python3 scripts/tests/test-sed-version-staging.py

      - name: Install GNU sed bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf autopoint gettext gperf m4 texinfo wget xz-utils

      - name: Bootstrap pinned GNU sed
        shell: bash
        run: |
          set -euo pipefail
          grep_seed="$(./grep.sh --print-seed)"
          export WHP_GREP_SEED="$grep_seed" GREP="$grep_seed" WHP_GREP_LOCKED=1
          export PATH="$GITHUB_WORKSPACE/scripts/whp-build/seed-bin:$PATH"
          seed="$(./sed.sh --print-seed)"
          test -x "$seed"
          test "$(printf 'alpha\n' | WHP_SED_SEED="$seed" ./sed.sh -n 's/^alpha$/beta/p')" = beta
          automake_prefix="$(WHP_AUTOMAKE_SED_SEED="$seed" \
            python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake")"
          export PATH="$automake_prefix/bin:$PATH"
          export AUTOMAKE="$automake_prefix/bin/automake"
          export ACLOCAL="$automake_prefix/bin/aclocal"
          "$AUTOMAKE" --version | grep -q 'GNU automake'
          autoconf_prefix="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf")"
          export PATH="$autoconf_prefix/bin:$PATH"
          export AUTOCONF="$autoconf_prefix/bin/autoconf"
          export AUTOM4TE="$autoconf_prefix/bin/autom4te"
          export AUTOHEADER="$autoconf_prefix/bin/autoheader"
          export AUTORECONF="$autoconf_prefix/bin/autoreconf"
          "$AUTOCONF" --version | grep -q 'GNU Autoconf'

          sed_path="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-sed.py --build-dir "$RUNNER_TEMP/whp-sed")"
          test -x "$sed_path"
          "$sed_path" --version | grep -q 'GNU sed'
          test "$(printf 'alpha\n' | "$sed_path" -n 's/^alpha$/beta/p')" = beta
          test "$(printf 'AR=/tmp/llvm-ar|LLVM\n' | \
            "$sed_path" -n 's#^AR=\([^|]*\)|.*$#\1#p')" = /tmp/llvm-ar

          again="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-sed.py --build-dir "$RUNNER_TEMP/whp-sed")"
          test "$again" = "$sed_path"
      
      - name: Check bootstrapped GNU sed under ASan and UBSan (Linux)
        shell: bash
        run: |
          set -euo pipefail
          # Keep the normal sed installation untouched. This is an isolated
          # second build of the same pinned, already-generated sed sources.
          source_dir="$RUNNER_TEMP/whp-sed/bootstrap/sed/source"
          object_dir="$RUNNER_TEMP/whp-sed-sanitized"
          test -f "$source_dir/configure"
          test -f "$source_dir/m4/gettext.m4"
          mkdir -p "$object_dir"
          cc="$(./cc.sh --print-cc)"
          test -x "$cc"
          make_cmd="$(command -v gmake || command -v make)"
          "$make_cmd" --version | grep -Fq 'GNU Make'

          # Configuring instrumented binaries can trigger platform-specific
          # leak noise in Autoconf probes. Leak detection is enabled for the
          # actual sed runtime tests below; nothing escapes this CI step.
          (
            cd "$object_dir"
            if ! env CC="$cc" \
              CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
              LDFLAGS="-fsanitize=address,undefined" \
              ASAN_OPTIONS="detect_leaks=0:halt_on_error=1" \
              UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
              "$source_dir/configure" \
                "--prefix=$object_dir/prefix" \
                --disable-nls --disable-gcc-warnings > configure.log 2>&1; then
              tail -n 100 configure.log >&2
              exit 1
            fi
            if ! "$make_cmd" -j2 sed/sed > build.log 2>&1; then
              tail -n 100 build.log >&2
              exit 1
            fi
          )
          instrumented="$object_dir/sed/sed"
          test -x "$instrumented"
          export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1"
          export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"

          test "$(printf 'alpha\n' | "$instrumented" -n 's/^alpha$/beta/p')" = beta
          test "$(printf 'AR=/tmp/llvm-ar|LLVM\n' | \
            "$instrumented" -n 's#^AR=\([^|]*\)|.*$#\1#p')" = /tmp/llvm-ar
          test "$(printf 'alpha\0beta\0' | "$instrumented" -z 's/beta/gamma/g' | tr '\0' '|')" = 'alpha|gamma|'
          test "$(python3 -c 'import sys; sys.stdout.write("a" * 131072 + "\n")' | \
            "$instrumented" -n 's/^a*$/ok/p')" = ok
          echo 'GNU sed ASan/UBSan native runtime: verified'
