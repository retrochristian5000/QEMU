name: WHP LLVM bootstrap isolation

on:
  push:
    branches:
      - master
    paths:
      - 'build.sh'
      - 'scripts/bootstrap-native-clang.sh'
      - 'scripts/bootstrap-native-clang.bash'
      - 'scripts/bootstrap-i386-clang.sh'
      - 'scripts/bootstrap-i386-clang.bash'
      - 'scripts/bootstrap-powerpc-clang.sh'
      - 'scripts/bootstrap-powerpc-clang-base.sh'
      - 'scripts/bootstrap-powerpc-clang-base.bash'
      - 'scripts/whp-build/llvm-cmake-tools.bash'
      - 'scripts/tests/test-llvm-cmake-host-tools.py'
      - 'scripts/tests/test-llvm-incremental-bootstrap.bash'
      - 'scripts/tests/test-powerpc-llvm-no-clean-churn.bash'
      - 'scripts/whp-build/configure-seabios.bash'
      - 'scripts/tests/test-native-llvm-wiring.py'
      - 'scripts/tests/test-native-llvm-menu-handoff.py'
      - 'scripts/whp-config/config.py'
      - 'scripts/whp-config/menu-options.def'
      - 'scripts/tests/test-native-llvm-macos-default-triple.py'
      - 'scripts/tests/test-native-llvm-install-validation.py'
      - 'scripts/whp-build/macos-target-abi.bash'
      - 'scripts/ensure-sccache.py'
      - 'scripts/tests/test-sccache-bootstrap.py'
      - 'scripts/tests/test-native-llvm-arm64e-bootstrap.py'
      - 'scripts/tests/test-native-llvm-lean-profile.py'
      - 'scripts/tests/test-llvm-incremental-bootstrap.bash'
      - 'scripts/tests/test-llvm-bootstrap-isolation.bash'
      - 'scripts/tests/test-llvm-tablegen-dedup.py'
      - 'toolchains/llvm-project'
      - '.github/workflows/llvm-bootstrap-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-isolation:
    name: Check LLVM bootstrap isolation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify native LLVM menuconfig export and ABI handoff
        run: python3 scripts/tests/test-native-llvm-menu-handoff.py

      - name: Verify Darwin seed to macOS target triple upgrade
        run: python3 scripts/tests/test-native-llvm-macos-default-triple.py

      - name: Verify pinned sccacher provenance and PCH cache gate
        run: python3 scripts/tests/test-sccache-bootstrap.py

      - name: Verify installed macOS and ARM64e compiler target contracts
        run: python3 scripts/tests/test-native-llvm-install-validation.py

      - name: Fetch pinned LLVM TableGen policy source
        shell: bash
        run: |
          set -euo pipefail
          llvm_revision="$(git ls-tree HEAD toolchains/llvm-project | awk '{print $3}')"
          test -n "$llvm_revision"
          tablegen_cmake="$RUNNER_TEMP/TableGen.cmake"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/retrochristian5000/LLVM/$llvm_revision/llvm/cmake/modules/TableGen.cmake" \
            -o "$tablegen_cmake"
          printf 'WHP_LLVM_TABLEGEN_CMAKE=%s\n' "$tablegen_cmake" >> "$GITHUB_ENV"

      - name: Verify LLVM TableGen duplicate-edge policy
        run: python3 scripts/tests/test-llvm-tablegen-dedup.py

      - name: Verify native LLVM wiring and CMake cache boundaries
        run: python3 scripts/tests/test-native-llvm-wiring.py

      - name: Verify native LLVM arm64e bootstrap policy
        run: python3 scripts/tests/test-native-llvm-arm64e-bootstrap.py

      - name: Verify native LLVM lean profile
        run: python3 scripts/tests/test-native-llvm-lean-profile.py

      - name: Verify standalone LLVM CMake/Ninja host-tool selection
        run: python3 scripts/tests/test-llvm-cmake-host-tools.py

      - name: Verify native LLVM incremental bootstrap contract
        run: bash scripts/tests/test-llvm-incremental-bootstrap.bash scripts/bootstrap-native-clang.bash 'native LLVM'

      - name: Verify i386 LLVM incremental bootstrap contract
        run: bash scripts/tests/test-llvm-incremental-bootstrap.bash scripts/bootstrap-i386-clang.bash 'i386-none-elf LLVM'

      - name: Verify LLVM bootstrap environment boundary
        run: bash scripts/tests/test-llvm-bootstrap-isolation.bash
