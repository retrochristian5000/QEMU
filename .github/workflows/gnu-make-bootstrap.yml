name: WHP GNU Make bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'toolchains/make'
      - 'toolchains/automake'
      - 'toolchains/autoconf'
      - 'scripts/ensure-automake.py'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/ensure-make.py'
      - 'scripts/tests/test-autoconf-bootstrap.py'
      - 'scripts/tests/test-make-dependency-policy.py'
      - 'scripts/tests/test-make-gnulib-cache.py'
      - 'docs/devel/whp-dependency-ledger.rst'
      - '.github/workflows/gnu-make-bootstrap.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'toolchains/make'
      - 'toolchains/automake'
      - 'toolchains/autoconf'
      - 'scripts/ensure-automake.py'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/ensure-make.py'
      - 'scripts/tests/test-autoconf-bootstrap.py'
      - 'scripts/tests/test-make-dependency-policy.py'
      - 'scripts/tests/test-make-gnulib-cache.py'
      - 'docs/devel/whp-dependency-ledger.rst'
      - '.github/workflows/gnu-make-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: whp-gnu-make-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install bootstrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install autoconf automake gettext m4 pkg-config texinfo
            echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              autoconf automake autopoint gettext gcc m4 make pkg-config texinfo
          fi

      - name: Prepare managed Automake and Autoconf
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix gettext)/bin:$(brew --prefix m4)/bin:$(brew --prefix texinfo)/bin:$PATH"
          fi
          seed="$(./sed.sh --print-seed)"
          automake_prefix="$(
            WHP_SED_SEED="$seed" \
              python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake"
          )"
          export AUTOMAKE="$automake_prefix/bin/automake"
          export ACLOCAL="$automake_prefix/bin/aclocal"
          export PATH="$automake_prefix/bin:$PATH"

          autoconf_prefix="$(
            AUTOCONF=false AUTOM4TE=false WHP_SED_SEED="$seed" \
              python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf"
          )"
          export AUTOCONF="$autoconf_prefix/bin/autoconf"
          export AUTOM4TE="$autoconf_prefix/bin/autom4te"
          export AUTOHEADER="$autoconf_prefix/bin/autoheader"
          export AUTORECONF="$autoconf_prefix/bin/autoreconf"
          export PATH="$autoconf_prefix/bin:$PATH"

          "$AUTOMAKE" --version | grep -Fq 'GNU automake'
          "$AUTOCONF" --version | grep -Fq 'GNU Autoconf'

          {
            echo "AUTOMAKE=$AUTOMAKE"
            echo "ACLOCAL=$ACLOCAL"
            echo "AUTOCONF=$AUTOCONF"
            echo "AUTOM4TE=$AUTOM4TE"
            echo "AUTOHEADER=$AUTOHEADER"
            echo "AUTORECONF=$AUTORECONF"
            echo "PATH=$autoconf_prefix/bin:$automake_prefix/bin:$PATH"
          } >> "$GITHUB_ENV"

      - name: Verify static Make bootstrap policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ensure-autoconf.py \
            scripts/ensure-make.py \
            scripts/tests/test-autoconf-bootstrap.py \
            scripts/tests/test-make-dependency-policy.py \
            scripts/tests/test-make-gnulib-cache.py
          python3 scripts/tests/test-autoconf-bootstrap.py
          python3 scripts/tests/test-make-dependency-policy.py
          python3 scripts/tests/test-make-gnulib-cache.py

      - name: Bootstrap managed GNU Make with target poison
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/whp-make"
          seed_make="$(command -v gmake || command -v make)"
          "$seed_make" --version | grep -Fq 'GNU Make'

          export WHP_MAKE_SEED="$seed_make"
          export CC_FOR_BUILD="$(./cc.sh --print-cc)"
          export CONFIG_SHELL=/bin/sh

          # These values model target/cross state that must never leak into the
          # build-host Make configure probe.
          export AR=/bin/false
          export ARFLAGS=whp-target-poison
          export RANLIB=/bin/false
          export CPP=/bin/false
          export CXXCPP=/bin/false
          export LIBS=-lwhp_target_poison
          export build_alias=whp-target-build
          export host_alias=whp-target-host
          export target_alias=whp-target-target
          export CFLAGS=-fwhp-target-poison
          export CXXFLAGS=-fwhp-target-poison
          export CPPFLAGS=-D_WHP_TARGET_POISON=
          export LDFLAGS=-Wl,--whp-target-poison
          export PKG_CONFIG_PATH=/whp/target/pkgconfig
          export PKG_CONFIG_LIBDIR=/whp/target/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/whp/target/sysroot
          export CONFIG_SITE=/whp/target/config.site
          export ac_cv_func_waitpid=whp_target_poison
          export make_cv_job_server=whp_target_poison

          prefix="$(python3 scripts/ensure-make.py --build-dir "$build_root")"
          test "$prefix" = "$build_root/deps/make"
          test -x "$prefix/bin/make"
          "$prefix/bin/make" --version | grep -Fq 'GNU Make'

          marker="$prefix/.whp-make-bootstrap"
          test -f "$marker"
          grep -Fxq 'MAKE_BOOTSTRAP_SCHEMA=6' "$marker"
          grep -Fq 'CONFIG_SHELL=/bin/sh|' "$marker"
          grep -Fq 'CONFIGURE_ARGS=--disable-dependency-tracking --disable-nls --without-guile' "$marker"

          test -f "$build_root/bootstrap/make/build/build.cfg"
          test -f "$build_root/bootstrap/make/build/config.status"
          test -f "$build_root/bootstrap/make/build/Makefile"
          test -f "$build_root/bootstrap/make/build/lib/Makefile"
          test -f "$build_root/bootstrap/make/build/src/config.h"
          test -f "$build_root/bootstrap/make/build/build.sh"

          generated="$build_root/cache/make-generated"
          test -f "$generated/.whp-make-generated"
          grep -Fxq 'MAKE_GENERATED_SCHEMA=2' "$generated/.whp-make-generated"
          grep -Fq 'ACLOCAL_PATH=' "$generated/.whp-make-generated"
          test -f "$generated/configure"
          test -f "$generated/Makefile.in"
          test -f "$generated/lib/Makefile.in"
          test -f "$generated/src/config.h.in"

      - name: Reconfigure Make without rerunning Autoconf or refetching gnulib
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/whp-make"
          seed_make="$(command -v gmake || command -v make)"
          real_cc="$(./cc.sh --print-cc)"
          cc_wrapper="$RUNNER_TEMP/whp-make-cc-wrapper"
          {
            printf '%s\n' '#!/bin/sh'
            printf 'exec %q "$@"\n' "$real_cc"
          } > "$cc_wrapper"
          chmod +x "$cc_wrapper"

          export WHP_MAKE_SEED="$seed_make"
          export CC_FOR_BUILD="$cc_wrapper"
          export CONFIG_SHELL=/bin/sh

          log="$RUNNER_TEMP/make-reconfigure.log"
          prefix="$(
            python3 scripts/ensure-make.py --build-dir "$build_root" \
              2> >(tee "$log" >&2)
          )"
          test "$prefix" = "$build_root/deps/make"
          "$prefix/bin/make" --version | grep -Fq 'GNU Make'
          grep -Fq 'WHP GNU Make gnulib cache: reused' "$log"
          grep -Fq 'WHP GNU Make generated source cache: reused' "$log"
          grep -Fq "CC=$cc_wrapper:" "$prefix/.whp-make-bootstrap"
          grep -Fq 'CONFIG_SHELL=/bin/sh|' "$prefix/.whp-make-bootstrap"
          if grep -Fq 'autoreconf' "$log"; then
            printf '%s\n'               'error: configure-only GNU Make rebuild reran Autoconf generation' >&2
            exit 1
          fi
