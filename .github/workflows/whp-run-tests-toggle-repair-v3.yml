name: WHP RUN_TESTS source repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/whp-run-tests-toggle-repair-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify and push source-side RUN_TESTS repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # The integration harness deliberately points SOURCE_DIR at a fake tree
          # during configure tests. Restore the repository before loading real
          # production helpers later in the same test process.
          path = Path('scripts/tests/test-whp-config-integration.bash')
          text = path.read_text(encoding='utf-8')
          old = '''# Verify explicit host-feature switches feed configure, while auto does not.
          source "$ROOT/scripts/whp-build/common.bash"
          '''
          new = '''# Verify explicit host-feature switches feed configure, while auto does not.
          # Earlier configure tests intentionally redirect SOURCE_DIR to a fake tree.
          # Restore the real repository before loading the production build helpers.
          SOURCE_DIR="$ROOT"
          source "$ROOT/scripts/whp-build/common.bash"
          '''
          if text.count(old) != 1:
              raise SystemExit('integration harness boundary marker changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Reuse the already-exercised red/green repair body. It locally edits four
          # workflow files too; restore those before committing because Actions tokens
          # are not allowed to push workflow changes in this repository.
          workflow = Path('.github/workflows/whp-run-tests-toggle-repair.yml').read_text(encoding='utf-8')
          marker = '      - name: Red-green RUN_TESTS repair\n        shell: bash\n        run: |\n'
          if workflow.count(marker) != 1:
              raise SystemExit('original RUN_TESTS repair workflow shape changed unexpectedly')
          block = workflow.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line:
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected repair block line: {line!r}')
          script = '\n'.join(lines) + '\n'

          expected_start = script.index('expected="$(cat <<\'EOF\' | sort\n')
          expected_end = script.index('\nactual="$(git diff --name-only | sort)"', expected_start)
          source_expected = '''git restore -- \\
  .github/workflows/ci.yml \\
  .github/workflows/native-llvm-macos.yml \\
  .github/workflows/whp-config.yml \\
  .github/workflows/whp-portable-build.yml

expected="$(cat <<'EOF' | sort
scripts/tests/test-whp-config-integration.bash
scripts/tests/test-whp-config.py
scripts/whp-build/build-targets.bash
scripts/whp-build/portable-build.py
scripts/whp-build/prepare-build.bash
scripts/whp-config/config.py
EOF
)"'''
          script = script[:expected_start] + source_expected + script[expected_end:]

          add_start = script.index('git add -- \\\n')
          commit_marker = "\ngit commit -m 'build: let users control QEMU tests'"
          add_end = script.index(commit_marker, add_start)
          source_add = '''git add -- \\
scripts/tests/test-whp-config-integration.bash \\
scripts/tests/test-whp-config.py \\
scripts/whp-build/build-targets.bash \\
scripts/whp-build/portable-build.py \\
scripts/whp-build/prepare-build.bash \\
scripts/whp-config/config.py'''
          script = script[:add_start] + source_add + script[add_end:]

          Path('/tmp/whp-run-tests-source-repair.sh').write_text(script, encoding='utf-8')
          PY

          bash /tmp/whp-run-tests-source-repair.sh
