name: WHP Autoconf bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'toolchains/autoconf'
      - 'toolchains/automake'
      - 'seeds/sed.sh'
      - 'seeds/m4.sh'
      - 'seeds/gnum4.sh'
      - 'seeds/brew.sh'
      - 'seeds/yacc.sh'
      - 'scripts/tests/test-brew-seed.py'
      - 'scripts/tests/test-yacc-seed.py'
      - 'seeds/automake.sh'
      - 'seeds/autom4te.sh'
      - 'seeds/autoconf.sh'
      - 'scripts/tests/test-autoconf-seed.py'
      - 'seeds/perl.sh'
      - 'scripts/tests/test-perl-seed.py'
      - 'scripts/tests/test-perl-autotools-boundary.py'
      - 'scripts/tests/test-autom4te-seed.py'
      - 'scripts/tests/test-automake-seed.py'
      - 'scripts/tests/test-m4-seed.py'
      - 'scripts/tests/test-gnum4-seed.py'
      - 'scripts/ensure-perl.py'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/ensure-automake.py'
      - 'scripts/tests/test-automake-seed-cycle.py'
      - 'scripts/tests/test-autoconf-bootstrap.py'
      - 'scripts/tests/test-ensure-autoconf-validation.py'
      - 'scripts/tests/test-autoconf-rollback.py'
      - 'scripts/tests/test-automake-rollback.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/tests/test-bootstrap-env.py'
      - '.github/workflows/autoconf-bootstrap.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'toolchains/autoconf'
      - 'toolchains/automake'
      - 'seeds/sed.sh'
      - 'seeds/m4.sh'
      - 'seeds/gnum4.sh'
      - 'seeds/brew.sh'
      - 'seeds/yacc.sh'
      - 'scripts/tests/test-brew-seed.py'
      - 'scripts/tests/test-yacc-seed.py'
      - 'seeds/automake.sh'
      - 'seeds/autom4te.sh'
      - 'seeds/autoconf.sh'
      - 'scripts/tests/test-autoconf-seed.py'
      - 'seeds/perl.sh'
      - 'scripts/tests/test-perl-seed.py'
      - 'scripts/tests/test-perl-autotools-boundary.py'
      - 'scripts/tests/test-autom4te-seed.py'
      - 'scripts/tests/test-automake-seed.py'
      - 'scripts/tests/test-m4-seed.py'
      - 'scripts/tests/test-gnum4-seed.py'
      - 'scripts/ensure-perl.py'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/ensure-automake.py'
      - 'scripts/tests/test-automake-seed-cycle.py'
      - 'scripts/tests/test-autoconf-bootstrap.py'
      - 'scripts/tests/test-ensure-autoconf-validation.py'
      - 'scripts/tests/test-autoconf-rollback.py'
      - 'scripts/tests/test-automake-rollback.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/tests/test-bootstrap-env.py'
      - '.github/workflows/autoconf-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - name: Install seed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install autoconf m4 texinfo
            echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y autoconf m4 texinfo
          fi

      - name: Test Homebrew, GNU M4 and Bison seed boundaries
        run: |
          /bin/sh -n seeds/brew.sh seeds/m4.sh seeds/gnum4.sh seeds/yacc.sh
          python3 scripts/tests/test-brew-seed.py
          python3 scripts/tests/test-m4-seed.py
          python3 scripts/tests/test-gnum4-seed.py
          python3 scripts/tests/test-yacc-seed.py

      - name: Verify Autoconf source bootstrap substitutions
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init toolchains/autoconf
          /bin/sh -n toolchains/autoconf/bootstrap
          /bin/sh -n toolchains/autoconf/tests/bootstrap-host-paths.sh
          /bin/sh toolchains/autoconf/tests/bootstrap-host-paths.sh

      - name: Validate fork Makefile recipes and failure recovery
        run: python3 toolchains/autoconf/tests/makefile-rules-smoke.py

      - name: Verify preflight, cache and runtime validation guards
        run: python3 scripts/tests/test-ensure-autoconf-validation.py

      - name: Verify static Autoconf wiring
        run: python3 scripts/tests/test-autoconf-bootstrap.py

      - name: Verify Autoconf install rollback and recovery
        run: python3 scripts/tests/test-autoconf-rollback.py

      - name: Verify Automake M4 wiring and install recovery
        run: python3 scripts/tests/test-automake-rollback.py

      - name: Verify independent Autoconf bootstrap seed
        run: python3 scripts/tests/test-automake-seed-cycle.py

      - name: Verify coherent Automake seed and aclocal forwarding
        run: python3 scripts/tests/test-automake-seed.py

      - name: Verify direct autom4te seed and Autoconf release matching
        run: python3 scripts/tests/test-autom4te-seed.py

      - name: Verify native Autoconf entry and shared pair validation
        run: |
          /bin/sh -n seeds/autoconf.sh
          /bin/sh -n seeds/autom4te.sh
          python3 scripts/tests/test-autoconf-seed.py

      - name: Verify native Perl seed semantics
        run: |
          python3 scripts/tests/test-perl-seed.py
          python3 scripts/tests/test-perl-autotools-boundary.py -v

      - name: Reject corrupt bootstrap variables
        run: python3 scripts/tests/test-bootstrap-env.py

      - name: Bootstrap managed Automake then Autoconf
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; printf "WHP Autoconf CI: status=%s line=%s command=%s\n" "$rc" "$LINENO" "$BASH_COMMAND" >&2' ERR
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix m4)/bin:$(brew --prefix texinfo)/bin:$PATH"
          fi
          seed="$(./seeds/sed.sh --print-seed)"
          automake_prefix="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake")"
          export AUTOMAKE="$automake_prefix/bin/automake"
          export ACLOCAL="$automake_prefix/bin/aclocal"
          export PATH="$automake_prefix/bin:$PATH"
          "$AUTOMAKE" --version | grep -q 'GNU automake'
          automake_m4="$(/bin/sh ./seeds/gnum4.sh --print-seed)"
          grep -Fxq "M4_PATH=$automake_m4" \
            "$automake_prefix/.whp-automake-bootstrap"
          grep -Fxq "AUTOMAKE_BOOTSTRAP_SCHEMA=6" \
            "$automake_prefix/.whp-automake-bootstrap"

          expected_m4=
          poison_bin=
          if [[ "$RUNNER_OS" == macOS ]]; then
            expected_m4="$(brew --prefix m4)/bin/m4"
            test -x "$expected_m4"
            poison_bin="$RUNNER_TEMP/poison-m4"
            mkdir -p "$poison_bin"
            printf '%s\n' \
              '#!/bin/sh' \
              'if [ "${1:-}" = --gnu ]; then shift; fi' \
              'if [ "${1:-}" = --version ]; then' \
              "  printf '%s\\n' 'GNU M4 99.99 poison'" \
              '  exit 0' \
              'fi' \
              "printf '%s\\n' 'error: poison gm4 was executed' >&2" \
              'exit 99' > "$poison_bin/gm4"
            chmod +x "$poison_bin/gm4"
            export PATH="$poison_bin:$PATH"
          fi

          autoconf_prefix="$(AUTOCONF=false AUTOM4TE=false WHP_SED_SEED="$seed" \
            python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf")"
          test -x "$autoconf_prefix/bin/autoconf"
          test -x "$autoconf_prefix/bin/autom4te"
          test -x "$autoconf_prefix/bin/autoheader"
          test -x "$autoconf_prefix/bin/autoreconf"
          "$autoconf_prefix/bin/autoconf" --version | grep -q 'GNU Autoconf'
          "$autoconf_prefix/bin/autom4te" --version | grep -q 'GNU Autoconf'

          # Verify the pinned source's string path, not just a version banner.
          # M4 lives in a shell-sensitive directory (spaces and apostrophe);
          # config.status must preserve literal backslashes from AC_SUBST.
          /bin/sh toolchains/autoconf/tests/autom4te-shell-strings.sh \
            "$autoconf_prefix/bin/autom4te" "$automake_m4" \
            "$autoconf_prefix/bin/autoconf"

          # Verify generated POSIX shell set positional-parameter handling.
          # Dash-prefixed filenames must not become set builtin options.
          /bin/sh toolchains/autoconf/tests/positional-set-guard.sh \
            "$autoconf_prefix/bin/autoupdate" \
            "$autoconf_prefix/bin/autoconf"

          if [[ "$RUNNER_OS" == macOS ]]; then
            grep -Fxq "M4_PATH=$expected_m4" "$autoconf_prefix/.whp-autoconf-bootstrap"
            grep -Fq 'M4_VERSION=m4 (GNU M4)' "$autoconf_prefix/.whp-autoconf-bootstrap"
            grep -Fq "$expected_m4" "$autoconf_prefix/bin/autom4te"
            if grep -Fq "$poison_bin/gm4" "$autoconf_prefix/bin/autom4te"; then
              printf '%s\n' 'error: Autoconf embedded PATH gm4 instead of Homebrew GNU M4' >&2
              exit 1
            fi
          fi

          runtime_smoke="$RUNNER_TEMP/autoconf-runtime-smoke"
          mkdir -p "$runtime_smoke"
          # Exercise the updated Autoconf C-language macros, not only
          # AC_INIT.  An explicit C standard must survive configuration.
          printf '%s\n' \
            'AC_INIT([whp-runtime],[1])' \
            'AC_PROG_CC' \
            'AC_CHECK_FUNCS([gettimeofday])' \
            'AC_FUNC_ALLOCA' \
            'AC_OUTPUT' > "$runtime_smoke/configure.ac"
          (
            cd "$runtime_smoke"
            env -u M4 "$autoconf_prefix/bin/autoconf"
            test -f configure
            CFLAGS=-std=c11 /bin/sh ./configure > configure-smoke.log 2>&1 || {
              cat configure-smoke.log >&2
              exit 1
            }
            test -f config.log
            # AC_FUNC_ALLOCA no longer implies the obsolete size_t probe.
            if grep -Fq 'checking for size_t' configure; then
              printf '%s\n' 'error: alloca unexpectedly generated legacy size_t check' >&2
              exit 1
            fi
          )

          # The legacy macro remains available for projects requesting it,
          # but ordinary consumers should use AC_CHECK_TYPES explicitly.
          legacy_smoke="$RUNNER_TEMP/autoconf-legacy-size-t-smoke"
          mkdir -p "$legacy_smoke"
          printf '%s\n' \
            'AC_INIT([whp-legacy-size-t],[1])' \
            'AC_PROG_CC' \
            'AC_TYPE_SIZE_T' \
            'AC_OUTPUT' > "$legacy_smoke/configure.ac"
          (
            cd "$legacy_smoke"
            env -u M4 "$autoconf_prefix/bin/autoconf"
            CFLAGS=-std=c11 /bin/sh ./configure > configure-smoke.log 2>&1 || {
              cat configure-smoke.log >&2
              exit 1
            }
            test -f config.log
          )

          # The installed autoheader must handle shell-sensitive paths and
          # use its selected autom4te rather than assuming safe single quotes.
          quote_dir="$RUNNER_TEMP/autoheader's path with spaces"
          quote_bin="$RUNNER_TEMP/autom4te's tools"
          mkdir -p "$quote_dir" "$quote_bin"
          ln -s "$autoconf_prefix/bin/autom4te" "$quote_bin/autom4te"
          printf '%s\n' \
            'AC_INIT([whp-autoheader-quote],[1])' \
            'AC_CONFIG_HEADERS([config.h])' \
            'AC_DEFINE([WHP_AUTOHEADER_QUOTE],[1],[Quoted invocation works.])' \
            'AC_OUTPUT' > "$quote_dir/configure.ac"
          (
            cd "$quote_dir"
            AUTOM4TE="$quote_bin/autom4te" \
              "$autoconf_prefix/bin/autoheader" --force
            grep -Fq '#undef WHP_AUTOHEADER_QUOTE' config.h.in
            # Verbose debug output is read directly in Perl, not by sed.
            TMPDIR="$quote_dir" AUTOM4TE="$quote_bin/autom4te" \
              "$autoconf_prefix/bin/autoheader" --force --verbose --debug \
              > autoheader.debug.log 2>&1
            grep -Fq 'traces.pl' autoheader.debug.log
          )

          # Exercise the fork's m4/m4.m4 under a shell-sensitive PATH.
          # Discovery and explicit M4 selection must both retain the
          # executable path instead of splitting it on spaces.
          m4_space_bin="$RUNNER_TEMP/m4's tools with spaces"
          m4_macro_smoke="$RUNNER_TEMP/whp-m4-macro-smoke"
          mkdir -p "$m4_space_bin" "$m4_macro_smoke"
          ln -s "$(command -v m4)" "$m4_space_bin/m4"
          ln -s "$GITHUB_WORKSPACE/toolchains/autoconf/m4/m4.m4" \
            "$m4_macro_smoke/gnu-m4.m4"
          printf '%s\n' \
            'AC_INIT([whp-m4-macro-smoke],[1])' \
            'm4_include([gnu-m4.m4])' \
            'AC_PROG_GNU_M4' \
            'AC_MSG_NOTICE([selected-m4: $M4])' \
            'AC_MSG_NOTICE([m4-gnu-mode: $M4_GNU])' \
            'AC_OUTPUT' > "$m4_macro_smoke/configure.ac"
          (
            cd "$m4_macro_smoke"
            env -u M4 "$autoconf_prefix/bin/autoconf"
            PATH="$m4_space_bin:$PATH" /bin/sh ./configure > m4-discovery.log 2>&1 || {
              cat m4-discovery.log >&2
              exit 1
            }
            grep -Fq "selected-m4: $m4_space_bin/m4" m4-discovery.log
            M4="$m4_space_bin/m4" /bin/sh ./configure > m4-explicit.log 2>&1 || {
              cat m4-explicit.log >&2
              exit 1
            }
            grep -Fq "selected-m4: $m4_space_bin/m4" m4-explicit.log
            grep -Fq 'm4-gnu-mode: --gnu' m4-explicit.log
          )

          fake_m4="$RUNNER_TEMP/non-gnu-m4"
          cat > "$fake_m4" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = --gnu ] && [ "${2:-}" = --version ]; then
            printf '%s\n' 'm4 (Apple Inc.) 1.4.18'
            exit 0
          fi
          exit 2
          EOF
          chmod +x "$fake_m4"
          if (
            cd toolchains/autoconf
            M4="$fake_m4" ./bootstrap >"$RUNNER_TEMP/non-gnu-m4.out" 2>&1
          ); then
            printf '%s\n' 'error: Autoconf source bootstrap accepted an incapable M4' >&2
            exit 1
          fi
          grep -Fq 'lacks required Autoconf features' "$RUNNER_TEMP/non-gnu-m4.out"

          again="$(AUTOCONF=false AUTOM4TE=false WHP_SED_SEED="$seed" \
            python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf")"
          test "$again" = "$autoconf_prefix"
