name: WHP Autoconf bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'toolchains/autoconf'
      - 'toolchains/automake'
      - 'sed.sh'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/ensure-automake.py'
      - 'scripts/tests/test-autoconf-bootstrap.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - '.github/workflows/autoconf-bootstrap.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'toolchains/autoconf'
      - 'toolchains/automake'
      - 'sed.sh'
      - 'scripts/ensure-autoconf.py'
      - 'scripts/ensure-automake.py'
      - 'scripts/tests/test-autoconf-bootstrap.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - '.github/workflows/autoconf-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - name: Install seed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install autoconf m4 texinfo
            echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y autoconf m4 texinfo
          fi

      - name: Verify static Autoconf wiring
        run: python3 scripts/tests/test-autoconf-bootstrap.py

      - name: Bootstrap managed Automake then Autoconf
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix m4)/bin:$(brew --prefix texinfo)/bin:$PATH"
          fi
          seed="$(./sed.sh --print-seed)"
          automake_prefix="$(WHP_SED_SEED="$seed" \
            python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake")"
          export AUTOMAKE="$automake_prefix/bin/automake"
          export ACLOCAL="$automake_prefix/bin/aclocal"
          export PATH="$automake_prefix/bin:$PATH"
          "$AUTOMAKE" --version | grep -q 'GNU automake'

          expected_m4=
          poison_bin=
          if [[ "$RUNNER_OS" == macOS ]]; then
            expected_m4="$(brew --prefix m4)/bin/m4"
            test -x "$expected_m4"
            poison_bin="$RUNNER_TEMP/poison-m4"
            mkdir -p "$poison_bin"
            printf '%s\n' \
              '#!/bin/sh' \
              'if [ "${1:-}" = --gnu ]; then shift; fi' \
              'if [ "${1:-}" = --version ]; then' \
              "  printf '%s\\n' 'GNU M4 99.99 poison'" \
              '  exit 0' \
              'fi' \
              "printf '%s\\n' 'error: poison gm4 was executed' >&2" \
              'exit 99' > "$poison_bin/gm4"
            chmod +x "$poison_bin/gm4"
            export PATH="$poison_bin:$PATH"
          fi

          autoconf_prefix="$(AUTOCONF=false AUTOM4TE=false WHP_SED_SEED="$seed" \
            python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf")"
          test -x "$autoconf_prefix/bin/autoconf"
          test -x "$autoconf_prefix/bin/autom4te"
          test -x "$autoconf_prefix/bin/autoheader"
          test -x "$autoconf_prefix/bin/autoreconf"
          "$autoconf_prefix/bin/autoconf" --version | grep -q 'GNU Autoconf'
          "$autoconf_prefix/bin/autom4te" --version | grep -q 'GNU Autoconf'

          if [[ "$RUNNER_OS" == macOS ]]; then
            grep -Fq "M4=$expected_m4:" "$autoconf_prefix/.whp-autoconf-bootstrap"
            grep -Fq "$expected_m4" "$autoconf_prefix/bin/autom4te"
            if grep -Fq "$poison_bin/gm4" "$autoconf_prefix/bin/autom4te"; then
              printf '%s\n' 'error: Autoconf embedded PATH gm4 instead of Homebrew GNU M4' >&2
              exit 1
            fi
          fi

          again="$(AUTOCONF=false AUTOM4TE=false WHP_SED_SEED="$seed" \
            python3 scripts/ensure-autoconf.py --build-dir "$RUNNER_TEMP/whp-autoconf")"
          test "$again" = "$autoconf_prefix"
