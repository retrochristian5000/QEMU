name: WHP SeaBIOS 128 KiB ROM budget

on:
  push:
    branches:
      - master
    paths:
      - 'roms/seabios'
      - 'roms/config.seabios-128k'
      - 'roms/config.seabios-128k-external-ide'
      - 'roms/config.seabios-microvm'
      - 'roms/Makefile'
      - 'roms/ide-optionrom/**'
      - 'scripts/tests/test-ide-optionrom.py'
      - 'scripts/meson-build-seabios.bash'
      - 'pc-bios/meson.build'
      - 'scripts/whp-build/seabios-clang-gcc.bash'
      - 'scripts/tests/test-seabios-clang-abi.py'
      - 'toolchains/llvm-project'
      - '.github/workflows/seabios-rom-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seabios-rom-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rom-budget:
    name: Build pinned isapc and microvm ROMs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out QEMU ROM configurations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            roms
            scripts/whp-build
            scripts/tests
            scripts/meson-build-seabios.bash
            pc-bios/meson.build
          submodules: false

      - name: Fetch pinned SeaBIOS source
        run: |
          git submodule update --init --depth 1 roms/seabios
          expected="$(git rev-parse HEAD:roms/seabios)"
          actual="$(git -C roms/seabios rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Verify source-based firmware version metadata
        run: python3 roms/seabios/scripts/test-buildversion.py

      - name: Inventory forced and ordinary inline declarations
        run: |
          set -eu
          # Use the pinned source tree, not a potentially stale search index.
          git -C roms/seabios grep -n -E '\b(__always_inline|always_inline|__always_inline__)\b' \
            -- src vgasrc || test "$?" -eq 1
          printf 'Ordinary inline matching source lines: '
          git -C roms/seabios grep -n -E '\b(inline|__inline|__inline__)\b' \
            -- src vgasrc | wc -l

      - name: Install firmware build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils clang-18 lld-18 nasm python3 qemu-system-x86

      - name: Verify default IDE option ROM build and checksums
        run: python3 scripts/tests/test-ide-optionrom.py --clang clang-18 --lld ld.lld-18

      - name: Audit both 128 KiB ROM variants without disabling features
        env:
          WHP_ROM_SIZE_REPORT: '1'
        run: |
          set -eu
          root="$RUNNER_TEMP/whp-seabios-rom-budget"
          failed=0
          for variant in seabios-128k seabios-microvm; do
            printf '%s\n' "=== Building $variant with its existing QEMU config ==="
            if make -C roms "build-seabios-config-$variant" \
                    SEABIOS_CROSS_PREFIX= "SEABIOS_BUILD_ROOT=$root"; then
              image="$root/$variant/bios.bin"
              if test ! -f "$image"; then
                printf 'error: %s did not produce a BIOS image\n' "$variant" >&2
                failed=1
              else
                bytes="$(wc -c < "$image")"
                printf '%s: %s bytes (131072-byte budget)\n' "$variant" "$bytes"
                if test "$bytes" -ne 131072; then
                  printf 'error: %s does not have its configured 128 KiB size\n' \
                    "$variant" >&2
                  failed=1
                fi
              fi
            else
              failed=1
            fi
          done
          exit "$failed"

      - name: Compare Clang -Os code generation against GCC
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_SIZE_OPT: Os
          SEABIOS_CLANG_INLINE_PROFILE: Default
        run: |
          set -eu
          # Hold GNU binutils and the exact 128 KiB configurations constant.
          # Only the compiler switches to the existing SeaBIOS Clang wrapper.
          # Native LLVM/LLD is a separate linker comparison.
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-clang-rom-budget"
          gcc_root="$RUNNER_TEMP/whp-seabios-rom-budget"
          mkdir -p "$prefix/llvm/bin" "$prefix/bin"
          clang="$(command -v clang-18)"
          test -x "$clang"
          ln -s "$clang" "$prefix/llvm/bin/clang"
          cp scripts/whp-build/seabios-clang-gcc.bash \
            "$prefix/bin/i386-none-elf-gcc"
          chmod 700 "$prefix/bin/i386-none-elf-gcc"
          for tool in cpp as objcopy objdump strip; do
            ln -s "$(command -v "$tool")" \
              "$prefix/bin/i386-none-elf-$tool"
          done
          # GNU ld's host default is x86_64, but our Clang objects are ELF32.
          # Match the i386-none-elf linker default without switching to LLD.
          cat > "$prefix/bin/i386-none-elf-ld" <<'LINKER'
          #!/bin/sh
          exec ld -m elf_i386 "$@"
          LINKER
          chmod 700 "$prefix/bin/i386-none-elf-ld"
          printf 'Clang: %s\n' "$("$clang" --version | head -n 1)"
          printf 'GCC: %s\n' "$(gcc --version | head -n 1)"
          printf 'Linker: %s\n' "$(ld --version | head -n 1)"
          failed=0
          for variant in seabios-128k seabios-microvm; do
            log="$RUNNER_TEMP/$variant-clang-rom.log"
            printf '\n=== Comparing %s with Clang and GNU binutils ===\n' \
              "$variant"
            if make -C roms "build-seabios-config-$variant" \
                "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
                "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
              gcc_image="$gcc_root/$variant/bios.bin.raw"
              clang_image="$root/$variant/bios.bin.raw"
              if test ! -s "$gcc_image" || test ! -s "$clang_image"; then
                printf 'error: missing unpadded ROM for %s\n' "$variant" >&2
                failed=1
              else
                gcc_bytes="$(wc -c < "$gcc_image")"
                clang_bytes="$(wc -c < "$clang_image")"
                delta="$((clang_bytes - gcc_bytes))"
                printf '%s: GCC=%s Clang=%s delta=%+d bytes\n' \
                  "$variant" "$gcc_bytes" "$clang_bytes" "$delta"
                printf '%s: Clang free capacity=%s bytes\n' \
                  "$variant" "$((131072 - clang_bytes))"
              fi
              grep -E '^(Version:|ROM version metadata:|Fixed space:|16bit size:|32bit |Lowmem size:|f-segment var size:|ROM size audit:|Total size:)' \
                "$log" || true
            else
              clang_image="$root/$variant/bios.bin.raw"
              # A compiler experiment should report a measured ROM overflow,
              # not misclassify it as a compiler or linker failure. Other
              # build failures remain fatal.
              if test -s "$clang_image" &&
                 grep -Fq "ROM doesn't fit (" "$log" &&
                 test "$(wc -c < "$clang_image")" -gt 131072; then
                gcc_bytes="$(wc -c < "$gcc_root/$variant/bios.bin.raw")"
                clang_bytes="$(wc -c < "$clang_image")"
                printf '%s: GCC=%s Clang-Os=%s delta=%+d bytes\n' \
                  "$variant" "$gcc_bytes" "$clang_bytes" \
                  "$((clang_bytes - gcc_bytes))"
                printf '%s: Clang -Os exceeds ROM budget by %d bytes\n' \
                  "$variant" "$((clang_bytes - 131072))"
                grep -E '^(Version:|ROM version metadata:|Fixed space:|16bit size:|32bit |Lowmem size:|f-segment var size:|ROM size audit:|Error!)' \
                  "$log" || true
              else
                printf 'error: Clang firmware build failed for %s\n' "$variant" >&2
                tail -n 90 "$log" >&2
                failed=1
              fi
            fi
          done
          exit "$failed"

      - name: Verify SeaBIOS Clang ABI and size-profile routing
        run: python3 scripts/tests/test-seabios-clang-abi.py

      - name: Verify SeaBIOS profile changes invalidate stale objects
        run: |
          python3 scripts/tests/test-seabios-config.py \
            SeaBiosConfigTests.test_clang_profile_change_invalidates_cached_firmware

      - name: Measure compact flat-code inlining independently of the strict ROM gate
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_INLINE_PROFILE: CompactFlat
          SEABIOS_CLANG_SIZE_OPT: OzSegmented
          SEABIOS_CLANG_ELF_SPLIT: '0'
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-clang-compact-inline"
          variant=seabios-128k
          log="$RUNNER_TEMP/$variant-compact-inline.log"
          image="$root/$variant/bios.bin.raw"
          if make -C roms "build-seabios-config-$variant" \
              "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
              "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
            test "$(wc -c < "$root/$variant/bios.bin")" -eq 131072
          elif ! test -s "$image" || ! grep -Fq "ROM doesn't fit (" "$log" ||
               test "$(wc -c < "$image")" -le 131072; then
            tail -n 90 "$log" >&2
            exit 1
          fi
          test -s "$image"
          bytes="$(wc -c < "$image")"
          printf 'CompactFlat: %s raw bytes; ROM headroom=%d bytes\n' \
            "$bytes" "$((131072 - bytes))"
          grep -E '^(Version:|ROM version metadata:|16bit size:|32bit |ROM size audit:|ROM alignment audit:|Total size:|Error!)' \
            "$log" || true

      - name: Compare mandatory-only flat inlining against CompactFlat
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_SIZE_OPT: OzSegmented
          SEABIOS_CLANG_INLINE_PROFILE: RequiredOnlyFlat
          SEABIOS_CLANG_PADDING_PROFILE: Default
          SEABIOS_CLANG_ELF_SPLIT: '0'
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-required-inline"
          variant=seabios-128k
          log="$RUNNER_TEMP/$variant-required-inline.log"
          image="$root/$variant/bios.bin.raw"
          baseline="$RUNNER_TEMP/whp-seabios-clang-compact-inline/$variant/bios.bin.raw"
          if make -C roms "build-seabios-config-$variant" \
              "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
              "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
            test "$(wc -c < "$root/$variant/bios.bin")" -eq 131072
          elif ! test -s "$image" || ! grep -Fq "ROM doesn't fit (" "$log" ||
               test "$(wc -c < "$image")" -le 131072; then
            tail -n 90 "$log" >&2
            exit 1
          fi
          test -s "$image"
          test -s "$baseline"
          before="$(wc -c < "$baseline")"
          bytes="$(wc -c < "$image")"
          printf 'RequiredOnlyFlat: baseline=%d raw=%d saved=%d headroom=%d bytes\n' \
            "$before" "$bytes" "$((before - bytes))" "$((131072 - bytes))"
          grep -E '^(Version:|ROM version metadata:|16bit size:|32bit |ROM attribute audit:|ROM alignment audit:|Total size:|Error!)' \
            "$log" || true

      - name: Measure separately selected external IDE core
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_SIZE_OPT: OzSegmented
          SEABIOS_CLANG_INLINE_PROFILE: CompactFlat
          SEABIOS_CLANG_PADDING_PROFILE: Default
          SEABIOS_CLANG_ELF_SPLIT: '0'
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-external-ide"
          variant=seabios-128k-external-ide
          baseline="$RUNNER_TEMP/whp-seabios-clang-compact-inline/seabios-128k/bios.bin.raw"
          log="$RUNNER_TEMP/$variant.log"
          if ! make -C roms "build-seabios-config-$variant" \
              "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
              "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
            tail -n 90 "$log" >&2
            exit 1
          fi
          config="$root/$variant/.config"
          grep -Fx '# CONFIG_ATA is not set' "$config"
          for option in OPTIONROMS DRIVES FLOPPY; do
            grep -Fx "CONFIG_$option=y" "$config"
          done
          test -s "$baseline"
          test "$(wc -c < "$root/$variant/bios.bin")" -eq 131072
          before="$(wc -c < "$baseline")"
          bytes="$(wc -c < "$root/$variant/bios.bin.raw")"
          printf 'ExternalIDE: baseline=%d core=%d saved=%d headroom=%d bytes\n' \
            "$before" "$bytes" "$((before - bytes))" "$((131072 - bytes))"
          grep -E '^(Version:|ROM version metadata:|16bit size:|32bit |ROM gap audit:|Total size:)' "$log"

          # Check actual retained input sections, not every symbol in the
          # pre-link translation units. Disabled ATA entry points may be
          # emitted as inert stubs; look for real implementation helpers.
          normal="$RUNNER_TEMP/whp-seabios-clang-compact-inline/seabios-128k"
          grep -Fx 'CONFIG_ATA=y' "$normal/.config"
          pattern='\(\.text\.(ata_detect|ata_scan|ata_readwrite|ata_pio_transfer|ata_wait_data|ata_pio_cmd_data|ata_dma_cmd_data|ata_dma_transfer|atapi_read_phases)(\.[[:alnum:]_.]+)?\)'
          for dir in "$normal" "$root/$variant"; do
            for mode in 16 32seg 32flat; do
              test -s "$dir/romlayout$mode.lds"
            done
          done
          printf '%s\n' 'Standard 128 KiB: retained ATA implementation sections'
          grep -E "$pattern" "$normal"/romlayout*.lds
          if grep -E "$pattern" "$root/$variant"/romlayout*.lds; then
            printf '%s\n' 'error: external IDE core still retains ATA implementation code' >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          printf '%s\n' 'External IDE core: no retained ATA implementation helpers'
          python3 scripts/tests/test-seabios-config.py \
            SeaBiosConfigTests.test_external_ide_core_is_explicit_only

      - name: Measure optional code padding against CompactFlat
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_SIZE_OPT: OzSegmented
          SEABIOS_CLANG_INLINE_PROFILE: CompactFlat
          SEABIOS_CLANG_PADDING_PROFILE: CompactCode
          SEABIOS_CLANG_ELF_SPLIT: '0'
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-clang-compact-padding"
          variant=seabios-128k
          log="$RUNNER_TEMP/$variant-compact-padding.log"
          image="$root/$variant/bios.bin.raw"
          baseline="$RUNNER_TEMP/whp-seabios-clang-compact-inline/$variant/bios.bin.raw"
          if make -C roms "build-seabios-config-$variant" \
              "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
              "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
            test "$(wc -c < "$root/$variant/bios.bin")" -eq 131072
          elif ! test -s "$image" || ! grep -Fq "ROM doesn't fit (" "$log" ||
               test "$(wc -c < "$image")" -le 131072; then
            tail -n 90 "$log" >&2
            exit 1
          fi
          test -s "$image"
          test -s "$baseline"
          bytes="$(wc -c < "$image")"
          before="$(wc -c < "$baseline")"
          printf 'CompactCode: baseline=%d raw=%d saved=%d headroom=%d bytes\n' \
            "$before" "$bytes" "$((before - bytes))" "$((131072 - bytes))"
          grep -E '^(Version:|ROM version metadata:|16bit size:|32bit |ROM size audit:|ROM alignment audit:|ROM gap audit:|Total size:|Error!)' \
            "$log" || true

      - name: Compare variant-specific packed initialization layout
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_PADDING_PROFILE: Default
          SEABIOS_CLANG_ELF_SPLIT: '0'
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-packed-layout"
          for variant in seabios-128k seabios-microvm; do
            for pack in 0 1; do
              log="$RUNNER_TEMP/$variant-layout-$pack.log"
              if ! make -C roms "build-seabios-config-$variant" \
                  "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
                  "SEABIOS_BUILD_ROOT=$root" "SEABIOS_LAYOUT_PACK=$pack" >"$log" 2>&1; then
                tail -n 90 "$log" >&2
                exit 1
              fi
              image="$root/$variant/bios.bin.raw"
              test -s "$image"
              test "$(wc -c < "$root/$variant/bios.bin")" -eq 131072
              grep -F "ROM layout profile: $variant; compact init text: $pack" \
                "$root/$variant/romlayout32flat.lds"
              bytes="$(wc -c < "$image")"
              if test "$pack" -eq 0; then
                before="$bytes"
              fi
              printf '%s: layout pack=%s raw=%d saved=%d bytes\n' \
                "$variant" "$pack" "$bytes" "$((before - bytes))"
              grep -E '^(ROM attribute audit:|  attribute:|  resident:|  aligned:|ROM gap audit:|ROM alignment audit:|Total size:)' "$log"
            done
          done

      - name: Build isapc with the target-scoped Clang size profile
        env:
          WHP_ROM_SIZE_REPORT: '1'
          WHP_SEABIOS_SAVE_ASM: '1'
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-clang-oz-rom-budget"
          gcc_root="$RUNNER_TEMP/whp-seabios-rom-budget"
          test -x "$prefix/bin/i386-none-elf-gcc"
          variant=seabios-128k
            log="$RUNNER_TEMP/$variant-clang-oz-rom.log"
            printf '\n=== Comparing %s with segmented -Oz, CompactFlat -Os ===\n' "$variant"
            if make -C roms "build-seabios-config-$variant" \
                "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
                "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
              image="$root/$variant/bios.bin.raw"
              padded="$root/$variant/bios.bin"
              test -s "$image"
              test "$(wc -c < "$padded")" -eq 131072
              gcc_bytes="$(wc -c < "$gcc_root/$variant/bios.bin.raw")"
              clang_bytes="$(wc -c < "$image")"
              printf '%s: GCC=%d Clang-OzSegmented-CompactFlat=%d delta=%+d bytes\n' \
                "$variant" "$gcc_bytes" "$clang_bytes" \
                "$((clang_bytes - gcc_bytes))"
              printf '%s: Clang -OzSegmented-CompactFlat free capacity=%d bytes\n' \
                "$variant" "$((131072 - clang_bytes))"
              grep -E '^(Version:|ROM version metadata:|16bit size:|32bit |ROM size audit:|Total size:)' \
                "$log" || true
            else
              printf 'error: Clang -OzSegmented-CompactFlat ROM build failed: %s\n' "$variant" >&2
              tail -n 90 "$log" >&2
              exit 1
            fi

      - name: Summarize Clang assembly alignment for isapc
        if: always()
        run: |
          set -eu
          out="$RUNNER_TEMP/whp-seabios-clang-oz-rom-budget/seabios-128k"
          for unit in ccode16 code32seg ccode32flat; do
            for stage in llvm seabios; do
              asm="$out/$unit.o.$stage.s"
              if test ! -s "$asm"; then
                continue
              fi
              lines="$(wc -l < "$asm")"
              directives="$(grep -Ec '^[[:space:]]*\.p2align[[:space:]]' "$asm" || true)"
              printf 'Assembly audit: %s %s lines=%s alignment directives=%s\n' \
                "$unit" "$stage" "$lines" "$directives"
            done
          done

      - name: Analyze emitted SeaBIOS string literals by code mode
        if: always()
        run: |
          set -eu
          python3 scripts/tests/test-seabios-string-literals.py
          out="$RUNNER_TEMP/whp-seabios-clang-oz-rom-budget/seabios-128k"
          if test -s "$out/ccode16.o.llvm.s" &&
             test -s "$out/code32seg.o.llvm.s" &&
             test -s "$out/ccode32flat.o.llvm.s"; then
            python3 scripts/whp-build/audit-seabios-string-literals.py \
              "$out/ccode16.o.llvm.s" \
              "$out/code32seg.o.llvm.s" \
              "$out/ccode32flat.o.llvm.s"
          else
            printf '%s\n' 'ROM literal audit: compiler output unavailable'
          fi

      - name: Measure Clang -Oz only for 16-bit ROM code
        env:
          WHP_ROM_SIZE_REPORT: '1'
          SEABIOS_CLANG_SIZE_OPT: Oz16Only
        run: |
          set -eu
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-clang-oz16-rom-budget"
          gcc_root="$RUNNER_TEMP/whp-seabios-rom-budget"
          test -x "$prefix/bin/i386-none-elf-gcc"
          variant=seabios-128k
          log="$RUNNER_TEMP/$variant-clang-oz16-rom.log"
          printf '\n=== Clang -Oz 16-bit only, -Os elsewhere: %s ===\n' "$variant"
          if make -C roms "build-seabios-config-$variant" \
              "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
              "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
            image="$root/$variant/bios.bin.raw"
            padded="$root/$variant/bios.bin"
            test -s "$image"
            test "$(wc -c < "$padded")" -eq 131072
            gcc_bytes="$(wc -c < "$gcc_root/$variant/bios.bin.raw")"
            clang_bytes="$(wc -c < "$image")"
            printf '%s: GCC=%d Clang-Oz16Only=%d delta=%+d bytes\n' \
              "$variant" "$gcc_bytes" "$clang_bytes" \
              "$((clang_bytes - gcc_bytes))"
            printf '%s: Clang -Oz16Only free capacity=%d bytes\n' \
              "$variant" "$((131072 - clang_bytes))"
            grep -E '^(Version:|ROM version metadata:|16bit size:|32bit |ROM size audit:|Total size:)' \
              "$log" || true
          else
            printf 'error: Clang -Oz16Only ROM build failed: %s\n' "$variant" >&2
            tail -n 90 "$log" >&2
            exit 1
          fi


      - name: Boot disposable ATA disk with the experimental external IDE core
        run: |
          set -eu
          python3 scripts/tests/test-ide-optionrom.py \
            --bios "$RUNNER_TEMP/whp-seabios-external-ide/seabios-128k-external-ide/bios.bin" \
            --qemu "$(command -v qemu-system-i386)"
