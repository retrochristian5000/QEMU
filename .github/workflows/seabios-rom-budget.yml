name: WHP SeaBIOS 128 KiB ROM budget

on:
  push:
    branches:
      - master
    paths:
      - 'roms/seabios'
      - 'roms/config.seabios-128k'
      - 'roms/config.seabios-microvm'
      - 'roms/Makefile'
      - '.github/workflows/seabios-rom-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seabios-rom-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rom-budget:
    name: Build pinned isapc and microvm ROMs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out QEMU ROM configurations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            roms
            scripts/whp-build
          submodules: false

      - name: Fetch pinned SeaBIOS source
        run: |
          git submodule update --init --depth 1 roms/seabios
          expected="$(git rev-parse HEAD:roms/seabios)"
          actual="$(git -C roms/seabios rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Install firmware build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils clang-18 nasm python3

      - name: Audit both 128 KiB ROM variants without disabling features
        env:
          WHP_ROM_SIZE_REPORT: '1'
        run: |
          set -eu
          root="$RUNNER_TEMP/whp-seabios-rom-budget"
          failed=0
          for variant in seabios-128k seabios-microvm; do
            printf '%s\n' "=== Building $variant with its existing QEMU config ==="
            if make -C roms "build-seabios-config-$variant" \
                    SEABIOS_CROSS_PREFIX= "SEABIOS_BUILD_ROOT=$root"; then
              image="$root/$variant/bios.bin"
              if test ! -f "$image"; then
                printf 'error: %s did not produce a BIOS image\n' "$variant" >&2
                failed=1
              else
                bytes="$(wc -c < "$image")"
                printf '%s: %s bytes (131072-byte budget)\n' "$variant" "$bytes"
                if test "$bytes" -ne 131072; then
                  printf 'error: %s does not have its configured 128 KiB size\n' \
                    "$variant" >&2
                  failed=1
                fi
              fi
            else
              failed=1
            fi
          done
          exit "$failed"

      - name: Compare Clang code generation against the GCC ROM baseline
        env:
          WHP_ROM_SIZE_REPORT: '1'
        run: |
          set -eu
          # Hold GNU binutils and the exact 128 KiB configurations constant.
          # Only the compiler switches to the existing SeaBIOS Clang wrapper.
          # Native LLVM/LLD is a separate linker comparison.
          prefix="$RUNNER_TEMP/whp-seabios-clang-tools"
          root="$RUNNER_TEMP/whp-seabios-clang-rom-budget"
          gcc_root="$RUNNER_TEMP/whp-seabios-rom-budget"
          mkdir -p "$prefix/llvm/bin" "$prefix/bin"
          clang="$(command -v clang-18)"
          test -x "$clang"
          ln -s "$clang" "$prefix/llvm/bin/clang"
          cp scripts/whp-build/seabios-clang-gcc.bash \
            "$prefix/bin/i386-none-elf-gcc"
          chmod 700 "$prefix/bin/i386-none-elf-gcc"
          for tool in cpp as objcopy objdump strip; do
            ln -s "$(command -v "$tool")" \
              "$prefix/bin/i386-none-elf-$tool"
          done
          # GNU ld's host default is x86_64, but our Clang objects are ELF32.
          # Match the i386-none-elf linker default without switching to LLD.
          cat > "$prefix/bin/i386-none-elf-ld" <<'LINKER'
          #!/bin/sh
          exec ld -m elf_i386 "$@"
          LINKER
          chmod 700 "$prefix/bin/i386-none-elf-ld"
          printf 'Clang: %s\n' "$("$clang" --version | head -n 1)"
          printf 'GCC: %s\n' "$(gcc --version | head -n 1)"
          printf 'Linker: %s\n' "$(ld --version | head -n 1)"
          failed=0
          for variant in seabios-128k seabios-microvm; do
            log="$RUNNER_TEMP/$variant-clang-rom.log"
            printf '\n=== Comparing %s with Clang and GNU binutils ===\n' \
              "$variant"
            if make -C roms "build-seabios-config-$variant" \
                "SEABIOS_CROSS_PREFIX=$prefix/bin/i386-none-elf-" \
                "SEABIOS_BUILD_ROOT=$root" >"$log" 2>&1; then
              gcc_image="$gcc_root/$variant/bios.bin.raw"
              clang_image="$root/$variant/bios.bin.raw"
              if test ! -s "$gcc_image" || test ! -s "$clang_image"; then
                printf 'error: missing unpadded ROM for %s\n' "$variant" >&2
                failed=1
              else
                gcc_bytes="$(wc -c < "$gcc_image")"
                clang_bytes="$(wc -c < "$clang_image")"
                delta="$((clang_bytes - gcc_bytes))"
                printf '%s: GCC=%s Clang=%s delta=%+d bytes\n' \
                  "$variant" "$gcc_bytes" "$clang_bytes" "$delta"
                printf '%s: Clang free capacity=%s bytes\n' \
                  "$variant" "$((131072 - clang_bytes))"
              fi
              grep -E '^(Fixed space:|16bit size:|32bit |Lowmem size:|f-segment var size:|ROM size audit:|Total size:)' \
                "$log" || true
            else
              printf 'error: Clang firmware build failed for %s\n' "$variant" >&2
              tail -n 90 "$log" >&2
              failed=1
            fi
          done
          exit "$failed"
