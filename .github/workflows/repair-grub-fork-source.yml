name: Repair GRUB fork source

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/repair-grub-fork-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Apply pinned GRUB fork source repair
        run: python3 .github/grub-fork-source-repair.py

      - name: Verify source policy and archive compatibility
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-i386-efi-grub.bash
          bash scripts/tests/test-grub-fork-source.bash
          bash scripts/tests/test-i386-efi-grub-bootstrap.bash
          git diff --check

      - name: Commit repair and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-grub-fork-source.yml .github/grub-fork-source-repair.py
          git add scripts/bootstrap-i386-efi-grub.bash
          git diff --cached --check
          git commit -m 'seabios: source GRUB from pinned WHP fork'
          git push origin HEAD:master
