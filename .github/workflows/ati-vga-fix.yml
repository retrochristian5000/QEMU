name: ATI primary VGA fix

on:
  push:
    paths:
      - '.github/workflows/ati-vga-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply ATI primary VGA selector fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "include/system/system.h",
              "    VGA_TCX, VGA_CG3, VGA_DEVICE, VGA_VIRTIO,\n"
              "    VGA_TYPE_MAX,\n",
              "    VGA_TCX, VGA_CG3, VGA_DEVICE, VGA_VIRTIO, VGA_ATI,\n"
              "    VGA_TYPE_MAX,\n",
          )

          virtio = (
              "    [VGA_VIRTIO] = {\n"
              "        .opt_name = \"virtio\",\n"
              "        .name = \"Virtio VGA\",\n"
              "        .class_names = { \"virtio-vga\" },\n"
              "    },\n"
          )
          replace_once(
              "system/vl.c",
              virtio,
              virtio +
              "    [VGA_ATI] = {\n"
              "        .opt_name = \"ati\",\n"
              "        .name = \"ATI VGA\",\n"
              "        .class_names = { \"ati-vga\" },\n"
              "    },\n",
          )

          replace_once(
              "hw/pci/pci.c",
              "    case VGA_VIRTIO:\n"
              "        return pci_create_simple(bus, -1, \"virtio-vga\");\n"
              "    case VGA_NONE:\n",
              "    case VGA_VIRTIO:\n"
              "        return pci_create_simple(bus, -1, \"virtio-vga\");\n"
              "    case VGA_ATI:\n"
              "        return pci_create_simple(bus, -1, \"ati-vga\");\n"
              "    case VGA_NONE:\n",
          )
          PY

          git diff --check
          git diff -- include/system/system.h system/vl.c hw/pci/pci.c

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            python3-venv \
            zlib1g-dev

      - name: Configure i386
        run: |
          mkdir build-ati
          cd build-ati
          ../configure --target-list=i386-softmmu --disable-docs

      - name: Build qemu-system-i386
        run: ninja -C build-ati qemu-system-i386

      - name: Verify ATI selector is exposed
        shell: bash
        run: |
          set -euo pipefail
          build-ati/qemu-system-i386 -vga help | tee build-ati/vga-help.txt
          grep -Eq '^ati[[:space:]]+ATI VGA' build-ati/vga-help.txt

      - name: Verify ATI SeaBIOS video
        run: python3 scripts/tests/test-i386-ati-seabios.py build-ati/qemu-system-i386

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ati-vga-fix.yml
          git add include/system/system.h system/vl.c hw/pci/pci.c
          git commit -m 'hw/display: make ati-vga selectable as primary VGA'
          git push origin HEAD:master
