name: Finish SDL3 audio split plumbing

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/apply-sdl3-audio-split-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Meson for option regeneration
        run: python3 -m pip install --user 'meson>=1.5,<2'

      - name: Split top-level SDL dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'meson_options.txt',
              "option('sdl', type : 'feature', value : 'auto',\n       description: 'SDL user interface')\noption('sdl_image', type : 'feature', value : 'auto',",
              "option('sdl', type : 'feature', value : 'auto',\n       description: 'SDL user interface')\noption('sdl_audio', type : 'feature', value : 'auto',\n       description: 'SDL3 audio backend')\noption('sdl_image', type : 'feature', value : 'auto',"
          )

          replace_once(
              'meson.build',
              "  sdl_image = not_found\nendif\n\nrbd = not_found",
              "  sdl_image = not_found\nendif\n\nsdl_audio = not_found\nif not get_option('sdl_audio').auto() or have_system\n  sdl_audio = dependency('sdl3', version: '>=3.2.0',\n                         required: get_option('sdl_audio'),\n                         method: 'pkg-config')\nendif\n\nrbd = not_found"
          )
          replace_once('meson.build', "    'sdl': sdl.found(),", "    'sdl': sdl_audio.found(),")
          replace_once(
              'meson.build',
              "summary_info += {'SDL support':       sdl}\nsummary_info += {'SDL image support': sdl_image}",
              "summary_info += {'SDL support':       sdl}\nsummary_info += {'SDL3 audio support': sdl_audio}\nsummary_info += {'SDL image support': sdl_image}"
          )
          PY

          meson introspect --buildoptions meson.build |
            python3 scripts/meson-buildoptions.py > scripts/meson-buildoptions.sh.tmp
          mv scripts/meson-buildoptions.sh.tmp scripts/meson-buildoptions.sh
          python3 scripts/tests/test-sdl3-audio-split.py

      - name: Commit split to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'retrochristian5000'
          git config user.email '252152985+retrochristian5000@users.noreply.github.com'
          git rm .github/workflows/apply-sdl3-audio-split.yml
          git rm .github/workflows/apply-sdl3-audio-split-v2.yml
          git add meson.build meson_options.txt scripts/meson-buildoptions.sh
          git commit -m 'build: separate SDL3 audio from SDL2 display'
          git push origin HEAD:master
