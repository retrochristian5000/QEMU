name: WHP LLD ARM64e authenticated relocation

on:
  push:
    branches:
      - master
    paths:
      - 'toolchains/llvm-project'
      - '.github/workflows/lld-arm64e-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-lld-arm64e-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64e-auth:
    name: Link ARM64e authenticated pointer
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Fetch pinned LLVM source
        shell: bash
        run: git submodule update --init --depth 1 toolchains/llvm-project

      - name: Install build dependencies
        run: brew install cmake ninja

      - name: Build lean Mach-O LLD probe toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja \
            -S toolchains/llvm-project/llvm \
            -B build-lld \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF
          cmake --build build-lld --target lld llvm-mc llvm-objdump -- -j4

      - name: Link authenticated ARM64e pointer with WHP LLD
        shell: bash
        run: |
          set -euo pipefail
          mc="$GITHUB_WORKSPACE/build-lld/bin/llvm-mc"
          ld="$GITHUB_WORKSPACE/build-lld/bin/ld64.lld"
          objdump="$GITHUB_WORKSPACE/build-lld/bin/llvm-objdump"

          cat >foo.s <<'EOF'
          .text
          .globl _foo
          _foo:
            ret
          EOF
          cat >test.s <<'EOF'
          .data
          .p2align 3
          .quad _foo@AUTH(ia,42,addr)
          EOF

          "$mc" -filetype=obj -triple=arm64e-apple-macos -o foo.o foo.s
          "$mc" -filetype=obj -triple=arm64e-apple-macos -o test.o test.s
          "$ld" -arch arm64e -platform_version macos 13.0 13.0 \
            -dylib -install_name @rpath/libfoo.dylib foo.o -o libfoo.dylib
          "$ld" -arch arm64e -platform_version macos 13.0 13.0 \
            -dylib libfoo.dylib test.o -o libtest.dylib

          "$objdump" --macho --private-header libtest.dylib | tee header.txt
          "$objdump" --macho --chained-fixups libtest.dylib | tee fixups.txt
          grep -Eq 'ARM64[[:space:]]+E' header.txt
          grep -Fq 'pointer_format = 12 (DYLD_CHAINED_PTR_ARM64E_USERLAND24)' fixups.txt
          grep -Fq '_foo' fixups.txt
