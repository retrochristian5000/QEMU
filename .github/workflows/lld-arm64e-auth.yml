name: WHP LLD ARM64e authenticated relocation

on:
  push:
    branches:
      - master
    paths:
      - 'toolchains/llvm-project'
      - '.github/workflows/lld-arm64e-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-lld-arm64e-auth-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64e-auth:
    name: Link ARM64e authenticated pointer
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out QEMU source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the pinned LLVM gitlink
        id: llvm_pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-tree HEAD toolchains/llvm-project | awk '{print $3}')"
          test -n "$pin" || { echo 'error: missing LLVM gitlink' >&2; exit 1; }
          echo "sha=$pin" >> "$GITHUB_OUTPUT"

      - name: Check out pinned LLVM source sparsely
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: retrochristian5000/LLVM
          ref: ${{ steps.llvm_pin.outputs.sha }}
          path: llvm-project
          fetch-depth: 1
          sparse-checkout: |
            cmake
            libc
            lld
            llvm
            third-party

      - name: Verify LLVM checkout matches QEMU gitlink
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-tree HEAD toolchains/llvm-project | awk '{print $3}')"
          actual="$(git -C llvm-project rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected" || {
            printf 'error: ARM64e LLD workflow LLVM pin %s != QEMU gitlink %s\n' \
              "$actual" "$expected" >&2
            exit 1
          }

      - name: Install build dependencies
        run: brew install cmake ninja

      - name: Build lean Mach-O LLD
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B build-lld \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF
          cmake --build build-lld --target lld llvm-objdump -- -j4

      - name: Link authenticated ARM64e pointer with WHP LLD
        shell: bash
        run: |
          set -euo pipefail
          ld="$GITHUB_WORKSPACE/build-lld/bin/ld64.lld"

          cat >foo.s <<'EOF'
          .text
          .globl _foo
          _foo:
            ret
          EOF
          cat >test.s <<'EOF'
          .data
          .p2align 3
          .quad _foo@AUTH(ia,42,addr)
          EOF

          xcrun clang -arch arm64e -mmacosx-version-min=13.0 -c foo.s -o foo.o
          xcrun clang -arch arm64e -mmacosx-version-min=13.0 -c test.s -o test.o
          "$ld" -arch arm64e -platform_version macos 13.0 13.0 \
            -dylib -install_name @rpath/libfoo.dylib foo.o -o libfoo.dylib
          "$ld" -arch arm64e -platform_version macos 13.0 13.0 \
            -dylib libfoo.dylib test.o -o libtest.dylib
          test -s libtest.dylib
          "$GITHUB_WORKSPACE/build-lld/bin/llvm-objdump" \
            --macho --chained-fixups libtest.dylib >fixups.txt
          grep -Fq 'DYLD_CHAINED_PTR_ARM64E_USERLAND24' fixups.txt
          grep -Fq '_foo' fixups.txt
