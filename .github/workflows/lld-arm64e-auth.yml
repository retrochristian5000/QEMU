name: WHP LLD ARM64e authenticated relocation

on:
  push:
    branches:
      - master
    paths:
      - 'toolchains/llvm-project'
      - '.github/workflows/lld-arm64e-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-lld-arm64e-auth-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64e-auth:
    name: Link ARM64e authenticated pointer
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out QEMU source
        uses: actions/checkout@v7

      - name: Check out pinned LLVM source sparsely
        uses: actions/checkout@v7
        with:
          repository: retrochristian5000/LLVM
          ref: f6fb0a753b60e3653d0721fc2ab93110a5c455b9
          path: llvm-project
          fetch-depth: 1
          sparse-checkout: |
            cmake
            lld
            llvm
            third-party

      - name: Install build dependencies
        run: brew install cmake ninja

      - name: Build lean Mach-O LLD
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B build-lld \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF
          cmake --build build-lld --target lld -- -j4

      - name: Link authenticated ARM64e pointer with WHP LLD
        shell: bash
        run: |
          set -euo pipefail
          ld="$GITHUB_WORKSPACE/build-lld/bin/ld64.lld"

          cat >foo.s <<'EOF'
          .text
          .globl _foo
          _foo:
            ret
          EOF
          cat >test.s <<'EOF'
          .data
          .p2align 3
          .quad _foo@AUTH(ia,42,addr)
          EOF

          xcrun clang -arch arm64e -mmacosx-version-min=13.0 -c foo.s -o foo.o
          xcrun clang -arch arm64e -mmacosx-version-min=13.0 -c test.s -o test.o
          "$ld" -arch arm64e -platform_version macos 13.0 13.0 \
            -dylib -install_name @rpath/libfoo.dylib foo.o -o libfoo.dylib
          "$ld" -arch arm64e -platform_version macos 13.0 13.0 \
            -dylib libfoo.dylib test.o -o libtest.dylib
          test -s libtest.dylib
