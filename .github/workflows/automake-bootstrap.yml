name: GNU Automake bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'seeds/sed.sh'
      - 'seeds/makeinfo.sh'
      - 'scripts/tests/test-makeinfo-seed.py'
      - 'toolchains/automake'
      - 'build.sh'
      - 'scripts/ensure-automake.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'seeds/automake.sh'
      - 'scripts/tests/test-automake-seed.py'
      - 'scripts/whp-config/config.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/tests/test-bootstrap-env.py'
      - 'scripts/tests/test-automake-makeinfo-preflight.py'
      - '.github/workflows/automake-bootstrap.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'seeds/sed.sh'
      - 'seeds/makeinfo.sh'
      - 'scripts/tests/test-makeinfo-seed.py'
      - 'toolchains/automake'
      - 'build.sh'
      - 'scripts/ensure-automake.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'seeds/automake.sh'
      - 'scripts/tests/test-automake-seed.py'
      - 'scripts/whp-config/config.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/tests/test-bootstrap-env.py'
      - 'scripts/tests/test-automake-makeinfo-preflight.py'
      - '.github/workflows/automake-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Automake macro directory and GNU Texinfo seeds
        run: |
          sh -n seeds/automake.sh seeds/makeinfo.sh
          python3 scripts/tests/test-automake-seed.py
          python3 scripts/tests/test-makeinfo-seed.py -v
          python3 scripts/tests/test-automake-makeinfo-preflight.py -v

      - name: Install bootstrap prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autoconf texinfo

      - name: Install bootstrap prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf m4 texinfo
          # GNU M4 is keg-only on macOS. Keep the source-bootstrap provider
          # distinct from the system BSD m4 throughout Automake -> Autoconf.
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"

      - name: Check pinned Automake test and bracket shell predicates
        run: |
          git submodule update --init --depth 1 -- toolchains/automake
          python3 toolchains/automake/contrib/t/shell-predicate-parity.py

      - name: Reject corrupt bootstrap variables
        run: python3 scripts/tests/test-bootstrap-env.py

      - name: Bootstrap pinned Automake
        shell: bash
        run: |
          set -euo pipefail
          seed="$(./seeds/sed.sh --print-seed)"
          test "$(printf 'alpha\n' | ./seeds/sed.sh -n 's/^alpha$/beta/p')" = beta
          texinfo="$(/bin/sh ./seeds/makeinfo.sh --print-seed)"
          test -x "$texinfo"
          prefix="$(WHP_AUTOMAKE_SED_SEED="$seed" \
            python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake")"
          test -x "$prefix/bin/automake"
          test -x "$prefix/bin/aclocal"
          "$prefix/bin/automake" --version | grep -q 'GNU automake'
          "$prefix/bin/aclocal" --version | grep -q 'GNU automake'
          WHP_AUTOMAKE_SEED="$prefix/bin/automake" \
            WHP_ACLOCAL_SEED="$prefix/bin/aclocal" \
            /bin/sh seeds/automake.sh --check-macros

          tmp="$RUNNER_TEMP/automake-smoke"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          cat > "$tmp/configure.ac" <<'EOF'
          AC_INIT([whp-automake-smoke], [1])
          AM_INIT_AUTOMAKE([foreign])
          AC_CONFIG_FILES([Makefile])
          AC_OUTPUT
          EOF
          cat > "$tmp/Makefile.am" <<'EOF'
          EXTRA_DIST =
          EOF
          (
            cd "$tmp"
            PATH="$prefix/bin:$PATH"
            "$prefix/bin/aclocal"
            autoconf
            "$prefix/bin/automake" --add-missing --copy --foreign
            test -f Makefile.in
          )

          again="$(WHP_AUTOMAKE_SED_SEED="$seed" \
            python3 scripts/ensure-automake.py --build-dir "$RUNNER_TEMP/whp-automake")"
          test "$again" = "$prefix"
