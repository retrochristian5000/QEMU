name: Repair 8086 Jcc aliases

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/repair_8086_jcc_aliases.py'
      - '.github/workflows/repair-8086-jcc-aliases.yml'
      - 'target/i386/tcg/decode-original-x86.c.inc'
      - 'tests/qtest/x86-16bit-test.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libpixman-1-dev python3-venv zlib1g-dev

      - name: Configure original x86 target
        run: |
          mkdir build-red-green
          cd build-red-green
          ../configure --target-list=x86-softmmu --disable-docs

      - name: Stage failing regression
        run: python3 .github/scripts/repair_8086_jcc_aliases.py test

      - name: Build failing regression
        run: |
          ninja -C build-red-green qemu-system-x86 tests/qtest/x86-16bit-test

      - name: Verify RED
        shell: bash
        run: |
          set -euo pipefail
          if build-red-green/pyvenv/bin/meson test -C build-red-green --print-errorlogs \
               qtest-x86/x86-16bit-test; then
            echo 'error: regression unexpectedly passed before decoder repair' >&2
            exit 1
          fi

      - name: Apply minimal decoder repair
        run: python3 .github/scripts/repair_8086_jcc_aliases.py fix

      - name: Rebuild repaired decoder
        run: ninja -C build-red-green qemu-system-x86 tests/qtest/x86-16bit-test

      - name: Verify GREEN
        run: |
          build-red-green/pyvenv/bin/meson test -C build-red-green --print-errorlogs \
            qtest-x86/x86-16bit-test
