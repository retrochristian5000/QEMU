name: WHP i386 register flags

on:
  push:
    branches:
      - master
    paths:
      - 'target/i386/tcg/**'
      - 'tests/tcg/i386/**'
      - '.github/workflows/whp-i386-registers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install i386 test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            ninja-build \
            pkgconf \
            python3-venv \
            zlib1g-dev

      - name: Configure i386 TCG
        run: |
          ./configure \
            --target-list=i386-softmmu \
            --cross-cc-i386='gcc -m32' \
            --disable-docs \
            --disable-gtk \
            --disable-pa

      - name: Build qemu-system-i386
        run: make -C build -j2 qemu-system-i386

      - name: Run register flag regression test
        run: make -C build run-tcg-tests-i386-softmmu TCG_TEST_FILTER=register-flags
