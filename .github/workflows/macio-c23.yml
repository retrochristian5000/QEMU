name: MacIO C23 compatibility

on:
  push:
    branches:
      - master
    paths:
      - 'hw/misc/macio/**'
      - 'hw/ide/macio.c'
      - 'include/hw/misc/macio/**'
      - 'include/hw/audio/screamer.h'
      - 'hw/audio/screamer.c'
      - 'tests/qtest/macio-timer-test.c'
      - '.github/workflows/macio-c23.yml'
  workflow_dispatch:

concurrency:
  group: macio-c23-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            python3-venv \
            zlib1g-dev

      - name: Configure PowerPC with C23 and Werror
        env:
          CC: clang
          CXX: clang++
        shell: bash
        run: |
          set -euo pipefail
          mkdir build-macio-c23
          cd build-macio-c23
          ../configure \
            --target-list=ppc-softmmu \
            --disable-docs \
            --disable-tools \
            --enable-werror \
            -Dc_std=gnu23

      - name: Compile MacIO object set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(
            ninja -C build-macio-c23 -t targets all |
              awk -F: '
                /hw_misc_macio_.*\.c\.o:/ ||
                /hw_ide_macio\.c\.o:/ ||
                /hw_audio_screamer\.c\.o:/ {
                  print $1
                }
              ' |
              sort -u
          )
          if (( ${#targets[@]} == 0 )); then
            echo "error: no MacIO object targets were found" >&2
            exit 1
          fi
          printf 'MacIO C23 object targets:\n'
          printf '  %s\n' "${targets[@]}"
          ninja -C build-macio-c23 "${targets[@]}"

      - name: Build MacIO runtime test
        run: ninja -C build-macio-c23 tests/qtest/macio-timer-test

      - name: Show compiler context
        if: failure()
        shell: bash
        run: |
          if [[ -f build-macio-c23/meson-logs/meson-log.txt ]]; then
            tail -n 200 build-macio-c23/meson-logs/meson-log.txt
          fi
