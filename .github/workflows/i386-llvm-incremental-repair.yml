name: i386 LLVM incremental repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/i386-llvm-incremental-repair.yml'

permissions:
  contents: write

concurrency:
  group: whp-i386-llvm-incremental-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch i386 LLVM continuity contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          bootstrap = Path("scripts/bootstrap-i386-clang.bash")
          replace_once(
              bootstrap,
              '''# Do not retain LLVM objects from an older source state.  A mixed frontend and
          # verifier can produce IR attributes that the stale backend rejects even when
          # the installed compiler still answers --version successfully.
          rm -rf "$LLVM_BUILD_DIR"
          mkdir -p "$(dirname "$TOOLCHAIN_DIR")" "$TOOLCHAIN_WORK_DIR"
          ''',
              '''# Keep the CMake/Ninja graph alive across interrupted builds and LLVM source
          # revisions. Re-running CMake updates changed rules in place, while Ninja keeps
          # object dependency state and rebuilds only affected outputs. The installed
          # toolchain is staged separately, so an invalid prefix does not make this graph
          # disposable.
          mkdir -p "$(dirname "$TOOLCHAIN_DIR")" "$TOOLCHAIN_WORK_DIR"
          ''')
          replace_once(
              bootstrap,
              '''cmake "${cmake_args[@]}"
          cmake --build "$LLVM_BUILD_DIR" --target distribution "${cmake_parallel_args[@]}"
          ''',
              '''cmake "${cmake_args[@]}"

          if [[ "$TOOLCHAIN_FORCE_REBUILD" == 1 ]]; then
              cmake --build "$LLVM_BUILD_DIR" --target clean "${cmake_parallel_args[@]}"
          fi

          cmake --build "$LLVM_BUILD_DIR" --target distribution "${cmake_parallel_args[@]}"
          ''')
          replace_once(
              bootstrap,
              '''# removes stale tools left by older, broader bootstrap schemas while the LLVM
          # build itself comes from a clean CMake/Ninja graph.
          ''',
              '''# removes stale tools left by older, broader bootstrap schemas while the LLVM
          # build itself comes from the persistent CMake/Ninja graph above.
          ''')

          seabios_test = Path("scripts/tests/test-seabios-llvm-wiring.bash")
          replace_once(
              seabios_test,
              'bootstrap="$root/scripts/bootstrap-i386-clang.sh"\n',
              'bootstrap="$root/scripts/bootstrap-i386-clang.bash"\n')
          replace_once(
              seabios_test,
              '''# Do not reuse an LLVM CMake/Ninja object graph when the toolchain must rebuild.
          # LLVM IR contracts can change between source revisions.
          grep -Fq -- 'rm -rf "$LLVM_BUILD_DIR"' "$bootstrap"
          ''',
              '''# Preserve the generated LLVM graph across ordinary rebuilds. CMake updates the
          # graph in place and Ninja invalidates affected objects. Explicit forced rebuilds
          # clean outputs through the backend without deleting CMakeCache.txt/build.ninja.
          if grep -Fq -- 'rm -rf "$LLVM_BUILD_DIR"' "$bootstrap"; then
              printf 'i386 LLVM bootstrap destroys incremental CMake/Ninja state\n' >&2
              exit 1
          fi
          grep -Fq -- 'cmake "${cmake_args[@]}"' "$bootstrap"
          grep -Fq -- 'if [[ "$TOOLCHAIN_FORCE_REBUILD" == 1 ]]; then' "$bootstrap"
          grep -Fq -- 'cmake --build "$LLVM_BUILD_DIR" --target clean "${cmake_parallel_args[@]}"' "$bootstrap"
          ''')

          isolation = Path(".github/workflows/llvm-bootstrap-isolation.yml")
          replace_once(
              isolation,
              "      - 'scripts/bootstrap-i386-clang.sh'\n",
              "      - 'scripts/bootstrap-i386-clang.sh'\n      - 'scripts/bootstrap-i386-clang.bash'\n")

          grub = Path(".github/workflows/grub-i386-efi.yml")
          replace_once(
              grub,
              "      - 'scripts/bootstrap-i386-clang.sh'\n",
              "      - 'scripts/bootstrap-i386-clang.sh'\n      - 'scripts/bootstrap-i386-clang.bash'\n")
          replace_once(
              grub,
              "      - 'scripts/tests/test-i386-efi-grub-bootstrap.bash'\n",
              "      - 'scripts/tests/test-i386-efi-grub-bootstrap.bash'\n      - 'scripts/tests/test-i386-llvm-incremental-bootstrap.bash'\n")
          replace_once(
              grub,
              '''      - name: Build IA32 EFI GRUB from pinned WHP submodule with WHP LLVM
          ''',
              '''      - name: Test i386 LLVM incremental bootstrap contract
                shell: bash
                run: bash scripts/tests/test-i386-llvm-incremental-bootstrap.bash

              - name: Build IA32 EFI GRUB from pinned WHP submodule with WHP LLVM
          ''')
          replace_once(
              grub,
              '''      - name: Verify gitlink identity, LLVM mode, mkimage, and hybrid modules
          ''',
              '''      - name: Verify i386 LLVM CMake graph survives re-entry
                shell: bash
                run: |
                  set -euo pipefail
                  llvm_prefix="$BUILD_DIR/firmware-tools/i386-none-elf"
                  llvm_build="$BUILD_DIR/firmware-tools/toolchain-work/i386-none-elf/llvm-build"
                  sentinel="$llvm_build/.whp-incremental-sentinel"

                  test -f "$llvm_build/CMakeCache.txt"
                  test -f "$llvm_build/build.ninja"
                  printf 'preserve i386 LLVM CMake/Ninja state\n' >"$sentinel"

                  # Force the i386 bootstrap path without changing LLVM source or CMake
                  # policy. The installed marker is disposable; the generated graph is not.
                  rm -f "$llvm_prefix/.whp-i386-toolchain"
                  bash scripts/bootstrap-i386-efi-grub.sh | tee grub-i386-efi-incremental.log

                  test -f "$sentinel"
                  test -f "$llvm_build/CMakeCache.txt"
                  test -f "$llvm_build/build.ninja"
                  test -f "$llvm_prefix/.whp-i386-toolchain"
                  grep -Fq 'Bootstrapped SeaBIOS compiler: Clang' grub-i386-efi-incremental.log

              - name: Verify gitlink identity, LLVM mode, mkimage, and hybrid modules
          ''')
          replace_once(
              grub,
              '''          tail -n 250 grub-i386-efi-build.log 2>/dev/null || true
                    cat grub-i386-efi-objdump.log 2>/dev/null || true
          ''',
              '''          tail -n 250 grub-i386-efi-build.log 2>/dev/null || true
                    tail -n 250 grub-i386-efi-incremental.log 2>/dev/null || true
                    cat grub-i386-efi-objdump.log 2>/dev/null || true
          ''')
          replace_once(
              grub,
              '''            grub-i386-efi-build.log
                      grub-i386-efi-objdump.log
          ''',
              '''            grub-i386-efi-build.log
                      grub-i386-efi-incremental.log
                      grub-i386-efi-objdump.log
          ''')
          PY

      - name: Verify repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-i386-clang.bash
          bash -n scripts/tests/test-seabios-llvm-wiring.bash
          bash scripts/tests/test-i386-llvm-incremental-bootstrap.bash
          bash scripts/tests/test-llvm-bootstrap-isolation.bash
          python3 - <<'PY'
          from pathlib import Path
          test = Path('scripts/tests/test-seabios-llvm-wiring.bash').read_text()
          assert 'bootstrap="$root/scripts/bootstrap-i386-clang.bash"' in test
          assert 'rm -rf "$LLVM_BUILD_DIR"' not in Path('scripts/bootstrap-i386-clang.bash').read_text()
          PY

      - name: Commit verified repair to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "retrochristian5000"
          git config user.email "252152985+retrochristian5000@users.noreply.github.com"
          git rm .github/workflows/i386-llvm-incremental-repair.yml
          git add \
            scripts/bootstrap-i386-clang.bash \
            scripts/tests/test-seabios-llvm-wiring.bash \
            .github/workflows/llvm-bootstrap-isolation.yml \
            .github/workflows/grub-i386-efi.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "llvm: preserve i386-none-elf incremental graph"
          git push origin HEAD:master
