name: Guarded Meson VDE repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/repair-meson-vde.yml'

permissions:
  contents: write

concurrency:
  group: guarded-meson-vde-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove regression test is red before the fix
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/tests/test-meson-warning-audit.bash >red.log 2>&1; then
            echo 'error: VDE regression test unexpectedly passed before repair' >&2
            cat red.log >&2
            exit 1
          fi
          cat red.log
          grep -Fq 'VDE link failure is controlled by cap_ng instead of vde' red.log

      - name: Repair only the VDE option ownership bug
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('meson.build')
          text = path.read_text()
          old = "  if get_option('cap_ng').enabled()\n    error('could not link libvdeplug')\n"
          new = "  if get_option('vde').enabled()\n    error('could not link libvdeplug')\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'error: expected exactly one guarded VDE pattern, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- meson.build

      - name: Prove regression test is green after the fix
        run: bash scripts/tests/test-meson-warning-audit.bash

      - name: Commit guarded repair to master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "${GITHUB_SHA}"
          rm -f .github/workflows/repair-meson-vde.yml
          git config user.name 'WHP QEMU repair'
          git config user.email '252152985+retrochristian5000@users.noreply.github.com'
          git add meson.build .github/workflows/repair-meson-vde.yml
          git diff --cached --check
          git commit -m 'meson: fix VDE option failure handling'
          git push origin HEAD:master
