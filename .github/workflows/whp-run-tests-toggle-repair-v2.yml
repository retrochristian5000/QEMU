name: WHP RUN_TESTS menu repair v2

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/whp-run-tests-toggle-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore harness boundary and rerun repair
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/tests/test-whp-config-integration.bash')
          text = path.read_text(encoding='utf-8')
          old = '''# Verify explicit host-feature switches feed configure, while auto does not.
          source "$ROOT/scripts/whp-build/common.bash"
          '''
          new = '''# Verify explicit host-feature switches feed configure, while auto does not.
          # Earlier configure tests intentionally redirect SOURCE_DIR to a fake tree.
          # Restore the real repository before loading the production build helpers.
          SOURCE_DIR="$ROOT"
          source "$ROOT/scripts/whp-build/common.bash"
          '''
          if text.count(old) != 1:
              raise SystemExit('integration harness boundary marker changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/whp-run-tests-toggle-repair.yml').read_text(encoding='utf-8')
          marker = '      - name: Red-green RUN_TESTS repair\n        shell: bash\n        run: |\n'
          if workflow.count(marker) != 1:
              raise SystemExit('original RUN_TESTS repair workflow shape changed unexpectedly')
          block = workflow.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line:
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected line outside repair run block: {line!r}')
          Path('/tmp/whp-run-tests-repair.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          bash /tmp/whp-run-tests-repair.sh
