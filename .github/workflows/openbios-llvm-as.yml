name: OpenBIOS LLVM integrated assembler

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/bootstrap-powerpc-clang.sh'
      - 'scripts/bootstrap-powerpc-clang-core.sh'
      - 'scripts/bootstrap-powerpc-clang-base.sh'
      - 'scripts/bootstrap-powerpc-llvm-mc.sh'
      - 'scripts/bootstrap-powerpc-llvm-ar.sh'
      - 'scripts/bootstrap-powerpc-llvm-nm.sh'
      - 'scripts/bootstrap-powerpc-llvm-strip.sh'
      - 'scripts/tests/test-powerpc-llvm-assembler-wiring.bash'
      - 'scripts/tests/test-powerpc-llvm-ar-wiring.bash'
      - 'scripts/tests/test-powerpc-llvm-nm-wiring.bash'
      - 'scripts/tests/test-powerpc-llvm-strip-wiring.bash'
      - 'scripts/tests/test-powerpc-llvm-submodule-preparation.bash'
      - 'scripts/build-openbios.sh'
      - 'scripts/meson-build-openbios.sh'
      - 'scripts/whp-build/prepare-build.bash'
      - 'scripts/whp-build/prepare-sources.bash'
      - 'scripts/whp-build/configure-openbios.bash'
      - 'roms/openbios'
      - 'toolchains/llvm-project'
      - '.gitmodules'
      - '.github/workflows/openbios-llvm-as.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openbios-llvm-ias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openbios-llvm-ias:
    name: Build OpenBIOS through Clang IAS
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      JOBS: '4'
      POWERPC_TOOLCHAIN_DIR: ${{ github.workspace }}/build/toolchains/powerpc-elf
      POWERPC_TOOLCHAIN_WORK_DIR: ${{ github.workspace }}/build/toolchain-work/powerpc-elf-clang
      POWERPC_TOOLCHAIN_DOWNLOAD_DIR: ${{ github.workspace }}/build/toolchain-downloads
      POWERPC_LLVM_SUBMODULE_PATH: toolchains/llvm-project
      OPENBIOS_DIR: ${{ github.workspace }}/roms/openbios
      OPENBIOS_BUILD_DIR: ${{ github.workspace }}/build/openbios-llvm-ias
      OPENBIOS_OUTPUT: ${{ github.workspace }}/build/openbios-ppc-llvm-ias
      OPENBIOS_TOOLS_DIR: ${{ github.workspace }}/build/firmware-tools
      OPENBIOS_FIRMWARE_VALIDATION: strict
      FCODE_UTILS_REPOSITORY: https://github.com/retrochristian5000/fcode-utils.git
      FCODE_UTILS_REV: e506db25b0aff34b98accc18b9b81f5673351cbf

    steps:
      - name: Check out QEMU
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bzip2 \
            cmake \
            g++ \
            gcc \
            git \
            make \
            ninja-build \
            perl \
            xz-utils \
            xsltproc \
            zlib1g-dev

      - name: Initialize pinned firmware and LLVM sources
        run: |
          set -euxo pipefail
          git submodule update --init --depth 1 toolchains/llvm-project roms/openbios
          test "$(git -C toolchains/llvm-project rev-parse HEAD)" = \
            "$(git ls-tree HEAD -- toolchains/llvm-project | awk '{print $3}')"
          test "$(git -C roms/openbios rev-parse HEAD)" = \
            "$(git ls-tree HEAD -- roms/openbios | awk '{print $3}')"

      - name: Verify LLVM-only binary-tool policy
        run: |
          bash scripts/tests/test-powerpc-llvm-assembler-wiring.bash
          bash scripts/tests/test-powerpc-llvm-ar-wiring.bash
          bash scripts/tests/test-powerpc-llvm-nm-wiring.bash
          bash scripts/tests/test-powerpc-llvm-strip-wiring.bash
          env -u OPENBIOS_BUILD_DIR \
            bash scripts/tests/test-powerpc-llvm-submodule-preparation.bash

      - name: Bootstrap Clang and LLVM binary tools
        shell: bash
        run: |
          set -o pipefail
          POWERPC_TOOLCHAIN_FORCE_REBUILD=1 \
            bash scripts/bootstrap-powerpc-clang.sh 2>&1 | tee llvm-ias-bootstrap.log

      - name: Verify LLVM-only compiler, assembler, and archive routing
        shell: bash
        run: |
          set -euxo pipefail
          for tool in objcopy objdump readelf; do
            test ! -e "$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-$tool"
            test ! -e "$POWERPC_TOOLCHAIN_DIR/powerpc-elf/bin/$tool"
          done
          test -x "$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-as"
          test -x "$POWERPC_TOOLCHAIN_DIR/powerpc-elf/bin/as"
          grep -Fq 'ASSEMBLER=clang-integrated-mc' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-as"
          grep -Fq 'GNU_AS=disabled' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-as"
          grep -Fq 'OBJECT_ABI=ELF32-powerpc-big-endian' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-as"
          for tool in as ar ld nm objcopy objdump readelf strip ranlib; do
            test ! -e "$POWERPC_TOOLCHAIN_DIR/libexec/powerpc-clang-gnu/$tool.bfd"
          done
          grep -Fq 'GNU_BINUTILS=disabled' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-toolchain"
          grep -Fq 'SFRAME=disabled' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-toolchain"
          grep -Fq 'ASSEMBLER=clang-integrated' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-lld"
          grep -Fq 'RANLIB=llvm-ranlib' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-ar"
          "$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-ar" --version | grep -q LLVM
          "$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-ranlib" --version | grep -q LLVM
          grep -Fq 'CC     := $(TARGET)gcc' roms/openbios/Makefile.target
          ! grep -Fq 'AS     := $(TARGET)as' roms/openbios/Makefile.target
          grep -Fq '$(CC) $$EXTRACFLAGS $(CFLAGS) $(INCLUDES) $(DEPFLAGS) -c -o $@ $&lt;' \
            roms/openbios/config/xml/rules.xml
          ! grep -Fq '$(AS)' roms/openbios/config/xml/rules.xml

      - name: Verify published nm routing
        shell: bash
        run: |
          set -euxo pipefail
          public_nm="$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-nm"
          target_nm="$POWERPC_TOOLCHAIN_DIR/powerpc-elf/bin/nm"
          test -x "$public_nm"
          test -x "$target_nm"
          grep -Fq 'NM=llvm-nm' "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-nm"
          grep -Fq 'GNU_COMPATIBILITY=--gnu-compatible' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-nm"
          grep -Fq 'GNU_NM=disabled' "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-nm"
          "$public_nm" --version 2>&1 | grep -q 'llvm-nm'
          "$target_nm" --version 2>&1 | grep -q 'llvm-nm'

      - name: Verify published strip routing
        shell: bash
        run: |
          set -euxo pipefail
          public_strip="$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-strip"
          target_strip="$POWERPC_TOOLCHAIN_DIR/powerpc-elf/bin/strip"
          shim_strip="$POWERPC_TOOLCHAIN_DIR/libexec/powerpc-clang-gnu/strip"
          gnu_strip="$POWERPC_TOOLCHAIN_DIR/libexec/powerpc-clang-gnu/strip.bfd"
          test -x "$public_strip"
          test -x "$target_strip"
          test ! -e "$shim_strip"
          test ! -e "$gnu_strip"
          grep -Fq 'STRIP=llvm-strip' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-strip"
          grep -Fq 'GNU_STRIP=disabled' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-strip"
          "$public_strip" --version 2>&1 | grep -q 'llvm-strip'
          "$target_strip" --version 2>&1 | grep -q 'llvm-strip'

      - name: Build real OpenBIOS assembly corpus
        shell: bash
        env:
          BOOTSTRAP_POWERPC_TOOLCHAIN: '0'
          OPENBIOS_CROSS_COMPILE: ${{ github.workspace }}/build/toolchains/powerpc-elf/bin/powerpc-elf-
          OPENBIOS_READELF: ${{ github.workspace }}/build/toolchains/powerpc-elf/llvm/bin/llvm-readelf
          V: '1'
        run: |
          set -o pipefail
          bash scripts/build-openbios.sh 2>&1 | tee openbios-llvm-ias.log

      - name: Verify real OpenBIOS assembly objects
        shell: bash
        run: |
          set -euo pipefail
          readelf="$POWERPC_TOOLCHAIN_DIR/llvm/bin/llvm-readelf"
          objects=(
            "$OPENBIOS_BUILD_DIR/obj-ppc/target/arch/ppc/qemu/start.o"
            "$OPENBIOS_BUILD_DIR/obj-ppc/target/arch/ppc/qemu/switch.o"
            "$OPENBIOS_BUILD_DIR/obj-ppc/target/arch/ppc/qemu/timebase.o"
            "$OPENBIOS_BUILD_DIR/obj-ppc/target/libgcc/crtsavres.o"
          )
          for object in "${objects[@]}"; do
            test -s "$object"
            header="$(LC_ALL=C "$readelf" -hW "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq "Data:[[:space:]]+2's complement, big endian" <<< "$header"
            grep -Eq 'Machine:[[:space:]]+PowerPC' <<< "$header"
          done

          for source in qemu/start.S qemu/switch.S timebase.S crtsavres.S; do
            grep -F "$source" openbios-llvm-ias.log | grep -Fq 'powerpc-elf-gcc'
          done

      - name: Verify OpenBIOS output
        shell: bash
        run: |
          set -euxo pipefail
          test -s "$OPENBIOS_OUTPUT"
          "$POWERPC_TOOLCHAIN_DIR/llvm/bin/llvm-readelf" -hW "$OPENBIOS_OUTPUT" |
            grep -Eq 'Machine:[[:space:]]+PowerPC'
          "$POWERPC_TOOLCHAIN_DIR/llvm/bin/llvm-readelf" -hW "$OPENBIOS_OUTPUT" |
            grep -Eq "Data:[[:space:]]+2's complement, big endian"
          grep -Fq 'ASSEMBLER=clang-integrated-mc' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-as"
          test -x "$POWERPC_TOOLCHAIN_DIR/bin/powerpc-elf-as"
          test -x "$POWERPC_TOOLCHAIN_DIR/powerpc-elf/bin/as"
          grep -Fq 'NM=llvm-nm' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-nm"
          grep -Fq 'GNU_NM=disabled' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-nm"
          grep -Fq 'STRIP=llvm-strip' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-strip"
          grep -Fq 'GNU_STRIP=disabled' \
            "$POWERPC_TOOLCHAIN_DIR/.whp-powerpc-strip"

      - name: Show failure context
        if: failure()
        shell: bash
        run: |
          for log in llvm-ias-bootstrap.log openbios-llvm-ias.log; do
            if [[ -f "$log" ]]; then
              echo "=== $log errors ==="
              grep -n -E 'error:|FAILED:|unknown argument|invalid|unsupported|ninja: build stopped' \
                "$log" | tail -n 200 || true
              echo "=== $log tail ==="
              tail -n 200 "$log" || true
            fi
          done

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openbios-llvm-ias-failure
          path: |
            llvm-ias-bootstrap.log
            openbios-llvm-ias.log
            build/openbios-llvm-ias/obj-ppc/target/arch/ppc/qemu/start.o
            build/openbios-llvm-ias/obj-ppc/target/arch/ppc/qemu/switch.o
            build/openbios-llvm-ias/obj-ppc/target/arch/ppc/qemu/timebase.o
            build/openbios-llvm-ias/obj-ppc/target/libgcc/crtsavres.o
            build/toolchains/powerpc-elf/.whp-powerpc-toolchain
            build/toolchains/powerpc-elf/.whp-powerpc-lld
            build/toolchains/powerpc-elf/.whp-powerpc-as
            build/toolchains/powerpc-elf/.whp-powerpc-ar
            build/toolchains/powerpc-elf/.whp-powerpc-nm
            build/toolchains/powerpc-elf/.whp-powerpc-strip
          if-no-files-found: warn
          retention-days: 7
