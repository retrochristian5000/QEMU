name: WHP installed llvm-ar seed

on:
  push:
    branches: [master]
    paths:
      - 'seeds/llvm-ar.sh'
      - 'seeds/cc.sh'
      - 'scripts/whp-build/compiler-seed-common.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'scripts/tests/test-llvm-ar-seed.sh'
      - '.github/workflows/llvm-ar-seed.yml'
  pull_request:
    paths:
      - 'seeds/llvm-ar.sh'
      - 'seeds/cc.sh'
      - 'scripts/whp-build/compiler-seed-common.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'scripts/tests/test-llvm-ar-seed.sh'
      - '.github/workflows/llvm-ar-seed.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify native installed LLVM archiver seed
        run: |
          /bin/sh -n seeds/llvm-ar.sh
          /bin/sh -n scripts/tests/test-llvm-ar-seed.sh
          /bin/sh scripts/tests/test-llvm-ar-seed.sh
