name: WHP installed llvm-ar seed

on:
  push:
    branches: [master]
    paths:
      - 'seeds/ar.sh'
      - 'seeds/GNUar.sh'
      - 'scripts/tests/test-GNUar-seed.sh'
      - 'seeds/llvm-ar.sh'
      - 'seeds/cc.sh'
      - 'seeds/clang.sh'
      - 'seeds/ranlib.sh'
      - 'scripts/tests/test-ranlib-seed.sh'
      - 'scripts/whp-build/shell-functions.sh'
      - 'scripts/tests/test-archive-tool-policy.bash'
      - 'scripts/whp-build/prepare-mold.bash'
      - 'scripts/tests/test-mold-bootstrap.bash'
      - 'scripts/tests/test-clang-llvm-ar-interoperability.sh'
      - 'scripts/whp-build/compiler-seed-common.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'scripts/tests/test-ar-seed.sh'
      - 'scripts/tests/test-llvm-ar-seed.sh'
      - '.github/workflows/llvm-ar-seed.yml'
  pull_request:
    paths:
      - 'seeds/ar.sh'
      - 'seeds/GNUar.sh'
      - 'scripts/tests/test-GNUar-seed.sh'
      - 'seeds/llvm-ar.sh'
      - 'seeds/cc.sh'
      - 'seeds/clang.sh'
      - 'seeds/ranlib.sh'
      - 'scripts/tests/test-ranlib-seed.sh'
      - 'scripts/whp-build/shell-functions.sh'
      - 'scripts/tests/test-archive-tool-policy.bash'
      - 'scripts/whp-build/prepare-mold.bash'
      - 'scripts/tests/test-mold-bootstrap.bash'
      - 'scripts/tests/test-clang-llvm-ar-interoperability.sh'
      - 'scripts/whp-build/compiler-seed-common.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'scripts/tests/test-ar-seed.sh'
      - 'scripts/tests/test-llvm-ar-seed.sh'
      - '.github/workflows/llvm-ar-seed.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Audit installed Clang and llvm-ar archive compatibility
        run: |
          /bin/sh -n scripts/tests/test-clang-llvm-ar-interoperability.sh
          /bin/sh scripts/tests/test-clang-llvm-ar-interoperability.sh
      - name: Verify native host ar seed and trace
        run: |
          /bin/sh -n seeds/ar.sh
          /bin/sh -n scripts/tests/test-ar-seed.sh
          if ! /bin/sh scripts/tests/test-ar-seed.sh; then
            printf '%s\n' 'error: native ar regression failed; rerunning with failure-only trace' >&2
            /bin/sh -x scripts/tests/test-ar-seed.sh
            exit 1
          fi
      - name: Validate native ranlib really builds archive index
        run: |
          /bin/sh -n seeds/ranlib.sh
          /bin/sh -n scripts/tests/test-ranlib-seed.sh
          /bin/sh scripts/tests/test-ranlib-seed.sh
      - name: Verify GNU Binutils ar seed without changing the generic archiver
        run: |
          /bin/sh -n seeds/GNUar.sh
          /bin/sh -n scripts/tests/test-GNUar-seed.sh
          if ! /bin/sh scripts/tests/test-GNUar-seed.sh; then
            printf '%s\n' 'error: GNU ar seed failed; rerunning with failure-only trace' >&2
            /bin/sh -x scripts/tests/test-GNUar-seed.sh
            exit 1
          fi
      - name: Validate GNU and LLVM archive provider diagnostics
        shell: bash
        run: bash scripts/tests/test-archive-tool-policy.bash
      - name: Validate mold LTO archive tool preference
        shell: bash
        run: |
          if ! bash scripts/tests/test-mold-bootstrap.bash; then
            printf '%s\n' 'error: mold archive policy failed; rerunning with failure-only trace' >&2
            bash -x scripts/tests/test-mold-bootstrap.bash
            exit 1
          fi
      - name: Verify native installed LLVM archiver seed
        run: |
          /bin/sh -n seeds/llvm-ar.sh
          /bin/sh -n scripts/tests/test-llvm-ar-seed.sh
          /bin/sh scripts/tests/test-llvm-ar-seed.sh
