name: PowerMac3,1 Screamer contract
on:
  push:
    branches: [ master ]
    paths:
      - 'hw/audio/Kconfig'
      - 'hw/audio/meson.build'
      - 'hw/audio/screamer.c'
      - 'hw/ppc/Kconfig'
      - 'hw/ppc/mac_newworld.c'
      - 'hw/misc/macio/macio.c'
      - 'include/hw/audio/screamer.h'
      - 'include/hw/misc/macio/macio.h'
      - 'scripts/tests/test-powermac3_1-screamer.py'
      - '.github/workflows/powermac3_1-screamer.yml'
  pull_request:
    paths:
      - 'hw/audio/Kconfig'
      - 'hw/audio/meson.build'
      - 'hw/audio/screamer.c'
      - 'hw/ppc/Kconfig'
      - 'hw/ppc/mac_newworld.c'
      - 'hw/misc/macio/macio.c'
      - 'include/hw/audio/screamer.h'
      - 'include/hw/misc/macio/macio.h'
      - 'scripts/tests/test-powermac3_1-screamer.py'
      - '.github/workflows/powermac3_1-screamer.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out QEMU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify PowerMac3,1 Screamer contract
        run: python3 scripts/tests/test-powermac3_1-screamer.py
