name: WHP configuration tests

on:
  push:
    branches:
      - master
    paths:
      - '.gitmodules'
      - 'toolchains/aften'
      - 'toolchains/jack'
      - 'toolchains/make'
      - 'toolchains/wine'
      - 'toolchains/sdl'
      - 'docs/devel/whp-dependency-ledger.rst'
      - 'docs/devel/whp-darwin-user.rst'
      - 'darwin-user/include/target_macho.h'
      - 'darwin-user/include/macho_probe.h'
      - 'darwin-user/macho_probe.c'
      - 'darwin-user/ppc/target_abi.h'
      - 'docs/devel/index-internals.rst'
      - 'docs/devel/index-build.rst'
      - 'docs/user/main.rst'
      - 'toolchains/python-runtime'
      - 'build.sh'
      - 'builder.sh'
      - 'configs/meson/darwin.txt'
      - 'ui/cocoa.m'
      - 'scripts/ensure-ninja.py'
      - 'scripts/ensure-sdl.py'
      - 'scripts/ensure-libisofs.py'
      - 'scripts/qapi/common.py'
      - 'scripts/bootstrap-native-clang.bash'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/bootstrap-i386-efi-grub.bash'
      - 'scripts/whp-config/**'
      - 'scripts/whp-build/common.bash'
      - 'scripts/whp-build/configure.bash'
      - 'scripts/whp-build/portable-build.py'
      - 'scripts/whp-build/portable-build-entry.py'
      - 'scripts/whp-build/prepare-build.bash'
      - 'scripts/whp-build/build-targets.bash'
      - 'scripts/whp-build/host-cpu-tuning.py'
      - 'scripts/whp-build/host-cpu-tuning.bash'
      - 'scripts/whp-build/select-tests.py'
      - 'scripts/tests/test-qapi-c23-keywords.py'
      - 'scripts/tests/test-cxx-standard-config.py'
      - 'scripts/tests/test-compiler-cache-policy.py'
      - 'scripts/tests/test-darwin-lto-threads.py'
      - 'scripts/tests/test-darwin-user-recovery.py'
      - 'scripts/tests/test-darwin-macho-abi.py'
      - 'scripts/tests/test-darwin-ppc-abi.py'
      - 'scripts/tests/test-darwin-ppc-macho-format.py'
      - 'scripts/tests/test-macos-api-policy.py'
      - 'scripts/tests/test-menuconfig-scroll.py'
      - 'scripts/tests/test-python-menu-fallback.py'
      - 'scripts/tests/test-python-menu-fallback.bash'
      - 'scripts/tests/test-native-llvm-build-entry.py'
      - 'scripts/tests/test-host-cpu-tuning.py'
      - 'scripts/tests/test-host-cpu-tuning.bash'
      - 'scripts/tests/test-host-optimization.py'
      - 'scripts/tests/test-test-policy.py'
      - 'scripts/tests/test-test-selection.py'
      - 'scripts/tests/test-x87-trig-upgrade.py'
      - 'scripts/tests/test-mold-config.py'
      - 'scripts/tests/test-seabios-config.py'
      - 'scripts/tests/test-sdl-bootstrap.py'
      - 'scripts/tests/test-libisofs-bootstrap.py'
      - 'scripts/ensure-libtool.py'
      - 'scripts/tests/test-libtool-bootstrap.py'
      - 'toolchains/libtool'
      - 'scripts/tests/test-make-dependency-policy.py'
      - 'scripts/tests/test-wine-dependency-policy.py'
      - 'scripts/tests/test-whp-dependency-ledger.py'
      - 'scripts/ensure-bash.py'
      - 'scripts/tests/test-bash-bootstrap.py'
      - 'scripts/tests/test-whp-config.py'
      - 'scripts/tests/test-whp-config-integration.bash'
      - 'scripts/tests/test-whp-hardware-menu.py'
      - 'scripts/tests/test-whp-i386-audio-menu.py'
      - 'scripts/tests/test-whp-incremental.py'
      - 'scripts/tests/test-whp-sparc-menu.py'
      - 'target/i386/helper.h'
      - 'target/i386/tcg/helper-tcg.h'
      - 'target/i386/tcg/fpu_trig_helper.c'
      - 'target/i386/tcg/meson.build'
      - '.github/workflows/whp-config.yml'
  workflow_dispatch:

concurrency:
  group: whp-config-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test configuration model
        run: |
          python3 scripts/tests/test-qapi-c23-keywords.py
          python3 scripts/tests/test-cxx-standard-config.py
          python3 scripts/tests/test-bash-bootstrap.py
          python3 scripts/tests/test-whp-config.py
          python3 scripts/tests/test-whp-hardware-menu.py
          python3 scripts/tests/test-whp-i386-audio-menu.py
          python3 scripts/tests/test-compiler-cache-policy.py
          python3 scripts/tests/test-darwin-lto-threads.py
          python3 scripts/tests/test-darwin-user-recovery.py
          python3 scripts/tests/test-darwin-macho-abi.py
          python3 scripts/tests/test-darwin-ppc-abi.py
          python3 scripts/tests/test-darwin-ppc-macho-format.py
          python3 scripts/tests/test-macos-api-policy.py
          python3 scripts/tests/test-menuconfig-scroll.py
          python3 scripts/tests/test-python-menu-fallback.py
          bash scripts/tests/test-python-menu-fallback.bash
          python3 scripts/tests/test-whp-sparc-menu.py
          python3 scripts/tests/test-mold-config.py
          python3 scripts/tests/test-seabios-config.py
          python3 scripts/tests/test-sdl-bootstrap.py
          python3 scripts/tests/test-libisofs-bootstrap.py
          python3 scripts/tests/test-libtool-bootstrap.py
          python3 scripts/tests/test-make-dependency-policy.py
          python3 scripts/tests/test-wine-dependency-policy.py
          python3 scripts/tests/test-whp-dependency-ledger.py
          python3 scripts/tests/test-native-llvm-build-entry.py
          python3 scripts/tests/test-test-policy.py
          python3 scripts/tests/test-test-selection.py
          bash scripts/tests/test-whp-config-integration.bash

      - name: Test incremental planning
        run: python3 scripts/tests/test-whp-incremental.py

      - name: Test host CPU tuning policy
        run: |
          python3 scripts/tests/test-host-cpu-tuning.py
          bash scripts/tests/test-host-cpu-tuning.bash

      - name: Test host optimization policy
        run: python3 scripts/tests/test-host-optimization.py

      - name: Test x87 trig upgrade contract
        run: python3 scripts/tests/test-x87-trig-upgrade.py

      - name: Check configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ensure-ninja.py \
            scripts/ensure-sdl.py \
            scripts/ensure-libisofs.py \
            scripts/qapi/common.py \
            scripts/whp-config/config.py \
            scripts/whp-config/menuconfig.py \
            scripts/whp-build/portable-build.py \
            scripts/whp-build/portable-build-entry.py \
            scripts/whp-build/host-cpu-tuning.py \
            scripts/whp-build/select-tests.py \
            scripts/tests/test-qapi-c23-keywords.py \
            scripts/tests/test-cxx-standard-config.py \
            scripts/tests/test-compiler-cache-policy.py \
            scripts/tests/test-darwin-lto-threads.py \
            scripts/tests/test-darwin-user-recovery.py \
            scripts/tests/test-darwin-macho-abi.py \
            scripts/tests/test-darwin-ppc-abi.py \
            scripts/tests/test-darwin-ppc-macho-format.py \
            scripts/tests/test-macos-api-policy.py \
            scripts/tests/test-menuconfig-scroll.py \
            scripts/tests/test-python-menu-fallback.py \
            scripts/tests/test-native-llvm-build-entry.py \
            scripts/tests/test-host-cpu-tuning.py \
            scripts/tests/test-host-optimization.py \
            scripts/tests/test-test-policy.py \
            scripts/tests/test-test-selection.py \
            scripts/tests/test-x87-trig-upgrade.py \
            scripts/tests/test-mold-config.py \
            scripts/tests/test-seabios-config.py \
            scripts/tests/test-sdl-bootstrap.py \
            scripts/tests/test-libisofs-bootstrap.py \
            scripts/tests/test-libtool-bootstrap.py \
            scripts/tests/test-make-dependency-policy.py \
            scripts/tests/test-wine-dependency-policy.py \
            scripts/tests/test-whp-dependency-ledger.py \
            scripts/tests/test-whp-config.py \
            scripts/tests/test-whp-hardware-menu.py \
            scripts/tests/test-whp-i386-audio-menu.py \
            scripts/tests/test-whp-incremental.py \
            scripts/tests/test-whp-sparc-menu.py
          /bin/sh -n build.sh
          /bin/sh -n scripts/whp-config/menuconfig.sh
          /bin/sh -n builder.sh
          bash -n builder.sh
          bash -n scripts/bootstrap-native-clang.bash
          bash -n scripts/bootstrap-i386-efi-grub.bash
          bash -n scripts/whp-build/common.bash
          bash -n scripts/whp-build/configure.bash
          bash -n scripts/whp-build/prepare-build.bash
          bash -n scripts/whp-build/build-targets.bash
          bash -n scripts/whp-build/host-cpu-tuning.bash
          bash -n scripts/tests/test-host-cpu-tuning.bash
          bash -n scripts/tests/test-python-menu-fallback.bash
          bash -n scripts/tests/test-whp-config-integration.bash


  test-libtool-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Libtool bootstrap seeds
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential help2man m4 make perl texinfo xz-utils

      - name: Bootstrap pinned WHP Libtool
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/whp-libtool"
          prefix="$(python3 scripts/ensure-libtool.py \
            --build-dir "$build_root" --mode force)"
          test "$prefix" = "$build_root/deps/libtool"
          test -x "$prefix/bin/libtool"
          test -x "$prefix/bin/libtoolize"
          "$prefix/bin/libtool" --version | grep -Fq 'GNU libtool'
          "$prefix/bin/libtoolize" --version | grep -Fq 'GNU libtool'
          grep -Fq 'LIBTOOL_BOOTSTRAP_SCHEMA=3' \
            "$prefix/.whp-libtool-bootstrap"
          expected="$(git ls-tree HEAD toolchains/libtool | awk '{print $3}')"
          grep -Fq "LIBTOOL_GIT_COMMIT=$expected" \
            "$prefix/.whp-libtool-bootstrap"
          macro="$prefix/share/aclocal/libtool.m4"
          test -f "$macro"
          grep -Fq '[llvm-ar ar]' "$macro"
          grep -Fq '[llvm-ranlib ranlib]' "$macro"
          grep -Fq '[llvm-strip strip]' "$macro"
          grep -Fq '[llvm-objdump objdump]' "$macro"
          grep -Fq '[llvm-lipo lipo]' "$macro"

      - name: Verify Libtool bootstrap cache reuse
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/whp-libtool"
          first="$build_root/deps/libtool/.whp-libtool-bootstrap"
          before="$(cksum "$first")"
          prefix="$(python3 scripts/ensure-libtool.py \
            --build-dir "$build_root" --mode force)"
          test "$prefix" = "$build_root/deps/libtool"
          after="$(cksum "$first")"
          test "$before" = "$after"
