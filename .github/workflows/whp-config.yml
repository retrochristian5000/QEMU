name: WHP configuration tests

on:
  push:
    branches:
      - master
    paths:
      - 'build.sh'
      - 'scripts/whp-config/**'
      - 'scripts/whp-build/prepare-build.bash'
      - 'scripts/whp-build/configure.bash'
      - 'scripts/whp-build/post-build.bash'
      - 'scripts/tests/test-whp-config.py'
      - 'scripts/tests/test-whp-config-integration.bash'
      - '.github/workflows/whp-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test portable configuration backend
        run: python3 scripts/tests/test-whp-config.py

      - name: Test build configuration integration
        run: bash scripts/tests/test-whp-config-integration.bash

      - name: Check configuration script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/whp-config/config.py scripts/whp-config/menuconfig.py
          bash -n scripts/whp-build/prepare-build.bash
          bash -n scripts/whp-build/post-build.bash
          bash -n scripts/tests/test-whp-config-integration.bash
