name: WHP configuration tests

on:
  push:
    branches:
      - master
    paths:
      - 'build.sh'
      - 'builder.sh'
      - 'scripts/whp-config/**'
      - 'scripts/whp-build/common.bash'
      - 'scripts/whp-build/portable-build.py'
      - 'scripts/whp-build/portable-build-entry.py'
      - 'scripts/whp-build/prepare-build.bash'
      - 'scripts/whp-build/build-targets.bash'
      - 'scripts/whp-build/host-cpu-tuning.py'
      - 'scripts/whp-build/host-cpu-tuning.bash'
      - 'scripts/tests/test-native-llvm-build-entry.py'
      - 'scripts/tests/test-host-cpu-tuning.py'
      - 'scripts/tests/test-host-cpu-tuning.bash'
      - 'scripts/tests/test-host-optimization.py'
      - 'scripts/tests/test-x87-trig-upgrade.py'
      - 'scripts/tests/test-mold-config.py'
      - 'scripts/tests/test-seabios-config.py'
      - 'scripts/tests/test-whp-config.py'
      - 'scripts/tests/test-whp-config-integration.bash'
      - 'scripts/tests/test-whp-incremental.py'
      - 'scripts/tests/test-whp-sparc-menu.py'
      - 'target/i386/helper.h'
      - 'target/i386/tcg/helper-tcg.h'
      - 'target/i386/tcg/fpu_trig_helper.c'
      - 'target/i386/tcg/meson.build'
      - '.github/workflows/whp-config.yml'
  workflow_dispatch:

concurrency:
  group: whp-config-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test configuration model
        run: |
          python3 scripts/tests/test-whp-config.py
          python3 scripts/tests/test-whp-sparc-menu.py
          python3 scripts/tests/test-mold-config.py
          python3 scripts/tests/test-seabios-config.py
          python3 scripts/tests/test-native-llvm-build-entry.py
          bash scripts/tests/test-whp-config-integration.bash

      - name: Test incremental planning
        run: python3 scripts/tests/test-whp-incremental.py

      - name: Test host CPU tuning policy
        run: |
          python3 scripts/tests/test-host-cpu-tuning.py
          bash scripts/tests/test-host-cpu-tuning.bash

      - name: Test host optimization policy
        run: python3 scripts/tests/test-host-optimization.py

      - name: Test x87 trig upgrade contract
        run: python3 scripts/tests/test-x87-trig-upgrade.py

      - name: Check configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/whp-config/config.py \
            scripts/whp-config/menuconfig.py \
            scripts/whp-build/portable-build.py \
            scripts/whp-build/portable-build-entry.py \
            scripts/whp-build/host-cpu-tuning.py \
            scripts/tests/test-native-llvm-build-entry.py \
            scripts/tests/test-host-cpu-tuning.py \
            scripts/tests/test-host-optimization.py \
            scripts/tests/test-x87-trig-upgrade.py \
            scripts/tests/test-mold-config.py \
            scripts/tests/test-seabios-config.py \
            scripts/tests/test-whp-config.py \
            scripts/tests/test-whp-incremental.py \
            scripts/tests/test-whp-sparc-menu.py
          /bin/sh -n build.sh
          bash -n builder.sh
          bash -n scripts/whp-build/common.bash
          bash -n scripts/whp-build/prepare-build.bash
          bash -n scripts/whp-build/build-targets.bash
          bash -n scripts/whp-build/host-cpu-tuning.bash
          bash -n scripts/tests/test-host-cpu-tuning.bash
          bash -n scripts/tests/test-whp-config-integration.bash
