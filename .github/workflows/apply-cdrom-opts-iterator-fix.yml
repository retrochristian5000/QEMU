name: Apply CD-ROM QemuOpts iterator fix

on:
  push:
    paths:
      - '.github/workflows/apply-cdrom-opts-iterator-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace private QemuOpts traversal
        shell: python
        run: |
          from pathlib import Path

          path = Path('blockdev.c')
          text = path.read_text(encoding='utf-8')

          old = '''static bool drive_index_reserved(QemuOpts *self, BlockInterfaceType type,
                                           BlockInterfaceType default_type,
                                           int index)
          {
              QemuOptsList *list = qemu_find_opts("drive");
              QemuOpts *opts;

              QTAILQ_FOREACH(opts, &list->head, next) {
                  BlockInterfaceType opt_type;
                  int opt_index;
                  int bus;
                  int unit;

                  if (opts == self || drive_opts_is_legacy_cdrom(opts)) {
                      continue;
                  }
                  opt_type = drive_opts_type(opts, default_type);
                  if (opt_type != type) {
                      continue;
                  }

                  opt_index = qemu_opt_get_number(opts, "index", -1);
                  if (opt_index >= 0) {
                      if (opt_index == index) {
                          return true;
                      }
                      continue;
                  }

                  unit = qemu_opt_get_number(opts, "unit", -1);
                  if (unit < 0) {
                      continue;
                  }
                  bus = qemu_opt_get_number(opts, "bus", 0);
                  if (if_max_devs[type]) {
                      opt_index = bus * if_max_devs[type] + unit;
                  } else if (bus == 0) {
                      opt_index = unit;
                  } else {
                      continue;
                  }
                  if (opt_index == index) {
                      return true;
                  }
              }
              return false;
          }
          '''

          new = '''typedef struct DriveIndexReservation {
              QemuOpts *self;
              BlockInterfaceType type;
              BlockInterfaceType default_type;
              int index;
          } DriveIndexReservation;

          static int drive_index_reserved_cb(void *opaque, QemuOpts *opts,
                                             Error **errp)
          {
              DriveIndexReservation *reservation = opaque;
              BlockInterfaceType opt_type;
              int opt_index;
              int bus;
              int unit;

              if (opts == reservation->self || drive_opts_is_legacy_cdrom(opts)) {
                  return 0;
              }
              opt_type = drive_opts_type(opts, reservation->default_type);
              if (opt_type != reservation->type) {
                  return 0;
              }

              opt_index = qemu_opt_get_number(opts, "index", -1);
              if (opt_index >= 0) {
                  return opt_index == reservation->index;
              }

              unit = qemu_opt_get_number(opts, "unit", -1);
              if (unit < 0) {
                  return 0;
              }
              bus = qemu_opt_get_number(opts, "bus", 0);
              if (if_max_devs[reservation->type]) {
                  opt_index = bus * if_max_devs[reservation->type] + unit;
              } else if (bus == 0) {
                  opt_index = unit;
              } else {
                  return 0;
              }
              return opt_index == reservation->index;
          }

          static bool drive_index_reserved(QemuOpts *self, BlockInterfaceType type,
                                           BlockInterfaceType default_type,
                                           int index)
          {
              DriveIndexReservation reservation = {
                  .self = self,
                  .type = type,
                  .default_type = default_type,
                  .index = index,
              };

              return qemu_opts_foreach(qemu_find_opts("drive"),
                                       drive_index_reserved_cb, &reservation,
                                       NULL) != 0;
          }
          '''

          if old not in text:
              raise SystemExit('drive_index_reserved implementation changed')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- blockdev.c; then
            exit 0
          fi
          git config user.name 'retrochristian5000'
          git config user.email '252152985+retrochristian5000@users.noreply.github.com'
          git add blockdev.c
          git commit -m 'block: use public QemuOpts iterator for CD-ROM placement'
          git push origin HEAD:master
