name: Internal DTC libfdt macOS link smoke

on:
  push:
    branches: [master]
    paths:
      - 'meson.build'
      - 'system/meson.build'
      - 'system/device_tree.c'
      - 'subprojects/dtc.wrap'
      - 'scripts/tests/test-fdt-ninja-link.py'
      - 'scripts/tests/test-sam460ex-fdt-nop.py'
      - '.github/workflows/dtc-libfdt-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libfdt:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out QEMU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          brew install pkg-config meson ninja glib pixman flex bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Configure pinned internal DTC provider
        run: |
          mkdir build-fdt
          cd build-fdt
          ../configure --target-list=ppc-softmmu -Dfdt=internal \
            --disable-docs --disable-tools

      - name: Verify Ninja emulator link dependencies
        run: python3 scripts/tests/test-fdt-ninja-link.py build-fdt --internal

      - name: Build only the libfdt archive
        run: ninja -C build-fdt subprojects/dtc/libfdt/libfdt.a

      - name: Verify exported fdt_nop_node and Mach-O link
        run: |
          python3 scripts/tests/test-fdt-ninja-link.py build-fdt --internal --built
          python3 scripts/tests/test-sam460ex-fdt-nop.py \
            --runtime --build-dir build-fdt

      - name: Configure and build standalone DTC tools on macOS
        run: |
          meson setup build-dtc-native subprojects/dtc \
            -Dtools=true -Dtests=true -Dpython=disabled \
            -Dyaml=disabled -Dvalgrind=disabled
          meson compile -C build-dtc-native

      - name: Test native DTC and libfdt runtime paths
        shell: bash
        run: |
          set +e
          meson test -C build-dtc-native --print-errorlogs libfdt utilfdt dtc
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo 'Native DTC failure lines (complete Meson test log):'
            grep -nE 'FAIL|error:|ld:|clang:|assembler:|fatal:' \
              build-dtc-native/meson-logs/testlog.txt | head -n 110 || true
            if [[ -f build-dtc-native/tests/oasm_test_tree1.dts.test.s ]]; then
              echo 'Reproducing one Mach-O assembly link with stderr enabled:'
              cc -dynamiclib -o build-dtc-native/tests/oasm-debug.so \
                subprojects/dtc/tests/data.S \
                build-dtc-native/tests/oasm_test_tree1.dts.test.s || true
            fi
          fi
          exit "$status"
