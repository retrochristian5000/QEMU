name: Register MeP system target once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/mep-register-once.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Register MeP in the global target enum
        run: |
          python3 - <<'PY'
          from pathlib import Path

          qapi = Path('qapi/machine.json')
          text = qapi.read_text()
          old = "             'loongarch64', 'm68k', 'microblaze', 'mips', 'mips64',"
          new = "             'loongarch64', 'm68k', 'mep', 'microblaze', 'mips', 'mips64',"
          if text.count(old) != 1:
              raise SystemExit('unexpected SysEmuTarget layout; refusing to patch')
          qapi.write_text(text.replace(old, new))

          arch = Path('include/qemu/base-arch-defs.h')
          text = arch.read_text()
          old = "    QEMU_ARCH_M68K =        (1UL << SYS_EMU_TARGET_M68K),\n    QEMU_ARCH_MICROBLAZE =  (1UL << SYS_EMU_TARGET_MICROBLAZE),"
          new = "    QEMU_ARCH_M68K =        (1UL << SYS_EMU_TARGET_M68K),\n    QEMU_ARCH_MEP =         (1UL << SYS_EMU_TARGET_MEP),\n    QEMU_ARCH_MICROBLAZE =  (1UL << SYS_EMU_TARGET_MICROBLAZE),"
          if text.count(old) != 1:
              raise SystemExit('unexpected QEMU architecture table layout; refusing to patch')
          arch.write_text(text.replace(old, new))
          PY

      - name: Commit registration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mep-register-once.yml
          git add qapi/machine.json include/qemu/base-arch-defs.h
          git diff --cached --check
          git commit -m 'target/mep: register system target'
          git push origin HEAD:master
