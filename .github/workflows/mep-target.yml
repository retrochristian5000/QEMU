name: MeP target smoke

on:
  push:
    branches:
      - master
    paths:
      - 'target/mep/**'
      - 'target/meson.build'
      - 'target/Kconfig'
      - 'qapi/machine.json'
      - 'include/qemu/base-arch-defs.h'
      - 'configs/targets/mep-softmmu.mak'
      - 'configs/devices/mep-softmmu/**'
      - '.github/workflows/mep-target.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libpixman-1-dev python3-venv

      - name: Configure MeP system target
        run: ./configure --target-list=mep-softmmu --enable-werror --disable-docs

      - name: Build qemu-system-mep
        run: ninja -C build qemu-system-mep
