name: Apply CD-ROM placement patch

on:
  push:
    paths:
      - '.github/workflows/apply-cdrom-hdc-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('blockdev.c')
          text = path.read_text(encoding='utf-8')
          marker = 'static GPtrArray *legacy_cdrom_opts;'
          if marker in text:
              raise SystemExit(0)

          old = '''QemuOpts *drive_add(BlockInterfaceType type, int index, const char *file,
                              const char *optstr)
          {
              bool file_is_opts = type == IF_FLOPPY && file &&
                                  strstart(file, "file=", NULL);
              QemuOpts *opts;
          '''
          new = '''static GPtrArray *legacy_cdrom_opts;

          static bool drive_opts_is_legacy_cdrom(QemuOpts *opts)
          {
              guint i;

              if (!legacy_cdrom_opts) {
                  return false;
              }
              for (i = 0; i < legacy_cdrom_opts->len; i++) {
                  if (g_ptr_array_index(legacy_cdrom_opts, i) == opts) {
                      return true;
                  }
              }
              return false;
          }

          QemuOpts *drive_add(BlockInterfaceType type, int index, const char *file,
                              const char *optstr)
          {
              bool file_is_opts = type == IF_FLOPPY && file &&
                                  strstart(file, "file=", NULL);
              QemuOpts *opts;
          '''
          if old not in text:
              raise SystemExit('drive_add insertion point changed')
          text = text.replace(old, new, 1)

          old = '''    if (!opts) {
                  return NULL;
              }
              if (type != IF_DEFAULT) {
          '''
          new = '''    if (!opts) {
                  return NULL;
              }
              if (type == IF_DEFAULT && index == 2 && optstr &&
                  !strcmp(optstr, "media=cdrom")) {
                  if (!legacy_cdrom_opts) {
                      legacy_cdrom_opts = g_ptr_array_new();
                  }
                  g_ptr_array_add(legacy_cdrom_opts, opts);
              }
              if (type != IF_DEFAULT) {
          '''
          if old not in text:
              raise SystemExit('drive_add marker point changed')
          text = text.replace(old, new, 1)

          old = '''int drive_get_max_bus(BlockInterfaceType type)
          {
              int max_bus;
              BlockBackend *blk;
              DriveInfo *dinfo;

              GLOBAL_STATE_CODE();

              max_bus = -1;
              for (blk = blk_next(NULL); blk; blk = blk_next(blk)) {
                  dinfo = blk_legacy_dinfo(blk);
                  if (dinfo && dinfo->type == type && dinfo->bus > max_bus) {
                      max_bus = dinfo->bus;
                  }
              }
              return max_bus;
          }
          '''
          new = old + '''
          static BlockInterfaceType drive_opts_type(QemuOpts *opts,
                                                    BlockInterfaceType default_type)
          {
              const char *value = qemu_opt_get(opts, "if");
              BlockInterfaceType type;

              if (!value) {
                  return default_type;
              }
              for (type = 0; type < IF_COUNT; type++) {
                  if (!strcmp(value, if_name[type])) {
                      return type;
                  }
              }
              return IF_COUNT;
          }

          static bool drive_index_reserved(QemuOpts *self, BlockInterfaceType type,
                                           BlockInterfaceType default_type,
                                           int index)
          {
              QemuOptsList *list = qemu_find_opts("drive");
              QemuOpts *opts;

              QTAILQ_FOREACH(opts, &list->head, next) {
                  BlockInterfaceType opt_type;
                  int opt_index;
                  int bus;
                  int unit;

                  if (opts == self || drive_opts_is_legacy_cdrom(opts)) {
                      continue;
                  }
                  opt_type = drive_opts_type(opts, default_type);
                  if (opt_type != type) {
                      continue;
                  }

                  opt_index = qemu_opt_get_number(opts, "index", -1);
                  if (opt_index >= 0) {
                      if (opt_index == index) {
                          return true;
                      }
                      continue;
                  }

                  unit = qemu_opt_get_number(opts, "unit", -1);
                  if (unit < 0) {
                      continue;
                  }
                  bus = qemu_opt_get_number(opts, "bus", 0);
                  if (if_max_devs[type]) {
                      opt_index = bus * if_max_devs[type] + unit;
                  } else if (bus == 0) {
                      opt_index = unit;
                  } else {
                      continue;
                  }
                  if (opt_index == index) {
                      return true;
                  }
              }
              return false;
          }

          static int drive_legacy_cdrom_index(QemuOpts *opts,
                                              BlockInterfaceType type,
                                              BlockInterfaceType default_type)
          {
              static const int preferred[] = { 2, 3 };
              int candidate;
              int i;

              for (i = 0; i < ARRAY_SIZE(preferred); i++) {
                  candidate = preferred[i];
                  if (!drive_get_by_index(type, candidate) &&
                      !drive_index_reserved(opts, type, default_type, candidate)) {
                      return candidate;
                  }
              }

              for (candidate = 0; ; candidate++) {
                  if (candidate == preferred[0] || candidate == preferred[1]) {
                      continue;
                  }
                  if (!drive_get_by_index(type, candidate) &&
                      !drive_index_reserved(opts, type, default_type, candidate)) {
                      return candidate;
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit('drive reservation insertion point changed')
          text = text.replace(old, new, 1)

          old = '''    bus_id  = qemu_opt_get_number(legacy_opts, "bus", 0);
              unit_id = qemu_opt_get_number(legacy_opts, "unit", -1);
              index   = qemu_opt_get_number(legacy_opts, "index", -1);

              max_devs = if_max_devs[type];
          '''
          new = '''    bus_id  = qemu_opt_get_number(legacy_opts, "bus", 0);
              unit_id = qemu_opt_get_number(legacy_opts, "unit", -1);
              index   = qemu_opt_get_number(legacy_opts, "index", -1);
              if (drive_opts_is_legacy_cdrom(all_opts)) {
                  index = drive_legacy_cdrom_index(all_opts, type,
                                                   block_default_type);
              }

              max_devs = if_max_devs[type];
          '''
          if old not in text:
              raise SystemExit('drive address insertion point changed')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- blockdev.c; then
            exit 0
          fi
          git config user.name 'retrochristian5000'
          git config user.email '252152985+retrochristian5000@users.noreply.github.com'
          git add blockdev.c
          git commit -m 'block: let -cdrom coexist with fixed IDE drives'
          git push origin HEAD:master
