name: WHP native LLVM macOS

on:
  push:
    branches:
      - master
    paths:
      - 'build.sh'
      - 'builder.bash'
      - 'configs/meson/darwin.txt'
      - 'tcg/aarch64/tcg-target.c.inc'
      - 'tcg/tcg.c'
      - 'scripts/bootstrap-native-clang.sh'
      - 'scripts/bootstrap-native-clang.bash'
      - 'scripts/macos-builder.sh'
      - 'scripts/macos-builder.bash'
      - 'scripts/macos-build-hygiene.bash'
      - 'scripts/macos-compiler-policy.bash'
      - 'scripts/macos-arch-policy.bash'
      - 'scripts/verify-macos-lto.sh'
      - 'scripts/verify-macos-lto.bash'
      - 'scripts/whp-build/prepare-build.bash'
      - 'scripts/whp-build/configure.bash'
      - 'scripts/tests/test-darwin-lto-threads.py'
      - 'scripts/tests/test-llvm-bootstrap-isolation.bash'
      - 'scripts/tests/test-macos-arch-policy.bash'
      - 'scripts/tests/test-native-llvm-wiring.py'
      - 'scripts/tests/test-native-llvm-arm64e-bootstrap.py'
      - 'scripts/tests/test-tcg-arm64e-ptrauth.py'
      - 'toolchains/llvm-project'
      - '.github/workflows/native-llvm-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-native-llvm-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-llvm:
    name: Build native LLVM (Apple Silicon arm64e)
    runs-on: macos-26
    timeout-minutes: 90

    env:
      BUILD_DIR: ${{ github.workspace }}/build-native-llvm/qemu
      NATIVE_LLVM_DIR: ${{ github.workspace }}/build-native-llvm/toolchain
      NATIVE_LLVM_WORK_DIR: ${{ github.workspace }}/build-native-llvm/work
      NATIVE_LLVM_BUILD_DIR: ${{ github.workspace }}/build-native-llvm/work/llvm-build
      NATIVE_LLVM_MACOS_ARCH: 'auto'
      BOOTSTRAP_NATIVE_LLVM: '1'
      WHP_SHELL_PROBE_ONLY: '1'
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      JOBS: '4'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify Apple Silicon host
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Verify macOS architecture policy
        shell: bash
        run: bash scripts/tests/test-macos-arch-policy.bash

      - name: Audit arm64e TCG pointer authentication gate
        shell: bash
        run: python3 scripts/tests/test-tcg-arm64e-ptrauth.py

      - name: Verify native LLVM wiring
        shell: bash
        run: python3 scripts/tests/test-native-llvm-wiring.py

      - name: Verify native LLVM arm64e bootstrap policy
        shell: bash
        run: python3 scripts/tests/test-native-llvm-arm64e-bootstrap.py

      - name: Install native LLVM and QEMU build dependencies
        run: brew install cmake glib libslirp make ninja pixman pkgconf

      - name: Bootstrap native LLVM through build entry
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh >native-llvm.out 2>native-llvm.log
          cat native-llvm.log
          cat native-llvm.out
          grep -Fq 'WHP native LLVM macOS arch: arm64e' native-llvm.log
          grep -Fq 'WHP native LLVM bootstrap linker: system' native-llvm.log

      - name: Verify native LLVM incremental CMake graph reuse
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NATIVE_LLVM_BUILD_DIR/CMakeCache.txt"
          test -f "$NATIVE_LLVM_BUILD_DIR/build.ninja"
          sentinel="$NATIVE_LLVM_BUILD_DIR/.whp-incremental-sentinel"
          printf 'preserve CMake and Ninja state\n' >"$sentinel"

          # Force the bootstrap path without changing source or CMake policy.
          # The old implementation deleted LLVM_BUILD_DIR here and restarted
          # compilation from zero. The incremental implementation must retain
          # the generated graph and let CMake/Ninja determine that outputs are
          # already current. arm64e must also keep Apple ld rather than reusing
          # the just-installed Mach-O LLD, whose backend does not yet handle
          # ARM64_RELOC_AUTHENTICATED_POINTER.
          rm -f "$NATIVE_LLVM_DIR/.whp-native-llvm"
          ./build.sh >native-llvm-incremental.out 2>native-llvm-incremental.log
          cat native-llvm-incremental.log
          cat native-llvm-incremental.out

          test -f "$sentinel"
          test -f "$NATIVE_LLVM_BUILD_DIR/CMakeCache.txt"
          test -f "$NATIVE_LLVM_BUILD_DIR/build.ninja"
          test -f "$NATIVE_LLVM_DIR/.whp-native-llvm"
          grep -Fq 'WHP native LLVM ready:' native-llvm-incremental.log
          grep -Fq 'WHP native LLVM bootstrap linker: system' native-llvm-incremental.log

      - name: Verify host identity and native ABI
        shell: bash
        run: |
          set -euo pipefail
          marker="$NATIVE_LLVM_DIR/.whp-native-llvm"
          clang="$NATIVE_LLVM_DIR/bin/clang"
          clangxx="$NATIVE_LLVM_DIR/bin/clang++"
          ar="$NATIVE_LLVM_DIR/bin/llvm-ar"
          ranlib="$NATIVE_LLVM_DIR/bin/llvm-ranlib"
          nm="$NATIVE_LLVM_DIR/bin/llvm-nm"
          ld="$NATIVE_LLVM_DIR/bin/ld64.lld"
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"

          grep -Eq '^WHP host: macOS \(Darwin/arm64\)$' native-llvm.log
          grep -Fq 'WHP native LLVM macOS arch: arm64e' native-llvm.log
          grep -Fxq 'BOOTSTRAP_SCHEMA=8' "$marker"
          grep -Fxq 'HOST=aarch64-apple-darwin' "$marker"
          grep -Fxq 'HOST_OS=macos' "$marker"
          grep -Fxq 'HOST_KERNEL=Darwin' "$marker"
          grep -Fxq 'HOST_ARCH=arm64' "$marker"
          grep -Fxq 'MACOS_BOOTSTRAP_ARCH=arm64e' "$marker"
          grep -Eq '^LLVM_HOST_TRIPLE=aarch64-apple-(darwin|macos|macosx)' "$marker"
          grep -Eq '^LLVM_DEFAULT_TARGET_TRIPLE=aarch64-apple-(darwin|macos|macosx)' "$marker"
          grep -Fxq 'LLVM_ENABLE_PROJECTS=clang;lld' "$marker"
          grep -Fxq 'LLVM_ENABLE_RUNTIMES=compiler-rt' "$marker"
          grep -Fxq 'LLVM_INCLUDE_RUNTIMES=ON' "$marker"
          grep -Fxq 'CMAKE_OSX_ARCHITECTURES:STRING=arm64e' "$NATIVE_LLVM_BUILD_DIR/CMakeCache.txt"
          test -x "$ar"
          test -x "$ranlib"
          test -x "$nm"
          test -x "$ld"

          # The bootstrap compiler and linker are themselves arm64e host
          # programs on macOS 26. This is separate from whether Mach-O LLD can
          # consume arm64e authenticated relocations as a target linker.
          for tool in "$clang" "$clangxx" "$ld"; do
            lipo -archs "$tool" | tr ' ' '\n' | grep -Fxq arm64e
            file "$tool" | grep -Fq arm64e
          done
          "$clang" --version >/dev/null
          "$clangxx" --version >/dev/null
          "$ld" --version >/dev/null
          "$clang" -print-target-triple | grep -Eq '^aarch64-apple-(darwin|macos|macosx)'

          printf '#include <stddef.h>\n#include <stdarg.h>\nsize_t whp_native_ci(void) { return sizeof(size_t) + sizeof(va_list); }\n' |
            "$clang" -fno-omit-frame-pointer -momit-leaf-frame-pointer \
              -ffreestanding -x c -c - -o native-llvm-c.o
          printf 'int whp_native_ci_cxx() { return 0; }\n' |
            "$clangxx" -x c++ -c - -o native-llvm-cxx.o

          # ARM64e output is linked by Apple ld until the WHP Mach-O LLD fork
          # implements authenticated-pointer relocations and chained fixups.
          printf 'int main(void) { return 0; }\n' |
            "$clang" -arch arm64e -fsanitize=undefined \
              -isysroot "$sdkroot" \
              "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
              -x c - -o native-llvm-ubsan

          # Keep a direct arm64e compiler/runtime probe while QEMU itself
          # remains on arm64 in auto mode. This separates toolchain capability
          # from the still-open TCG JIT pointer-authentication audit.
          printf 'int main(void) { return 0; }\n' |
            "$clang" -arch arm64e \
              -isysroot "$sdkroot" \
              "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
              -x c - -o native-llvm-arm64e
          test -s native-llvm-c.o
          test -s native-llvm-cxx.o
          test -x native-llvm-ubsan
          test -x native-llvm-arm64e
          ./native-llvm-ubsan
          ./native-llvm-arm64e

      - name: Probe WHP Clang to macOS LTO handoff
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT="$sdkroot"
          export CC="$NATIVE_LLVM_DIR/bin/clang"
          source scripts/macos-arch-policy.bash
          selected_arch="$(NATIVE_LLVM_LDFLAG=-fuse-ld=lld WHP_MACOS_ARCH=auto \
            whp_select_macos_arch "$CC" "$sdkroot" "$MACOSX_DEPLOYMENT_TARGET" "$(uname -m)")"
          common_flags="-arch $selected_arch -isysroot $sdkroot -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          export CFLAGS="$common_flags"
          export CPPFLAGS=''
          export LDFLAGS="$common_flags -fuse-ld=lld"
          export MACOS_LTO_MANIFEST="$GITHUB_WORKSPACE/native-llvm-lto.manifest"
          export MACOS_LTO_PROBE_DIR="$GITHUB_WORKSPACE/native-llvm-lto.d"

          scripts/verify-macos-lto.sh
          cat "$MACOS_LTO_MANIFEST"
          grep -Fxq 'QEMU_HOST_LTO=1' "$MACOS_LTO_MANIFEST"
          grep -Fxq 'HOST_ARCH=arm64' "$MACOS_LTO_MANIFEST"
          grep -Fxq "CC=$NATIVE_LLVM_DIR/bin/clang" "$MACOS_LTO_MANIFEST"
          test "$selected_arch" = arm64

      - name: Build QEMU with bootstrapped LLVM and LTO
        shell: bash
        env:
          WHP_SHELL_PROBE_ONLY: '0'
          BUILD_QEMU_IMG: '0'
          BUILD_QEMU_SYSTEM_I386: '1'
          BUILD_QEMU_SYSTEM_PPC: '0'
          BUILD_OPENBIOS: '0'
          BOOTSTRAP_POWERPC_TOOLCHAIN: '0'
          BUILD_SEABIOS: '0'
          BUILD_SEABIOS_GRUB: '0'
          BOOTSTRAP_I386_TOOLCHAIN: '0'
          QEMU_HOST_LTO: '1'
          RUN_TESTS: '0'
          MACOS_ENABLE_COCOA: '1'
          MACOS_ENABLE_COREAUDIO: '0'
          MACOS_ENABLE_GTK: '0'
          MACOS_ENABLE_PA: '0'
        run: |
          set -euo pipefail
          ./build.sh qemu-system-i386 2>&1 | tee native-qemu.log
          test -x "$BUILD_DIR/qemu-system-i386"
          "$BUILD_DIR/qemu-system-i386" --version
          grep -Fq "QEMU native compiler: WHP LLVM ($NATIVE_LLVM_DIR)" native-qemu.log
          grep -Fq "QEMU C compiler:          $NATIVE_LLVM_DIR/bin/clang" native-qemu.log
          grep -Fq 'macOS Mach-O arch:       arm64' native-qemu.log
          grep -Fq "CC=$NATIVE_LLVM_DIR/bin/clang|" \
            "$BUILD_DIR/.whp-macos-build-identity"
          grep -Eq '^CFLAGS=.*-arch arm64([[:space:]]|$)' "$BUILD_DIR/.whp-macos-build-identity"
          grep -Eq '^LDFLAGS=.*-arch arm64([[:space:]]|$)' "$BUILD_DIR/.whp-macos-build-identity"
          grep -Fxq 'QEMU_HOST_LTO=1' "$BUILD_DIR/.whp-config"

      - name: Build and run ARM64e i386 TCG smoke
        shell: bash
        env:
          WHP_SHELL_PROBE_ONLY: '0'
          BOOTSTRAP_NATIVE_LLVM: '0'
          BUILD_QEMU_IMG: '0'
          BUILD_QEMU_SYSTEM_I386: '1'
          BUILD_QEMU_SYSTEM_PPC: '0'
          BUILD_OPENBIOS: '0'
          BOOTSTRAP_POWERPC_TOOLCHAIN: '0'
          BUILD_SEABIOS: '0'
          BUILD_SEABIOS_GRUB: '0'
          BOOTSTRAP_I386_TOOLCHAIN: '0'
          QEMU_HOST_LTO: '0'
          RUN_TESTS: '0'
          MACOS_ENABLE_COCOA: '0'
          MACOS_ENABLE_COREAUDIO: '0'
          MACOS_ENABLE_GTK: '0'
          MACOS_ENABLE_PA: '0'
          WHP_MACOS_ARCH: arm64e
        run: |
          set -euo pipefail
          export BUILD_DIR="$GITHUB_WORKSPACE/build-arm64e-qemu"
          export CC="$NATIVE_LLVM_DIR/bin/clang"
          export CXX="$NATIVE_LLVM_DIR/bin/clang++"
          export AR="$NATIVE_LLVM_DIR/bin/llvm-ar"
          export RANLIB="$NATIVE_LLVM_DIR/bin/llvm-ranlib"
          export NM="$NATIVE_LLVM_DIR/bin/llvm-nm"
          export OBJC="$NATIVE_LLVM_DIR/bin/clang"
          export LD="$(xcrun -f ld)"
          unset NATIVE_LLVM_LDFLAG
          export LDFLAGS=''

          ./build.sh qemu-system-i386 2>&1 | tee arm64e-qemu.log
          test -x "$BUILD_DIR/qemu-system-i386"
          lipo -archs "$BUILD_DIR/qemu-system-i386" | tr ' ' '\n' | grep -Fxq arm64e
          file "$BUILD_DIR/qemu-system-i386" | grep -Fq arm64e
          "$BUILD_DIR/qemu-system-i386" --version
          grep -Fq 'macOS Mach-O arch:       arm64e' arm64e-qemu.log

          python3 scripts/bench-i386-tcg.py \
            --qemu "$BUILD_DIR/qemu-system-i386" \
            --workload startup \
            --workload fcomi \
            --loops 200000 \
            --rounds 1 \
            --tcg-thread single

      - name: Show native LLVM failure context
        if: failure()
        shell: bash
        run: |
          tail -n 250 native-llvm.log 2>/dev/null || true
          tail -n 100 native-llvm.out 2>/dev/null || true
          tail -n 250 native-llvm-incremental.log 2>/dev/null || true
          tail -n 100 native-llvm-incremental.out 2>/dev/null || true
          tail -n 300 native-qemu.log 2>/dev/null || true
          tail -n 300 arm64e-qemu.log 2>/dev/null || true
          cat "$NATIVE_LLVM_DIR/.whp-native-llvm" 2>/dev/null || true
          cat native-llvm-lto.manifest 2>/dev/null || true
          cat native-llvm-lto.d/LTO.link.pipeline 2>/dev/null || true
          cat "$BUILD_DIR/.whp-macos-build-identity" 2>/dev/null || true
          cat "$GITHUB_WORKSPACE/build-arm64e-qemu/.whp-macos-build-identity" 2>/dev/null || true
          tail -n 200 "$BUILD_DIR/config.log" 2>/dev/null || true
          tail -n 200 "$BUILD_DIR/meson-logs/meson-log.txt" 2>/dev/null || true
          tail -n 200 "$GITHUB_WORKSPACE/build-arm64e-qemu/config.log" 2>/dev/null || true
          tail -n 200 "$GITHUB_WORKSPACE/build-arm64e-qemu/meson-logs/meson-log.txt" 2>/dev/null || true
          grep -E '^(CMAKE_OSX_ARCHITECTURES|CMAKE_OSX_SYSROOT|CMAKE_OSX_DEPLOYMENT_TARGET)' \
            "$NATIVE_LLVM_BUILD_DIR/CMakeCache.txt" 2>/dev/null || true

      - name: Upload native LLVM failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-llvm-macos-failure
          path: |
            native-llvm.log
            native-llvm.out
            native-llvm-incremental.log
            native-llvm-incremental.out
            native-qemu.log
            arm64e-qemu.log
            native-llvm-lto.manifest
            native-llvm-lto.d/
            build-native-llvm/qemu/config.log
            build-native-llvm/qemu/meson-logs/meson-log.txt
            build-native-llvm/qemu/.whp-config
            build-native-llvm/qemu/.whp-macos-build-identity
            build-arm64e-qemu/config.log
            build-arm64e-qemu/meson-logs/meson-log.txt
            build-arm64e-qemu/.whp-config
            build-arm64e-qemu/.whp-macos-build-identity
            build-native-llvm/toolchain/.whp-native-llvm
            build-native-llvm/work/llvm-build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7