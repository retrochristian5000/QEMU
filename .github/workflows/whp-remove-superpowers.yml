name: WHP remove superpowers docs

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/whp-remove-superpowers.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove forbidden repo artifacts and generators
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/superpowers
          python3 - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/implement_ibm_cga.py')
          text = script.read_text()
          start = text.find('    write("docs/superpowers/specs/2026-08-27-ibm-cga-design.md"')
          end = text.find('\n\ndef production():', start)
          if start < 0 or end < 0:
              raise SystemExit('could not find IBM CGA superpowers documentation block')
          text = text[:start] + text[end:]
          script.write_text(text)

          workflow = Path('.github/workflows/whp-cga-implement.yml')
          lines = workflow.read_text().splitlines()
          lines = [line for line in lines if 'docs/superpowers/' not in line]
          workflow.write_text('\n'.join(lines) + '\n')

          agents = Path('AGENTS.md')
          agent_text = agents.read_text()
          rule = '- Never create, commit, reference, or generate docs/superpowers; planning stays outside the repository\n'
          if rule not in agent_text:
              if not agent_text.endswith('\n'):
                  agent_text += '\n'
              agent_text += rule
              agents.write_text(agent_text)
          PY

      - name: Verify no superpowers repo path remains
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -type f -print0 | xargs -0 grep -nF 'docs/superpowers' --; then
            echo 'error: forbidden docs/superpowers reference remains' >&2
            exit 1
          fi
          test ! -e docs/superpowers
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/whp-remove-superpowers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'repo: remove superpowers documentation artifacts'
          git push origin HEAD:master
