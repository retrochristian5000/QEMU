name: WHP remove superpowers docs

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/whp-remove-superpowers.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove forbidden repo artifacts and generators
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/superpowers
          python3 - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/implement_ibm_cga.py')
          text = script.read_text()
          start = text.find('    write("docs/superpowers/specs/2026-08-27-ibm-cga-design.md"')
          end = text.find('\n\ndef production():', start)
          if start < 0 or end < 0:
              raise SystemExit('could not find IBM CGA planning-document block')
          script.write_text(text[:start] + text[end:])

          ignore = Path('.gitignore')
          lines = ignore.read_text().splitlines()
          lines = [line for line in lines if line != '/docs/superpowers/']
          ignore.write_text('\n'.join(lines) + '\n')

          agents = Path('AGENTS.md')
          agent_text = agents.read_text()
          rule = '- Never create or commit Superpowers planning/spec artifacts in this repository; keep planning outside the repo\n'
          if rule not in agent_text:
              if not agent_text.endswith('\n'):
                  agent_text += '\n'
              agent_text += rule
              agents.write_text(agent_text)
          PY

      - name: Verify cleanup tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/superpowers
          if find . -path './.git' -prune -o \
               -path './.github/workflows/whp-remove-superpowers.yml' -prune -o \
               -type f -print0 | xargs -0 grep -nF 'docs/superpowers' --; then
            echo 'error: forbidden planning path reference remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- AGENTS.md .gitignore .github/scripts/implement_ibm_cga.py docs/superpowers
          git commit -m 'repo: remove superpowers documentation artifacts'
          git push origin HEAD:master
