name: PowerPC Clang ABI modes

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/bootstrap-powerpc-clang-base.sh'
      - 'scripts/tests/test-powerpc-clang-abi-modes.bash'
      - '.github/workflows/powerpc-clang-abi-modes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerpc-clang-abi-modes:
    name: Check PPC32/PPC64 big-endian Clang modes
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Clang ABI probes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm

      - name: Validate ABI mode test shell
        run: bash -n scripts/tests/test-powerpc-clang-abi-modes.bash

      - name: Exercise PPC32/PPC64 ABI modes
        run: bash scripts/tests/test-powerpc-clang-abi-modes.bash
