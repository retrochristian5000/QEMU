name: Selective QEMU tools

on:
  push:
    branches:
      - master
    paths:
      - 'configure'
      - 'meson.build'
      - 'meson_options.txt'
      - 'scripts/meson-buildoptions.py'
      - 'scripts/meson-buildoptions.sh'
      - 'scripts/tests/test-selective-tools.py'
      - 'tests/functional/meson.build'
      - 'tests/qemu-iotests/meson.build'
      - '.github/workflows/selective-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-selective-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Test selective tools contract
        run: python3 scripts/tests/test-selective-tools.py
