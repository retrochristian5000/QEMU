name: WHP managed Perl bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'toolchains/perl'
      - 'seeds/perl.sh'
      - 'seeds/ranlib.sh'
      - 'seeds/ar.sh'
      - 'seeds/xcrun.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'build.sh'
      - 'scripts/ensure-perl.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - 'scripts/whp-config/menu-options.def'
      - 'scripts/tests/test-perl-bootstrap.py'
      - 'scripts/tests/test-perl-configure-unattended.py'
      - '.github/workflows/managed-perl.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'toolchains/perl'
      - 'seeds/perl.sh'
      - 'seeds/ranlib.sh'
      - 'seeds/ar.sh'
      - 'seeds/xcrun.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'build.sh'
      - 'scripts/ensure-perl.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - 'scripts/whp-config/menu-options.def'
      - 'scripts/tests/test-perl-bootstrap.py'
      - 'scripts/tests/test-perl-configure-unattended.py'
      - '.github/workflows/managed-perl.yml'

permissions:
  contents: read

jobs:
  managed-perl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - name: Verify native Perl seed and pinned build graph
        run: |
          python3 scripts/tests/test-perl-seed.py
          python3 scripts/tests/test-perl-bootstrap.py
          python3 scripts/tests/test-perl-configure-unattended.py
          sh -n seeds/xcrun.sh
          if [ "$(uname -s)" = Darwin ]; then
            sh seeds/xcrun.sh --check
            if WHP_XCRUN_SEED=/bin/false sh seeds/xcrun.sh --check; then
              echo 'invalid explicit xcrun seed unexpectedly accepted' >&2
              exit 1
            fi
          else
            sh seeds/xcrun.sh --check
          fi
          sh -n seeds/ar.sh
          sh seeds/ar.sh --check
          # Explicit bad archivers must fail closed rather than fall back.
          if WHP_AR_SEED=/bin/false sh seeds/ar.sh --check; then
            echo 'invalid explicit ar seed unexpectedly accepted' >&2
            exit 1
          fi
          # Reject archivers that can create an archive but silently skip
          # incremental replacement. Successful exit status is insufficient.
          real_ar="$(sh seeds/ar.sh --print-seed)"
          fake_ar_dir="$(mktemp -d "$RUNNER_TEMP/whp-ar-seed-test.XXXXXX")"
          cat > "$fake_ar_dir/no-update-ar" <<'EOF'
          #!/bin/sh
          if [ "$1" = rcs ]; then
              exit 0
          fi
          exec "$WHP_AR_TEST_REAL_AR" "$@"
          EOF
          chmod +x "$fake_ar_dir/no-update-ar"
          if WHP_AR_TEST_REAL_AR="$real_ar" WHP_AR_SEED="$fake_ar_dir/no-update-ar" sh seeds/ar.sh --check; then
            echo 'archiver with no-op member replacement unexpectedly accepted' >&2
            exit 1
          fi
          rm -rf -- "$fake_ar_dir"
          sh -n seeds/ranlib.sh
          sh seeds/ranlib.sh --check

      - name: Initialize pinned Perl fork
        run: git submodule update --init --depth 1 -- toolchains/perl

      - name: Build and validate native managed Perl
        shell: bash
        run: |
          set -euo pipefail
          export WHP_PERL_BOOTSTRAP_SEED="$(sh seeds/perl.sh --print-seed)"
          export WHP_PERL_SEED="$WHP_PERL_BOOTSTRAP_SEED"
          export PERL="$WHP_PERL_BOOTSTRAP_SEED"
          export MAKE_CMD="$(command -v make)"
          result="$(python3 scripts/ensure-perl.py --build-dir "$RUNNER_TEMP/whp-perl")"
          test -x "$result"
          "$result" -e 'use strict; use warnings; use Config; print "$Config{osname}\n";'

      - name: Reuse validated native Perl build
        shell: bash
        run: |
          set -euo pipefail
          export WHP_PERL_BOOTSTRAP_SEED="$(sh seeds/perl.sh --print-seed)"
          export WHP_PERL_SEED="$WHP_PERL_BOOTSTRAP_SEED"
          export PERL="$WHP_PERL_BOOTSTRAP_SEED"
          export MAKE_CMD="$(command -v make)"
          installed="$RUNNER_TEMP/whp-perl/deps/perl/bin/perl"
          marker="$RUNNER_TEMP/whp-perl/deps/perl/.whp-perl-bootstrap"
          test -x "$installed"
          test -f "$marker"
          before="$(python3 -c 'import os,sys; print(os.stat(sys.argv[1]).st_mtime_ns, os.stat(sys.argv[2]).st_mtime_ns)' "$installed" "$marker")"
          result="$(python3 scripts/ensure-perl.py --build-dir "$RUNNER_TEMP/whp-perl")"
          test "$result" = "$installed"
          test -x "$result"
          after="$(python3 -c 'import os,sys; print(os.stat(sys.argv[1]).st_mtime_ns, os.stat(sys.argv[2]).st_mtime_ns)' "$installed" "$marker")"
          test "$before" = "$after"
