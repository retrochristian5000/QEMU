name: WHP managed Perl bootstrap

on:
  push:
    branches: [master]
    paths:
      - '.gitmodules'
      - 'toolchains/perl'
      - 'seeds/perl.sh'
      - 'seeds/ranlib.sh'
      - 'seeds/ar.sh'
      - 'scripts/tests/test-ar-seed.sh'
      - 'scripts/tests/test-ranlib-seed.sh'
      - 'seeds/xcrun.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'build.sh'
      - 'scripts/ensure-perl.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - 'scripts/whp-config/menu-options.def'
      - 'scripts/tests/test-perl-bootstrap.py'
      - 'scripts/tests/test-perl-darwin-hints.py'
      - 'scripts/tests/test-perl-autotools-boundary.py'
      - 'scripts/tests/test-perl-core-headers.py'
      - 'scripts/tests/test-perl-configure-unattended.py'
      - 'scripts/tests/test-perl-configure-control-flow.py'
      - 'scripts/tests/test-perl-makefile-compat.py'
      - '.github/workflows/managed-perl.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'toolchains/perl'
      - 'seeds/perl.sh'
      - 'seeds/ranlib.sh'
      - 'seeds/ar.sh'
      - 'scripts/tests/test-ar-seed.sh'
      - 'scripts/tests/test-ranlib-seed.sh'
      - 'seeds/xcrun.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'build.sh'
      - 'scripts/ensure-perl.py'
      - 'scripts/bootstrap_env.py'
      - 'scripts/whp-build/host-tools.sh'
      - 'scripts/whp-config/config.py'
      - 'scripts/whp-config/menu-options.def'
      - 'scripts/tests/test-perl-bootstrap.py'
      - 'scripts/tests/test-perl-darwin-hints.py'
      - 'scripts/tests/test-perl-autotools-boundary.py'
      - 'scripts/tests/test-perl-core-headers.py'
      - 'scripts/tests/test-perl-configure-unattended.py'
      - 'scripts/tests/test-perl-configure-control-flow.py'
      - 'scripts/tests/test-perl-makefile-compat.py'
      - '.github/workflows/managed-perl.yml'

permissions:
  contents: read

jobs:
  managed-perl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false

      - name: Verify native Perl seed and pinned build graph
        run: |
          python3 scripts/tests/test-perl-seed.py
          python3 scripts/tests/test-perl-autotools-boundary.py -v
          python3 scripts/tests/test-perl-bootstrap.py
          python3 scripts/tests/test-perl-core-headers.py -v
          python3 scripts/tests/test-perl-configure-unattended.py
          sh -n seeds/xcrun.sh
          if [ "$(uname -s)" = Darwin ]; then
            sh seeds/xcrun.sh --check
            if WHP_XCRUN_SEED=/bin/false sh seeds/xcrun.sh --check; then
              echo 'invalid explicit xcrun seed unexpectedly accepted' >&2
              exit 1
            fi
          else
            sh seeds/xcrun.sh --check
          fi
          sh -n seeds/ar.sh
          sh seeds/ar.sh --check
          sh scripts/tests/test-ar-seed.sh
          # Explicit bad archivers must fail closed rather than fall back.
          if WHP_AR_SEED=/bin/false sh seeds/ar.sh --check; then
            echo 'invalid explicit ar seed unexpectedly accepted' >&2
            exit 1
          fi
          # Reject archivers that can create an archive but silently skip
          # incremental replacement. Successful exit status is insufficient.
          real_ar="$(sh seeds/ar.sh --print-seed)"
          fake_ar_dir="$(mktemp -d "$RUNNER_TEMP/whp-ar-seed-test.XXXXXX")"
          cat > "$fake_ar_dir/no-update-ar" <<'EOF'
          #!/bin/sh
          if [ "$1" = rcs ]; then
              exit 0
          fi
          exec "$WHP_AR_TEST_REAL_AR" "$@"
          EOF
          chmod +x "$fake_ar_dir/no-update-ar"
          if WHP_AR_TEST_REAL_AR="$real_ar" WHP_AR_SEED="$fake_ar_dir/no-update-ar" sh seeds/ar.sh --check; then
            echo 'archiver with no-op member replacement unexpectedly accepted' >&2
            exit 1
          fi
          rm -rf -- "$fake_ar_dir"
          sh -n seeds/ranlib.sh
          sh seeds/ranlib.sh --check
          sh scripts/tests/test-ranlib-seed.sh

      - name: Initialize pinned Perl fork
        run: git submodule update --init --depth 1 -- toolchains/perl

      - name: Verify pinned Perl shell control flow before compilation
        run: |
          python3 scripts/tests/test-perl-configure-control-flow.py -v
          python3 scripts/tests/test-perl-darwin-hints.py -v
          python3 scripts/tests/test-perl-makefile-compat.py -v
          test -f toolchains/perl/t/porting/configure_shell_control_flow.t

      - name: Build and validate native managed Perl
        shell: bash
        run: |
          set -euo pipefail
          export WHP_PERL_BOOTSTRAP_SEED="$(sh seeds/perl.sh --print-seed)"
          export WHP_PERL_SEED="$WHP_PERL_BOOTSTRAP_SEED"
          export PERL="$WHP_PERL_BOOTSTRAP_SEED"
          export MAKE_CMD="$(command -v make)"
          result="$(python3 scripts/ensure-perl.py --build-dir "$RUNNER_TEMP/whp-perl")"
          test -x "$result"
          "$result" -e 'use strict; use warnings; use Config; print "$Config{osname}\n";'
          # Exercise the same module selection used by managed Autoconf.
          selected="$(WHP_PERL_SEED="$result" PERL="$result" /bin/sh seeds/perl.sh --print-autotools-seed)"
          test "$selected" = "$result"
          "$result" -MConfig -e '
            my %have = map { $_ => 1 } split /\\s+/, $Config{extensions};
            for my $name (qw(Cwd Errno Fcntl IO POSIX)) {
                die "Autotools extension missing: $name\\n" unless $have{$name};
            }
            print "WHP Autotools extension closure: ok\\n";
          '

      - name: Run updated pinned Perl C portability regression
        shell: bash
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/whp-perl/deps/perl/bin/perl"
          test -x "$installed"
          # The test must come from the exact source commit QEMU records.
          pinned="$(git rev-parse HEAD:toolchains/perl)"
          checked_out="$(git -C toolchains/perl rev-parse HEAD)"
          test "$pinned" = "$checked_out"
          (
            cd toolchains/perl
            test -f t/porting/configure_shell_control_flow.t
            control_output="$("$installed" t/porting/configure_shell_control_flow.t)"
            printf '%s\n' "$control_output"
            grep -Fxq '1..11' <<< "$control_output"
            test "$(grep -Ec '^ok ([1-9]|1[01]) ' <<< "$control_output")" -eq 11
            if grep -Eq '^not ok ' <<< "$control_output"; then
              printf '%s\n' 'error: pinned Perl shell control-flow regression failed' >&2
              exit 1
            fi
            test -f t/porting/configure_c_portability.t
            output="$("$installed" t/porting/configure_c_portability.t)"
            printf '%s\n' "$output"
            grep -Fxq '1..5' <<< "$output"
            test "$(grep -Ec '^ok [1-5] ' <<< "$output")" -eq 5
            if grep -Eq '^not ok ' <<< "$output"; then
              printf '%s\n' 'error: pinned Perl C portability regression failed' >&2
              exit 1
            fi
            test -f t/porting/darwin_hints_portability.t
            hints_output="$("$installed" t/porting/darwin_hints_portability.t)"
            printf '%s\n' "$hints_output"
            grep -Fxq '1..9' <<< "$hints_output"
            test "$(grep -Ec '^ok [1-9] ' <<< "$hints_output")" -eq 9
            if grep -Eq '^not ok ' <<< "$hints_output"; then
              printf '%s\n' 'error: pinned Perl Darwin hints regression failed' >&2
              exit 1
            fi
          )

      - name: Reuse validated native Perl build
        shell: bash
        run: |
          set -euo pipefail
          export WHP_PERL_BOOTSTRAP_SEED="$(sh seeds/perl.sh --print-seed)"
          export WHP_PERL_SEED="$WHP_PERL_BOOTSTRAP_SEED"
          export PERL="$WHP_PERL_BOOTSTRAP_SEED"
          export MAKE_CMD="$(command -v make)"
          installed="$RUNNER_TEMP/whp-perl/deps/perl/bin/perl"
          marker="$RUNNER_TEMP/whp-perl/deps/perl/.whp-perl-bootstrap"
          test -x "$installed"
          test -f "$marker"
          before="$(python3 -c 'import os,sys; print(os.stat(sys.argv[1]).st_mtime_ns, os.stat(sys.argv[2]).st_mtime_ns)' "$installed" "$marker")"
          result="$(python3 scripts/ensure-perl.py --build-dir "$RUNNER_TEMP/whp-perl")"
          test "$result" = "$installed"
          test -x "$result"
          after="$(python3 -c 'import os,sys; print(os.stat(sys.argv[1]).st_mtime_ns, os.stat(sys.argv[2]).st_mtime_ns)' "$installed" "$marker")"
          test "$before" = "$after"
