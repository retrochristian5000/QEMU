name: sed seed adapter

on:
  push:
    branches: [master]
    paths:
      - 'sed.sh'
      - 'build.sh'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/ensure-automake.py'
      - 'scripts/ensure-sed.py'
      - 'scripts/tests/test-sed-bootstrap-order.py'
      - '.github/workflows/sed-seed-adapter.yml'
  pull_request:
    paths:
      - 'sed.sh'
      - 'build.sh'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/ensure-automake.py'
      - 'scripts/ensure-sed.py'
      - 'scripts/tests/test-sed-bootstrap-order.py'
      - '.github/workflows/sed-seed-adapter.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify sed bootstrap ordering
        run: python3 scripts/tests/test-sed-bootstrap-order.py

      - name: Exercise pre-bootstrap sed adapter
        shell: bash
        run: |
          set -euo pipefail
          seed="$(./sed.sh --print-seed)"
          test -x "$seed"
          ./sed.sh --check
          test "$(printf 'alpha\n' | ./sed.sh -n 's/^alpha$/beta/p')" = beta
          test "$(printf 'A B/C\n' | ./sed.sh 's,[^A-Za-z0-9_.-],-,g')" = A-B-C

          # Putting the adapter on PATH under the literal name sed must not
          # recurse back into itself.
          shim="$RUNNER_TEMP/whp-sed-seed-bin"
          mkdir -p "$shim"
          ln -sf "$GITHUB_WORKSPACE/sed.sh" "$shim/sed"
          result="$(printf 'alpha\n' | \
            PATH="$shim:$PATH" "$shim/sed" -n 's/^alpha$/beta/p')"
          test "$result" = beta

          # Explicit provenance must still resolve to the same underlying seed.
          test "$(WHP_SED_SEED="$seed" ./sed.sh --print-seed)" = "$seed"

          # Verify that malformed substitutions retain the seed's failure
          # status while opt-in tracing identifies the exact offending argv.
          bad_log="$RUNNER_TEMP/whp-sed-malformed.log"
          if WHP_SED_SEED="$seed" WHP_SED_TRACE=errors \
            ./sed.sh -e 's/alpha/beta' </dev/null > /dev/null 2>"$bad_log"; then
            echo "Malformed sed substitution unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'WHP sed seed failed (exit' "$bad_log"
          grep -Fq 'argv[1]=<s/alpha/beta>' "$bad_log"
          test "$(WHP_SED_TRACE=errors ./sed.sh -n 's/^alpha$/beta/p' \
            <<<'alpha')" = beta

          # The special recursion status must not be lost by the shell's if.
          recursion_log="$RUNNER_TEMP/whp-sed-recursion.log"
          if WHP_SED_SEED="$GITHUB_WORKSPACE/sed.sh" \
            ./sed.sh --print-seed >/dev/null 2>"$recursion_log"; then
            echo "Recursive sed seed unexpectedly accepted" >&2
            exit 1
          fi
          grep -Fq 'points back to the QEMU sed adapter' "$recursion_log"
