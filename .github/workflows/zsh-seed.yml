name: Optional native Zsh seed

on:
  push:
    branches: [master]
    paths:
      - 'seeds/zsh.sh'
      - 'scripts/tests/test-zsh-seed.py'
      - '.github/workflows/zsh-seed.yml'
  pull_request:
    paths:
      - 'seeds/zsh.sh'
      - 'scripts/tests/test-zsh-seed.py'
      - '.github/workflows/zsh-seed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-zsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install optional Zsh on Linux test host
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh

      - name: Verify independent native Zsh seed
        run: |
          test -x seeds/zsh.sh
          /bin/sh -n seeds/zsh.sh
          python3 scripts/tests/test-zsh-seed.py
