name: WHP QEMU smoke CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-qemu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-active-target:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - s2650
          - trimedia
          - ppc
          - i386

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            zlib1g-dev

      - name: Configure ${{ matrix.target }}
        run: |
          mkdir build-ci
          cd build-ci
          ../configure \
            --target-list=${{ matrix.target }}-softmmu \
            --disable-docs

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          ninja -C build-ci 2>&1 | tee build-ci/build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo '=== compiler errors ==='
          grep -n -E 'FAILED:|error:|undefined reference|ninja: build stopped' \
            build-ci/build.log | tail -n 200 || true
          echo '=== build log tail ==='
          tail -n 200 build-ci/build.log || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build-ci/build.log
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test ${{ matrix.target }}
        run: |
          set -eux
          binary="build-ci/qemu-system-${{ matrix.target }}"
          test -x "${binary}"
          "${binary}" -version
          "${binary}" -machine help >/dev/null
