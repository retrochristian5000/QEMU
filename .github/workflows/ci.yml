name: WHP QEMU smoke CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-qemu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-sdk-policy:
    name: Check macOS SDK policy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test selected SDK version handling
        run: bash scripts/tests/test-macos-sdk-selection.bash

  build-macos-ppc:
    name: Build ppc on macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUILD_DIR: ${{ github.workspace }}/build-macos-ppc
      BUILD_OPENBIOS: '0'
      BOOTSTRAP_POWERPC_TOOLCHAIN: '0'
      QEMU_HOST_LTO: '1'
      QEMU_TARGET_LIST: ppc-softmmu
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: brew install glib libslirp make ninja pixman pkgconf

      - name: Build PowerPC system emulator through macOS wrapper
        shell: bash
        run: |
          set -o pipefail
          ./build.sh qemu-system-ppc 2>&1 | tee macos-build.log

      - name: Show build failure context
        if: failure()
        shell: bash
        run: |
          if [[ -f macos-build.log ]]; then
            echo '=== compiler errors ==='
            grep -n -E 'FAILED:|error:|Undefined symbols|ninja: build stopped' \
              macos-build.log | tail -n 200 || true
            echo '=== build log tail ==='
            tail -n 200 macos-build.log || true
          fi
          if [[ -f build-macos-ppc/meson-logs/meson-log.txt ]]; then
            echo '=== meson log tail ==='
            tail -n 200 build-macos-ppc/meson-logs/meson-log.txt || true
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ppc-build-logs
          path: |
            macos-build.log
            build-macos-ppc/config.log
            build-macos-ppc/meson-logs/meson-log.txt
            build-macos-ppc/.whp-build-artifacts
            build-macos-ppc/.whp-config
            build-macos-ppc/.whp-macos-build-identity
            build-macos-ppc/.whp-macos-lto
            build-macos-ppc/.whp-macos-toolchain
          if-no-files-found: warn
          retention-days: 7

  build-active-target:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - s2650
          - trimedia
          - ppc
          - i386
          - x86

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ccache \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            python3-venv \
            zlib1g-dev

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure ${{ matrix.target }}
        env:
          CC: ccache gcc
          CXX: ccache g++
        shell: bash
        run: |
          mkdir build-ci
          cd build-ci
          set -o pipefail
          ../configure \
            --target-list=${{ matrix.target }}-softmmu \
            --disable-docs \
            2>&1 | tee configure.log

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          ninja -C build-ci qemu-system-${{ matrix.target }} 2>&1 | tee build-ci/build.log

      - name: Show build failure context
        if: failure()
        shell: bash
        run: |
          if [[ -f build-ci/build.log ]]; then
            echo '=== compiler errors ==='
            grep -n -E 'FAILED:|error:|undefined reference|ninja: build stopped' \
              build-ci/build.log | tail -n 200 || true
            echo '=== build log tail ==='
            tail -n 200 build-ci/build.log || true
          fi
          if [[ -f build-ci/configure.log ]]; then
            echo '=== configure log tail ==='
            tail -n 200 build-ci/configure.log || true
          fi
          if [[ -f build-ci/meson-logs/meson-log.txt ]]; then
            echo '=== meson log tail ==='
            tail -n 200 build-ci/meson-logs/meson-log.txt || true
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: |
            build-ci/configure.log
            build-ci/build.log
            build-ci/meson-logs/meson-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}

      - name: Smoke-test ${{ matrix.target }}
        run: |
          set -eux
          binary="build-ci/qemu-system-${{ matrix.target }}"
          test -x "${binary}"
          "${binary}" -version
          "${binary}" -machine help >/dev/null

      - name: Test original 16-bit x86 target
        if: matrix.target == 'x86'
        run: |
          set -eux
          ninja -C build-ci tests/qtest/x86-16bit-test
          build-ci/pyvenv/bin/meson test -C build-ci --print-errorlogs \
            qtest-x86/x86-16bit-test
