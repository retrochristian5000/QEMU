name: WHP QEMU fast CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-qemu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-policy:
    name: Check build policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test selected macOS SDK version handling
        run: bash scripts/tests/test-macos-sdk-selection.bash

      - name: Test native LLVM incremental bootstrap contract
        run: bash scripts/tests/test-llvm-incremental-bootstrap.bash scripts/bootstrap-native-clang.bash 'native LLVM'

      - name: Test tagless QEMU version generation
        run: bash scripts/tests/test-qemu-version.bash

      - name: Test QEMU Error ownership guard
        run: bash scripts/tests/test-error-autoptr.bash

      - name: Test SeaBIOS -g handoff contract
        run: python3 scripts/tests/test-seabios-g-option.py

  build-active-target:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - s2650
          - trimedia
          - ppc
          - i386
          - x86

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ccache \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            python3-venv \
            zlib1g-dev

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Configure ${{ matrix.target }}
        env:
          CC: ccache gcc
          CXX: ccache g++
        shell: bash
        run: |
          mkdir build-ci
          cd build-ci
          set -o pipefail
          ../configure \
            --target-list=${{ matrix.target }}-softmmu \
            --disable-docs \
            2>&1 | tee configure.log

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          ninja -C build-ci qemu-system-${{ matrix.target }} 2>&1 | tee build-ci/build.log

      - name: Smoke-test ${{ matrix.target }}
        run: |
          set -eux
          binary="build-ci/qemu-system-${{ matrix.target }}"
          test -x "${binary}"
          "${binary}" -version
          "${binary}" -machine help >/dev/null

      - name: Test buffer_is_zero quick coverage
        if: matrix.target == 'x86'
        run: |
          set -eux
          ninja -C build-ci tests/unit/test-bufferiszero
          build-ci/tests/unit/test-bufferiszero --tap -k

      - name: Reproduce 40p boot serial test
        if: matrix.target == 'ppc'
        env:
          QTEST_QEMU_BINARY: ${{ github.workspace }}/build-ci/qemu-system-ppc
        run: |
          set -eux
          ninja -C build-ci tests/qtest/boot-serial-test
          build-ci/tests/qtest/boot-serial-test --tap -k \
            -p /ppc/boot-serial/40p

      - name: Verify live Sawtooth FireWire PCI device
        if: matrix.target == 'ppc'
        run: python3 scripts/tests/test-powermac3_1-firewire-runtime.py build-ci/qemu-system-ppc

      - name: Test KeyLargo timer precision
        if: matrix.target == 'ppc'
        run: |
          set -eux
          ninja -C build-ci tests/qtest/macio-timer-test
          build-ci/pyvenv/bin/meson test -C build-ci --print-errorlogs \
            qtest-ppc/macio-timer-test

      - name: Test rich floppy shortcut options
        if: matrix.target == 'i386'
        shell: bash
        run: |
          set -euo pipefail
          binary="build-ci/qemu-system-i386"
          image="build-ci/fda-rich.img"
          qmp_out="build-ci/fda-rich-qmp.out"

          truncate -s 1440K "$image"
          printf '%s\n' \
            '{"execute":"qmp_capabilities"}' \
            '{"execute":"query-block"}' \
            '{"execute":"quit"}' |
            "$binary" \
              -machine pc \
              -display none \
              -monitor none \
              -serial none \
              -net none \
              -S \
              -qmp stdio \
              -fda "file=$image,id=bootfloppy,readonly=on,speed=500k" \
              >"$qmp_out"

          grep -Eq '"device"[[:space:]]*:[[:space:]]*"bootfloppy"' "$qmp_out"
          grep -Eq '"ro"[[:space:]]*:[[:space:]]*true' "$qmp_out"

      - name: Test -hdc and -cdrom coexistence
        if: matrix.target == 'i386'
        run: bash scripts/tests/test-cdrom-hdc.bash build-ci/qemu-system-i386

      - name: Test original 16-bit x86 target
        if: matrix.target == 'x86'
        run: |
          set -eux
          ninja -C build-ci tests/qtest/x86-16bit-test
          build-ci/pyvenv/bin/meson test -C build-ci --print-errorlogs \
            qtest-x86/x86-16bit-test

      - name: Show build failure context
        if: failure()
        shell: bash
        run: |
          if [[ -f build-ci/build.log ]]; then
            echo '=== compiler errors ==='
            grep -n -E 'FAILED:|error:|undefined reference|ninja: build stopped' \
              build-ci/build.log | tail -n 200 || true
            echo '=== build log tail ==='
            tail -n 200 build-ci/build.log || true
          fi
          if [[ -f build-ci/configure.log ]]; then
            echo '=== configure log tail ==='
            tail -n 200 build-ci/configure.log || true
          fi
          if [[ -f build-ci/meson-logs/meson-log.txt ]]; then
            echo '=== meson log tail ==='
            tail -n 200 build-ci/meson-logs/meson-log.txt || true
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: |
            build-ci/configure.log
            build-ci/build.log
            build-ci/meson-logs/meson-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
