name: WHP QEMU smoke CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-qemu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-active-target:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - s2650
          - trimedia
          - ppc
          - i386

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ccache \
            libfdt-dev \
            python3-venv

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Configure ${{ matrix.target }}
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          mkdir build-ci
          cd build-ci
          ../configure \
            --target-list=${{ matrix.target }}-softmmu \
            --disable-docs

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          ninja -C build-ci qemu-system-${{ matrix.target }} 2>&1 | tee build-ci/build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo '=== compiler errors ==='
          grep -n -E 'FAILED:|error:|undefined reference|ninja: build stopped' \
            build-ci/build.log | tail -n 200 || true
          echo '=== build log tail ==='
          tail -n 200 build-ci/build.log || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build-ci/build.log
          if-no-files-found: error
          retention-days: 7

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: whp-qemu-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke-test ${{ matrix.target }}
        run: |
          set -eux
          binary="build-ci/qemu-system-${{ matrix.target }}"
          test -x "${binary}"
          "${binary}" -version
          "${binary}" -machine help >/dev/null
