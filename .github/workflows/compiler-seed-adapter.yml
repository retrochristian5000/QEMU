name: native compiler and linker seed adapters

on:
  push:
    branches: [master]
    paths:
      - 'seeds/cc.sh'
      - 'seeds/cpp.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'scripts/tests/test-macos-developer-tools.bash'
      - 'seeds/cxx.sh'
      - 'scripts/whp-build/compiler-seed-common.sh'
      - 'seeds/ld.sh'
      - 'scripts/macos-builder.bash'
      - 'scripts/whp-build/prepare-build.bash'
      - 'build.sh'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/bootstrap-native-clang.bash'
      - 'scripts/ensure-bash.py'
      - 'scripts/ensure-git.py'
      - 'scripts/ensure-jack.py'
      - 'scripts/ensure-ninja.py'
      - 'scripts/ensure-sdl.py'
      - 'scripts/ensure-sed.py'
      - 'scripts/tests/test-bootstrap-compiler-policy.py'
      - 'scripts/tests/test-compiler-seed-diagnostics.bash'
      - 'docs/devel/whp-dependency-ledger.rst'
      - '.github/workflows/compiler-seed-adapter.yml'
  pull_request:
    paths:
      - 'seeds/cc.sh'
      - 'seeds/cpp.sh'
      - 'scripts/whp-build/macos-developer-tools.sh'
      - 'scripts/tests/test-macos-developer-tools.bash'
      - 'seeds/cxx.sh'
      - 'scripts/whp-build/compiler-seed-common.sh'
      - 'seeds/ld.sh'
      - 'scripts/macos-builder.bash'
      - 'scripts/whp-build/prepare-build.bash'
      - 'build.sh'
      - 'scripts/bootstrap-python.sh'
      - 'scripts/bootstrap-native-clang.bash'
      - 'scripts/ensure-bash.py'
      - 'scripts/ensure-git.py'
      - 'scripts/ensure-jack.py'
      - 'scripts/ensure-ninja.py'
      - 'scripts/ensure-sdl.py'
      - 'scripts/ensure-sed.py'
      - 'scripts/tests/test-bootstrap-compiler-policy.py'
      - 'scripts/tests/test-compiler-seed-diagnostics.bash'
      - 'docs/devel/whp-dependency-ledger.rst'
      - '.github/workflows/compiler-seed-adapter.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify static compiler policy
        run: python3 scripts/tests/test-bootstrap-compiler-policy.py

      - name: Verify failed compiler probes expose diagnostics
        shell: bash
        run: bash scripts/tests/test-compiler-seed-diagnostics.bash

      - name: Verify Xcode and Command Line Tools search precedence
        shell: bash
        run: bash scripts/tests/test-macos-developer-tools.bash

      - name: Exercise native compiler adapter
        shell: bash
        run: |
          set -euo pipefail
          cc="$(./seeds/cc.sh --print-cc)"
          cxx="$(./seeds/cxx.sh --print-cxx)"
          test -x "$cc"
          test -x "$cxx"
          ./seeds/cc.sh --check
          ./seeds/cxx.sh --check
          cpp="$(./seeds/cpp.sh --print-seed)"
          test "$cpp" = "$cc"
          ./seeds/cpp.sh --check
          test "$(printf '#define WHP_CPP_SMOKE 731\nWHP_CPP_SMOKE\n' |
            WHP_CPP_SEED="$cpp" ./seeds/cpp.sh -P -x c -)" = 731
          if WHP_CPP_SEED="$GITHUB_WORKSPACE/seeds/cpp.sh" \
             ./seeds/cpp.sh --print-seed >/dev/null 2>&1; then
              printf 'error: recursive C preprocessor bridge accepted\n' >&2
              exit 1
          fi
          if WHP_CPP_LOCKED=1 WHP_CPP_SEED="$GITHUB_WORKSPACE/seeds/cpp.sh" \
             ./seeds/cpp.sh -x c - </dev/null >/dev/null 2>&1; then
              printf 'error: locked recursive C preprocessor bridge accepted\n' >&2
              exit 1
          fi

          tmp="$RUNNER_TEMP/whp-cc-adapter"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          printf '%s\n' 'int main(void) { return 0; }' > "$tmp/probe.c"
          ./seeds/cc.sh "$tmp/probe.c" -o "$tmp/probe-c"
          "$tmp/probe-c"

          if [[ "$RUNNER_OS" == macOS ]]; then
            # Test the exact SDK passed to the final compiler, not only
            # the separate seed-validation probe.
            cat > "$tmp/sdk-recording-cc" <<'EOF'
          #!/bin/sh
          if [ -n "${SDKROOT:-}" ]; then
              if [ "${1:-}" != -isysroot ] || [ "${2:-}" != "$SDKROOT" ]; then
                  printf '%s\n' 'error: actual C driver lost selected macOS SDK' >&2
                  exit 79
              fi
          fi
          printf 'SDKROOT=%s\n' "${SDKROOT:-}" >> "$WHP_TEST_SDK_RECORD"
          exec "$WHP_TEST_REAL_CC" "$@"
          EOF
            chmod +x "$tmp/sdk-recording-cc"
            export WHP_TEST_REAL_CC="$cc"
            export WHP_TEST_SDK_RECORD="$tmp/sdk-record"
            WHP_CC_SEED="$tmp/sdk-recording-cc" ./seeds/cc.sh "$tmp/probe.c" -o "$tmp/probe-sdk"
            "$tmp/probe-sdk"
            expected_sdk="$(. ./scripts/whp-build/macos-developer-tools.sh; whp_apple_find_sdk)"
            grep -Fxq "SDKROOT=$expected_sdk" "$tmp/sdk-record"
          fi


          printf '%s\n' 'int main() { return 0; }' > "$tmp/probe.cc"
          ./seeds/cxx.sh -std=c++17 "$tmp/probe.cc" -o "$tmp/probe-cxx"
          "$tmp/probe-cxx"
          if ./seeds/cc.sh --print-cxx || ./seeds/cxx.sh --print-cc; then
              echo "wrong-language selector unexpectedly accepted" >&2; exit 1
          fi

          shim="$tmp/bin"
          mkdir -p "$shim"
          ln -s "$GITHUB_WORKSPACE/seeds/cc.sh" "$shim/cc"
          PATH="$shim:$PATH" WHP_CC_SEED="$cc" \
            "$shim/cc" "$tmp/probe.c" -o "$tmp/probe-shim"
          "$tmp/probe-shim"
          ln -s "$GITHUB_WORKSPACE/seeds/cxx.sh" "$shim/c++"
          PATH="$shim:$PATH" WHP_CXX_SEED="$cxx" "$shim/c++" "$tmp/probe.cc" -o "$tmp/probe-cxx-shim"
          "$tmp/probe-cxx-shim"

          cat > "$tmp/fake-cc" <<'EOF'
          #!/bin/sh
          if [ "$1" = --version ]; then
              echo 'fake cc 1.0'
              exit 0
          fi
          exit 1
          EOF
          chmod +x "$tmp/fake-cc"
          if WHP_CC_SEED="$tmp/fake-cc" ./seeds/cc.sh --print-cc; then
              echo 'fake compiler unexpectedly passed native probe' >&2
              exit 1
          fi
          # C++ selection must not mask an unusable explicitly selected C
          # compiler (notably when macOS xcrun provides a fallback Clang++).
          if WHP_CC_SEED="$tmp/fake-cc" ./seeds/cxx.sh --print-cxx; then
              echo 'C++ probe ignored an unusable explicit C compiler' >&2
              exit 1
          fi

          if WHP_CXX_SEED="$tmp/fake-cc" ./seeds/cxx.sh --print-cxx; then
              echo "fake C++ compiler unexpectedly passed" >&2; exit 1
          fi
          if WHP_CXX_SEED="$GITHUB_WORKSPACE/seeds/cc.sh" ./seeds/cxx.sh --print-cxx; then
              echo "recursive C/C++ adapter unexpectedly passed" >&2; exit 1
          fi
          # A valid pinned C seed must select its adjacent C++ companion,
          # ahead of an unrelated macOS xcrun or system C++ fallback.
          mkdir "$tmp/compiler-pair"
          cat > "$tmp/compiler-pair/clang" <<'EOF'
          #!/bin/sh
          exec "$WHP_TEST_CC" "$@"
          EOF
          cat > "$tmp/compiler-pair/clang++" <<'EOF'
          #!/bin/sh
          exec "$WHP_TEST_CXX" "$@"
          EOF
          chmod +x "$tmp/compiler-pair/clang" "$tmp/compiler-pair/clang++"
          export WHP_TEST_CC="$cc" WHP_TEST_CXX="$cxx"
          paired_cxx="$(WHP_CC_SEED="$tmp/compiler-pair/clang" ./seeds/cxx.sh --print-cxx)"
          test "$paired_cxx" = "$tmp/compiler-pair/clang++"
          WHP_CC_SEED="$tmp/compiler-pair/clang" \
            ./seeds/cxx.sh -std=c++17 "$tmp/probe.cc" -o "$tmp/probe-paired-cxx"
          "$tmp/probe-paired-cxx"

      - name: Exercise native linker adapter
        shell: bash
        run: |
          set -euo pipefail
          linker="$(./seeds/ld.sh --print-ld)"
          test -x "$linker"
          ./seeds/ld.sh --check

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' 'int whp_link_test(void) { return 1; }' > "$tmp/probe.c"
          ./seeds/cc.sh -c "$tmp/probe.c" -o "$tmp/probe.o"
          ./seeds/ld.sh -r -o "$tmp/reloc.o" "$tmp/probe.o"
          test -s "$tmp/reloc.o"

          mkdir "$tmp/shim"
          ln -s "$GITHUB_WORKSPACE/seeds/ld.sh" "$tmp/shim/ld"
          PATH="$tmp/shim:$PATH" WHP_LD_SEED="$linker" \
            "$tmp/shim/ld" --check
          if WHP_LD_SEED="$GITHUB_WORKSPACE/seeds/ld.sh" ./seeds/ld.sh --print-ld; then
            echo 'recursive linker unexpectedly accepted' >&2
            exit 1
          fi
          if WHP_LD_SEED=/bin/false ./seeds/ld.sh --print-ld; then
            echo 'unusable linker unexpectedly accepted' >&2
            exit 1
          fi
